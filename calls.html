<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<title>متابعة عملاء صيدلية السوسي</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>[hidden]{display:none!important}html{color-scheme:dark light}body{margin:0}</style>
<style>
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.gate h2{margin:0;font-size:1.1rem}.gate p{margin:0;color:var(--muted);font-size:.85rem}
.gate input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;direction:ltr;text-align:center;font-size:1.05rem;letter-spacing:.05em}
.gate .err{color:var(--bad);font-size:.85rem;min-height:1.2em}
</style>
<style>
/* Layout: one customer per slide, tier tabs on top, call result saved live for everyone who opens the list. */
:root{
  /* نفس ألوان index: أسطح داكنة، لون واحد للعلامة (أزرق)، وأخضر/برتقالي/أحمر للحالة */
  --bg:#0A0B0D; --card:#141619; --soft:#1C1F24; --line:#25292F;
  --ink:#F2F4F7; --muted:#9BA3AF;
  --accent:#1B92D4; --accent-ink:#04121C;
  --ok:#3DBE8B; --warn:#E8A33D; --bad:#E5646E; --later:#1B92D4;
  --t1:var(--bad); --t2:var(--warn); --t3:var(--accent); --t4:var(--muted);
  --t1-bg:color-mix(in srgb,var(--bad) 16%,var(--card)); --t2-bg:color-mix(in srgb,var(--warn) 16%,var(--card));
  --t3-bg:color-mix(in srgb,var(--accent) 16%,var(--card)); --t4-bg:var(--soft);
  --ok-bg:color-mix(in srgb,var(--ok) 16%,var(--card)); --warn-bg:var(--t2-bg); --bad-bg:var(--t1-bg); --later-bg:var(--t3-bg);
  --mark:#6B5A12; --mark-ink:#FFF3C4;
  --font:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F5F7; --card:#FFFFFF; --soft:#EDEFF2; --line:#E1E4E9;
    --ink:#14171A; --muted:#5A626C;
    --accent:#1272A6; --accent-ink:#FFFFFF;
    --ok:#1E8A5F; --warn:#9A6410; --bad:#C33B47; --later:#1272A6;
    --mark:#FFE58A; --mark-ink:#3B2F00;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F5F7; --card:#FFFFFF; --soft:#EDEFF2; --line:#E1E4E9;
  --ink:#14171A; --muted:#5A626C;
  --accent:#1272A6; --accent-ink:#FFFFFF;
  --ok:#1E8A5F; --warn:#9A6410; --bad:#C33B47; --later:#1272A6;
  --mark:#FFE58A; --mark-ink:#3B2F00;
  color-scheme:light;
}
.brand{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.mark{flex:0 0 auto;width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;padding:3px;overflow:hidden}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand h1{font-size:1.05rem}
.brand .sub{color:var(--muted);margin:0}
.addr{display:flex;flex-direction:column;gap:0;color:var(--muted);font-size:.7rem;text-align:center}
.addr b{color:var(--ink);direction:ltr;unicode-bidi:isolate}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.45rem;font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.75rem;margin:0}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem}
.progress{display:flex;flex-direction:column;gap:5px}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prow{font-size:.85rem}.prow b{font-size:.95rem}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:.72rem;font-weight:600;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.later{background:var(--later-bg);color:var(--later)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:3px 10px;cursor:pointer;text-align:start;white-space:nowrap}
.tab small{color:var(--muted);font-size:.72rem;margin-inline-start:4px}
.tab b{font-size:.82rem;line-height:1.4}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--soft)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:3px 12px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.pos{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.slide{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:1.2rem;font-weight:800;line-height:1.3;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.badge{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:99px;white-space:nowrap}
.t1{background:var(--t1-bg);color:var(--t1)} .t2{background:var(--t2-bg);color:var(--t2)} .t3{background:var(--t3-bg);color:var(--t3)} .t4{background:var(--t4-bg);color:var(--t4)}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-size:1.2rem;font-weight:800;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:.85rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:flex;flex-wrap:wrap;gap:5px}
.stat{background:var(--soft);border-radius:8px;padding:1px 9px;min-width:0;display:flex;gap:5px;align-items:baseline}
.stat small{color:var(--muted);font-size:.72rem}
.stat b{font-size:.85rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.late{font-weight:700}
.sec h3{font-size:.74rem;margin:0 0 3px;color:var(--muted);font-weight:600}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:var(--soft);border-radius:8px;padding:2px 8px}
.list .en{direction:ltr;unicode-bidi:isolate;font-weight:600;font-size:.8rem;text-align:left;overflow-wrap:anywhere;min-width:0}
.list .dd{color:var(--t1);font-weight:700;font-size:.78rem;white-space:nowrap}
.hint{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:600}
details.script{border:1.5px solid var(--line);border-radius:10px;padding:0 10px}
details.script summary{cursor:pointer;font-weight:700;font-size:.88rem;padding:5px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.script summary::-webkit-details-marker{display:none}
details.script summary::after{content:"＋";color:var(--muted)}
details.script[open] summary::after{content:"－"}
.sbody{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.sbody h4{margin:0 0 4px;font-size:.92rem}
.sbody ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.sbody p{margin:0;font-size:.95rem}
.rule{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.88rem}
mark{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:4px;font-weight:700}
.result{display:flex;flex-direction:column;gap:6px;border-top:1.5px solid var(--line);padding-top:8px}
.result label{font-weight:700;font-size:.9rem}
textarea{width:100%;min-height:38px;height:38px;resize:vertical;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:.88rem}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px 2px;cursor:pointer;font-weight:700;font-size:.8rem;min-height:44px;line-height:1.25}
.opt.ok{color:var(--ok)} .opt.warn{color:var(--warn)} .opt.bad{color:var(--bad)} .opt.later{color:var(--later)}
.opt[aria-pressed="true"].ok{background:var(--ok-bg);border-color:var(--ok)}
.opt[aria-pressed="true"].warn{background:var(--warn-bg);border-color:var(--warn)}
.opt[aria-pressed="true"].bad{background:var(--bad-bg);border-color:var(--bad)}
.opt[aria-pressed="true"].later{background:var(--later-bg);border-color:var(--later)}
.saved{font-size:.82rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav .btn{flex:1;justify-content:center}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start;width:100%}
.row .rn{font-weight:700;overflow-wrap:anywhere;min-width:0}
.row .rs{color:var(--muted);font-size:.8rem;direction:ltr;unicode-bidi:isolate;text-align:right}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.78rem;text-align:center}
@media (max-width:420px){.name{font-size:1.3rem}.num{font-size:1.25rem}}
@media (prefers-reduced-motion:no-preference){.slide{transition:opacity .15s}}
</style>

</head>

const TIERS = {1:{n:'مزمن متأخر',d:'دوا شهري عدّى ميعاده'},2:{n:'باقي الغايبين',d:'غاب 30 يوم أو أكتر'},3:{n:'VIP منقطع',d:'زبون كبير غاب'},4:{n:'منتظمين غايبين',d:'زيارات كتير وغاب 30 يوم'}};
const ST = {done:{t:'اتكلمنا',c:'ok'},noanswer:{t:'مردش',c:'warn'},later:{t:'موعد تاني',c:'later'},wrong:{t:'رقم غلط',c:'bad'}};
const BLK = {t:'محظور',c:'bad'};
const EXPIRE = 60*86400000;
const CLOSED = s => s==='done' || s==='wrong';
const S = {tab:0, view:'slide', left:true, cur:null, calls:{}, live:false};
const $ = id => document.getElementById(id);
const key = p => 'p'+p;
const fmt = n => Number(n).toLocaleString('en-US');
const dmy = iso => { const a=iso.split('-'); return a[2]+'/'+a[1]+'/'+a[0]; };
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
let store = null;

/* ---------- storage: shared db when available, else this browser ---------- */
function lsGet(){ try{ return JSON.parse(localStorage.getItem('calls-v1')||'{}'); }catch(e){ return {}; } }
function lsSet(o){ try{ localStorage.setItem('calls-v1', JSON.stringify(o)); }catch(e){} }
const API = 'https://script.google.com/macros/s/AKfycbyETI5UTPwpMFOu-aWoKKHqyppa7ctTVJjckmbTxegDq7E3R3p6aEBzqt275HNL8SBfWg/exec';
let HK = {}, KH = {}, pending = 0, synced = false, listOk = false;
const l10 = p => String(p).replace(/\D/g,'').slice(-10);
async function hashKey(p){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('calls|'+l10(p)));
  return Array.from(new Uint8Array(d)).slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function api(params){
  const r = await fetch(API+'?'+new URLSearchParams(params));
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'x'); return j;
}
async function push(p, rec){
  pending++;
  try{
    if(!HK[p]) HK[p] = await hashKey(p);
    await api({action:'callsSet', key:HK[p], status:rec?rec.status:'', note:rec?(rec.note||''):''}); showNotice('');
  }
  catch(e){ showNotice('تعذر الحفظ على السيرفر. النتيجة محفوظة على الجهاز، جرّب تاني بعد لحظة.'); }
  finally{ pending--; }
}
async function saveCall(p, rec){
  rec.at = Date.now(); S.calls[key(p)] = rec; lsSet(S.calls); render(); await push(p, rec);
}
async function clearCall(p){
  delete S.calls[key(p)]; lsSet(S.calls); render(); await push(p, null);
}
async function pullList(){
  const j = await api({action:'callsList'});
  for(const r of j.list){ if(!HK[r.p]){ const h = await hashKey(r.p); HK[r.p] = h; KH[h] = r.p; } }
  DATA = j.list; listOk = true;
}
async function pull(withList){
  if(pending || document.hidden) return;
  try{
    if(withList){ try{ await pullList(); }catch(e){ if(!listOk) showNotice('القايمة الحية مش متاحة دلوقتي. المعروض آخر نسخة محفوظة.'); } }
    const j = await api({action:'callsGet'}); if(pending) return;
    const o = {};
    for(const h in j.calls){
      if(!KH[h]) continue;
      const v = j.calls[h];
      if(v.status!=='blocked' && v.at && Date.now()-v.at > EXPIRE) continue;   /* النتيجة بتنتهي بعد 60 يوم */
      o[key(KH[h])] = v;
    }
    S.calls = o; lsSet(o); S.live = true; synced = true; if(listOk) showNotice(''); render();
  }catch(e){ if(!synced) showNotice('مفيش اتصال بالسيرفر دلوقتي. النتايج المعروضة من الجهاز ده.'); }
}
function showNotice(t){ const n=$('notice'); n.textContent=t; n.hidden=!t; }

/* ---------- derived ---------- */
const stat = p => (S.calls[key(p)]||{}).status || '';
function visible(){
  if(S.tab===5) return DATA.filter(r => stat(r.p)==='blocked');
  return DATA.filter(r => stat(r.p)!=='blocked' && (S.tab===0 || r.t===S.tab) && (!S.left || !CLOSED(stat(r.p))));
}
function curIndex(list){
  let i = list.findIndex(r=>r.p===S.cur);
  if(i<0){ i = Math.min(S.idx||0, Math.max(list.length-1,0)); S.cur = list[i] ? list[i].p : null; }
  S.idx = i; return i;
}

/* ---------- render ---------- */
function renderProgress(){
  const LIVE = DATA.filter(r=>stat(r.p)!=='blocked');
  const total = LIVE.length || 1, ok = DATA.filter(r=>stat(r.p)==='done').length, bad = DATA.filter(r=>stat(r.p)==='wrong').length;
  const done = ok+bad, pct = total ? Math.round(done/total*100) : 0;
  $('pdone').textContent = done; $('ptotal').textContent = total; $('ppct').textContent = pct+'%';
  $('pbok').style.width = (ok/total*100)+'%'; $('pbbad').style.width = (bad/total*100)+'%';
  $('pbar').setAttribute('aria-valuenow', pct);
  const box = $('pchips'); box.textContent='';
  for(const k of Object.keys(ST)){
    const n = DATA.filter(r=>stat(r.p)===k).length;
    box.append(el('span','chip '+ST[k].c, ST[k].t+' '+n));
  }
  box.append(el('span','chip', 'لسه '+DATA.filter(r=>!stat(r.p)).length));
}
function renderTabs(){
  const box = $('tabs'); box.textContent='';
  const mk = (id,title,sub,list) => {
    const b = el('button','tab'); b.setAttribute('role','tab'); b.setAttribute('aria-selected', S.tab===id);
    const d = list.filter(r=>CLOSED(stat(r.p))).length;
    b.append(el('b',null,title), el('small',null, d+'/'+list.length));
    b.onclick = () => { S.tab=id; S.cur=null; S.idx=0; render(); };
    box.append(b);
  };
  mk(0,'الكل','',DATA.filter(r=>stat(r.p)!=='blocked'));
  for(const t of [1,2]) mk(t, t+' · '+TIERS[t].n, '', DATA.filter(r=>r.t===t && stat(r.p)!=='blocked'));
  const bl = DATA.filter(r=>stat(r.p)==='blocked');
  if(bl.length){ const b = el('button','tab'); b.setAttribute('role','tab'); b.setAttribute('aria-selected', S.tab===5); b.append(el('b',null,'المحظورين'), el('small',null,String(bl.length))); b.onclick = () => { S.tab=5; S.cur=null; S.idx=0; render(); }; box.append(b); }
}
function scriptBlock(c){

    2:['VIP / زبون دايم',[

      'إزي حضرتك وإزي البيبي؟ حضرتك كنتي بتجيبي [اللبن/البامبرز] من عندنا.',

      'ونقدر نوصلهولك البيت مجاناً، ولو تحبي نحجزلك علبتك كل مرة.',

function addText(node, txt){
  const re = /\[خصم X% – يحدده د\/أحمد\]/g; let last=0, m;
  while((m = re.exec(txt))){ if(m.index>last) node.append(document.createTextNode(txt.slice(last,m.index))); node.append(el('mark',null,m[0])); last = m.index+m[0].length; }
  if(last<txt.length) node.append(document.createTextNode(txt.slice(last)));
}
function copyText(t, btn){
  const done = () => { const o=btn.textContent; btn.textContent='اتنسخ'; setTimeout(()=>btn.textContent=o,1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,()=>{ selectNum(); }); }
  else selectNum();
}
function selectNum(){ const n=document.querySelector('.num'); if(n){ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }

function slideFor(r, list, i){
  const rec = S.calls[key(r.p)] || {};
  const card = el('article','slide');
  const top = el('div','top');
  top.append(el('h2','name',r.n || 'بدون اسم'), el('span','badge t'+r.t, r.t+' · '+TIERS[r.t].n));
  if(r.vip) top.append(el('span','badge t3','VIP'));
  card.append(top);

  const ph = el('div','phone');
  ph.append(el('span','num',r.p));
  const cp = el('button','btn','نسخ'); cp.onclick = () => copyText(r.p, cp);
  const a = el('a','btn primary','اتصال'); a.href = 'tel:'+r.p;
  ph.append(cp, a); card.append(ph);

  if(r.b) card.append(el('div','hint','اشترى بعد 22/10. غالباً مش محتاج مكالمة، اتأكد الأول.'));

  const st = el('div','stats');
  const mkStat = (l,v,cls) => { const s=el('div','stat'); s.append(el('small',null,l)); s.append(el('b',cls,v)); return s; };
  st.append(mkStat('آخر زيارة', dmy(r.l).slice(0,5)), mkStat('بقاله', r.d+' يوم','late'), mkStat('زيارات', String(r.v)), mkStat('اشترى', fmt(r.s)+' جنيه'));
  card.append(st);

  if(r.m && r.m.length){
    const s = el('div','sec'); s.append(el('h3',null,'دوا شهري متأخر'));
    const ul = el('ul','list');
    r.m.forEach(([n,d])=>{ const li=el('li'); li.append(el('span','dd','متأخر '+d+' يوم'), el('span','en',n)); ul.append(li); });
    s.append(ul); card.append(s);
  }
  if(r.o && r.o.length){
    const s = el('div','sec'); s.append(el('h3',null,'أكتر حاجات كان بيشتريها'));
    const ul = el('ul','list');
    r.o.forEach(n=>{ const li=el('li'); li.append(el('span','en',n)); ul.append(li); });
    s.append(ul); card.append(s);
  } else if(r.t===4){
    const s = el('div','sec'); s.append(el('h3',null,'مفيش تفاصيل أصناف للعميل ده. اسأله عن احتياجه.')); card.append(s);
  }

  card.append(scriptBlock(r.c));

  const res = el('div','result');
  
  const ta = el('textarea'); ta.id='note'; ta.placeholder='ملاحظة (سبب البعد، الاتفاق، الميعاد)'; ta.value = (S.draft && S.draft.p===r.p) ? S.draft.v : (rec.note || ''); ta.oninput = () => { S.draft = {p:r.p, v:ta.value}; };
  const opts = el('div','opts');
  if(rec.status!=='blocked') Object.keys(ST).forEach(k=>{
    const b = el('button','opt '+ST[k].c, ST[k].t); b.setAttribute('aria-pressed', rec.status===k);
    b.onclick = () => { S.draft = null; S.idx = i; saveCall(r.p,{status:k,note:ta.value.trim(),at:Date.now()}); if(!(CLOSED(k) && S.left)) go(1); };
    opts.append(b);
  });
  res.append(ta, opts);
  const bk = el('button','btn', rec.status==='blocked' ? 'رجّعه للقايمة' : 'حظر العميل');
  bk.onclick = () => {
    if(rec.status==='blocked'){ clearCall(r.p); return; }
    if(!confirm('حظر '+(r.n||r.p)+'؟ هيختفي من القايمة ومش هيظهر تاني (تقدر ترجّعه من تبويب المحظورين).')) return;
    S.draft = null; S.idx = i; saveCall(r.p,{status:'blocked',note:ta.value.trim(),at:Date.now()});
  };
  res.append(bk);
  const row = el('div','ctrl');
  const info = el('span','saved', rec.at ? 'اتحفظ '+new Date(rec.at).toLocaleString('ar-EG',{day:'numeric',month:'numeric',hour:'numeric',minute:'2-digit'}) : 'لسه متكلمش');
  row.append(info);
  const act = el('div','chips');
  if(rec.status){ const sv = el('button','btn','حفظ الملاحظة'); sv.onclick = () => saveCall(r.p,{status:rec.status,note:ta.value.trim(),at:Date.now()}); const cl = el('button','btn','مسح النتيجة'); cl.onclick = () => clearCall(r.p); act.append(sv,cl); }
  row.append(act); res.append(row);
  card.append(res);
  return card;
}
function go(d, skip){
  const list = visible(); if(!list.length) return;
  let i = curIndex(list); i = (i+d+list.length)%list.length; S.cur = list[i].p; S.idx=i; render(true);
}
function renderMain(top){
  const main = $('main'); main.textContent='';
  const list = visible();
  if(!list.length){
    const e = el('div','empty');
    e.append(el('b',null, S.left ? 'خلصت كل المتابعات في المستوى ده' : 'مفيش عملاء هنا'));
    if(S.left){ e.append(el('br'), document.createTextNode('شيل علامة "المتبقي بس" عشان تراجع اللي اتعمل.')); }
    main.append(e); return;
  }
  if(S.view==='list'){
    const rows = el('div','rows');
    list.forEach(r=>{
      const b = el('button','row'); const s = stat(r.p);
      const left = el('div'); left.append(el('div','rn',r.n||'بدون اسم'), el('div','rs',r.p+' · '+r.d+' يوم'));
      const right = el('div','chips');
      right.append(el('span','badge t'+r.t, String(r.t)));
      if(s) right.append(el('span','chip '+(ST[s]||BLK).c, (ST[s]||BLK).t));
      b.append(left,right); b.onclick = () => { S.cur=r.p; S.view='slide'; render(true); };
      rows.append(b);
    });
    main.append(rows); return;
  }
  const i = curIndex(list), r = list[i];
  const ctrl = el('div','ctrl');
  ctrl.append(el('span','pos', 'العميل '+(i+1)+' من '+list.length));
  main.append(ctrl, slideFor(r,list,i));
  const nav = el('div','nav');
  const pv = el('button','btn','السابق'); pv.onclick = () => go(-1);
  const nx = el('button','btn primary','التالي'); nx.onclick = () => go(1);
  nav.append(pv,nx); main.style.display='flex'; main.style.flexDirection='column'; main.style.gap='12px'; main.append(nav);
}
function render(scrollTop){
  const hadOpen = document.getElementById('script') && document.getElementById('script').open;
  const noteVal = document.getElementById('note') ? document.getElementById('note').value : null;
  renderProgress(); renderTabs(); renderMain();
  $('vSlide').setAttribute('aria-pressed', S.view==='slide'); $('vList').setAttribute('aria-pressed', S.view==='list');
  const sc = document.getElementById('script'); if(sc && hadOpen) sc.open = true;
  if(scrollTop) window.scrollTo({top:0});
}
$('vSlide').onclick = () => { S.view='slide'; render(); };
$('vList').onclick = () => { S.view='list'; render(); };
$('onlyLeft').onchange = e => { S.left = e.target.checked; render(); };
document.addEventListener('keydown', e => { if(S.view!=='slide') return; if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return; if(e.key==='ArrowLeft') go(1); if(e.key==='ArrowRight') go(-1); });

/* ---------- boot ---------- */
function start(){
S.calls = lsGet();
render();
(async () => {
  for(const r of DATA){ const h = await hashKey(r.p); HK[r.p] = h; KH[h] = r.p; }
  await pull(true);
  let n = 0;
  setInterval(() => pull(++n % 4 === 0), 15000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) pull(true); });
})();
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.s), iterations:BLOB.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.i)}, key, b64(BLOB.c));
  DATA = JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(pw){
  try{ await unlock(pw); document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false; try{ sessionStorage.setItem('cl-pw', pw); }catch(e){} start(); return true; }
  catch(e){ return false; }
}
document.getElementById('gf').addEventListener('submit', async e => {
  e.preventDefault(); const err = document.getElementById('ge'); err.textContent = '';
  const ok = await tryUnlock(document.getElementById('gp').value.trim());
  if(!ok) err.textContent = 'كلمة السر غلط. جرّب تاني.';
});
