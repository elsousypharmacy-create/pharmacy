<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>جرد المخزون</title>
<style>
/* ══════════════════════════════════════════════════════════
   شاشة الجرد — مصمّمة للموظف واقف قدام الرف ماسك الموبايل بإيد.
   المبادئ: خط أكبر من الداشبورد، لمسات أقل، شاشة واحدة في المرة،
   وصفر نوافذ متصفح (prompt/alert) — كلها شيتات من تحت.
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F24; --line:#25292F;
  --ink:#F2F4F7; --ink-2:#9BA3AF; --ink-3:#5F6670;
  --brand:#1B92D4; --ok:#3DBE8B; --warn:#E8A33D; --bad:#E5646E;
  --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --r2:14px; --r3:20px;
  /* أكبر من الداشبورد — الموظف بيبص بسرعة من مسافة */
  --t-small:14px; --t-body:17px; --t-title:20px; --t-head:26px; --t-huge:44px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:var(--t-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* ── الرأس ── */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);
  padding-top:calc(var(--s3) + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:var(--bg);
}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:var(--t-title);font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{font-size:var(--t-small);color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{
  width:46px;height:46px;flex:0 0 auto;border:0;border-radius:var(--r2);
  background:var(--surface-2);display:grid;place-items:center;font-size:22px;
}
.ib.go{background:var(--ok);color:#fff}

/* ── الجسم ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--s4);padding-bottom:var(--s6)}

/* ── الأزرار ── */
.btn{
  display:block;width:100%;border:0;border-radius:var(--r3);
  padding:var(--s5);font-size:var(--t-title);font-weight:700;
  background:var(--surface-2);color:var(--ink);margin-bottom:var(--s3);
  text-align:center;line-height:1.35;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.go{background:var(--ok);color:#fff}
.btn small{display:block;font-size:var(--t-small);font-weight:400;opacity:.8;margin-top:4px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4}
.btn.side{text-align:right}

/* ── حقول ── */
.fld{
  width:100%;padding:var(--s4);border-radius:var(--r2);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:var(--t-body);margin-bottom:var(--s3);
}
.fld:focus{outline:0;border-color:var(--brand)}
.lbl{font-size:var(--t-small);color:var(--ink-3);font-weight:700;
  margin:var(--s5) 0 var(--s2)}

/* ── اختيار الموظف ── */
.picks{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)}
.pick{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:12px 18px;font-size:var(--t-body);font-weight:600;
}
.pick.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── بطاقة آخر صنف ── */
.card{background:var(--surface);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s3)}
.card .nm{font-size:var(--t-title);font-weight:700;line-height:1.3}
.card .sub{font-size:var(--t-small);color:var(--ink-2);margin-top:6px}

/* عدّاد كبير */
.counter{display:flex;align-items:center;justify-content:center;
  gap:var(--s5);margin:var(--s5) 0 var(--s3)}
.counter b{font-size:var(--t-huge);font-weight:800;min-width:80px;text-align:center;
  font-variant-numeric:tabular-nums}
.counter .qty{
  width:120px;padding:14px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:var(--t-head);
  text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.counter .qty:focus{outline:0;border-color:var(--brand)}
.step{width:62px;height:62px;border:0;border-radius:var(--r2);
  background:var(--surface-2);font-size:30px;font-weight:600;display:grid;place-items:center}
.step:active{background:var(--brand);color:#fff}

/* صف دفعة */
.bt{display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) 0;border-top:1px solid var(--line)}
.bt .ex{flex:1;min-width:0}
.bt .ex b{display:block;font-size:var(--t-body);font-weight:700}
.bt .ex small{color:var(--ink-3);font-size:var(--t-small)}
.bt input{width:92px;padding:14px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:var(--t-title);
  text-align:center;font-weight:700}
.bt input:focus{outline:0;border-color:var(--brand)}

/* ── صفوف ── */
.row{display:flex;align-items:center;gap:var(--s3);
  padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:var(--t-body);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--ink-3);font-size:var(--t-small);margin-top:2px}
.tag{padding:7px 14px;border-radius:99px;font-size:var(--t-small);font-weight:700;flex:0 0 auto}
.tag.ok{background:rgba(61,190,139,.15);color:var(--ok)}
.tag.warn{background:rgba(232,163,61,.15);color:var(--warn)}
.tag.bad{background:rgba(229,100,110,.15);color:var(--bad)}

/* ── شريط الإجماليات ── */
.tot{flex:0 0 auto;display:flex;background:var(--surface);
  border-top:1px solid var(--line);
  padding:var(--s3) var(--s4);
  padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom))}
.tot div{flex:1;text-align:center}
.tot b{display:block;font-size:var(--t-head);font-weight:800;font-variant-numeric:tabular-nums}
.tot small{color:var(--ink-3);font-size:var(--t-small)}

/* ── الكاميرا ── */
/* الكاميرا ملء الشاشة.
   الإطار والتعتيم بقوا عنصر واحد بـbox-shadow ضخم بدل mask —
   الـmask كان بيتحسب بنسبة مئوية والإطار بـtop ثابت، فكانوا
   بيفترقوا عن بعض على مقاسات الشاشات المختلفة. */
#cam{position:fixed;inset:0;z-index:60;background:#000;display:none}
#cam.on{display:block}
#video{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000}
.frame{
  position:absolute;top:50%;left:7%;right:7%;height:150px;
  transform:translateY(-50%);
  border:3px solid rgba(255,255,255,.95);border-radius:var(--r2);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.55);   /* التعتيم من نفس العنصر */
  pointer-events:none}
.frame::after{
  content:'';position:absolute;top:50%;left:10px;right:10px;height:2px;
  background:rgba(255,60,60,.85);transform:translateY(-50%);
  box-shadow:0 0 8px rgba(255,60,60,.6)}
.camtop{position:absolute;top:0;left:0;right:0;z-index:2;
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s4);
  background:linear-gradient(rgba(0,0,0,.75),transparent)}
.camtop .hint{color:#fff;font-size:var(--t-body);text-align:center}
.cambot{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:var(--s4);padding-bottom:calc(var(--s4) + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.88) 35%)}
.flash{background:var(--surface);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s3);min-height:76px}
.flash .nm{font-size:var(--t-title);font-weight:700;line-height:1.3}
.flash .sub{font-size:var(--t-small);color:var(--ink-2);margin-top:4px}
.flash.bad{background:rgba(229,100,110,.2)}

/* ── شيت من تحت (بديل prompt) ── */
.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;
  background:var(--surface);border-radius:var(--r3) var(--r3) 0 0;
  padding:var(--s5) var(--s4);
  padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom));
  max-height:88%;overflow-y:auto}
.sheet h2{font-size:var(--t-title);font-weight:700;margin-bottom:var(--s4)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);
  margin:0 auto var(--s4)}

/* ── حالات ── */
.state{text-align:center;color:var(--ink-3);padding:var(--s6) var(--s4);
  font-size:var(--t-body);line-height:1.6}
.state.err{color:var(--bad)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:99px;animation:sp .7s linear infinite;margin:0 auto var(--s3)}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{width:9px;height:9px;border-radius:99px;background:var(--ok);
  display:inline-block;margin-inline-end:7px}
</style>
</head>
<body>

<div class="top">
  <button class="ib" id="back" onclick="goBack()">‹</button>
  <div class="ttl"><h1 id="hTitle">جرد المخزون</h1><p id="hSub">صيدلية السوسي</p></div>
  <button class="ib go" id="done" onclick="askFinish()" style="display:none">✓</button>
</div>

<div class="body" id="main"></div>

<div class="tot" id="tot" style="display:none">
  <div><b id="tI">0</b><small>صنف</small></div>
  <div><b id="tU">0</b><small>علبة</small></div>
  <div><b id="tD">0</b><small>فرق</small></div>
</div>

<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="camtop"><div class="hint" id="hint">وجّه الكاميرا على الباركود</div></div>
  <div class="cambot">
    <div class="flash" id="flash"><div class="state" style="padding:6px">مستني المسح…</div></div>
    <button class="btn" onclick="stopCam()">إقفال الكاميرا</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="bd" onclick="closeSheet()"></div>
  <div class="pn"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyETI5UTPwpMFOu-aWoKKHqyppa7ctTVJjckmbTxegDq7E3R3p6aEBzqt275HNL8SBfWg/exec';

var S = { id:null, title:'', by:'', lines:{}, last:null };
var STAFF = [], reader = null, busy = false, lastCode = '', lastAt = 0, scans = 0, syncing = false;

/* ── مساعدات ── */
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n(v){ return '<span class="n">' +
  (Math.round((+v||0)*100)/100).toLocaleString('en-US') + '</span>'; }
function feedback(ok){
  try{
    var c = new (window.AudioContext||window.webkitAudioContext)();
    var o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = ok ? 920 : 220;
    g.gain.setValueAtTime(.22, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.01, c.currentTime + .15);
    o.start(); o.stop(c.currentTime + .15);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok ? 35 : [70,60,70]); }catch(e){}
}
function api(a,p){
  var u = API + '?action=' + a;
  for (var k in (p||{})) if (p[k]!=null) u += '&'+k+'='+encodeURIComponent(p[k]);
  return fetch(u + '&_ts=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); });
}
function post(b){
  return fetch(API, { method:'POST',
    /* text/plain عشان المتصفح ميبعتش preflight — Apps Script مبيردش عليه */
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(b) }).then(function(r){ return r.json(); });
}

/* ── الشيت (بديل prompt/alert) ── */
function openSheet(html){ $('sheetBody').innerHTML = html; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
function say(title, msg, btn){
  openSheet('<h2>' + esc(title) + '</h2><div class="state">' + esc(msg) + '</div>' +
    '<button class="btn primary" onclick="closeSheet()">' + (btn||'تمام') + '</button>');
}

/* ── التخزين ── */
function save(){ try{ localStorage.setItem('scan_s', JSON.stringify(S)); }catch(e){} }
function load(){ try{ var r=localStorage.getItem('scan_s');
  if(r){ var o=JSON.parse(r); if(o&&o.id){ S=o; return true; } } }catch(e){} return false; }
function wipe(){ try{ localStorage.removeItem('scan_s'); }catch(e){} }

/* رفع كل 10 مسحات — لو الموبايل وقع تخسر 10 بالكتير، وأي زميل يكمّل */
function sync(force){
  if (!S.id || syncing) return;
  if (!force && (++scans % 10) !== 0) return;
  syncing = true;
  post({ action:'saveOpen', sessionId:S.id, title:S.title, by:S.by,
    lines: Object.keys(S.lines).map(function(k){ var L=S.lines[k];
      return {code:L.code,name:L.name,expire:L.expire,qty:L.qty,
              sys:L.sys,isNew:L.isNew,who:L.who||'',at:L.at||0}; }) })
  .then(function(){ syncing=false; }).catch(function(){ syncing=false; });
}

/* ══════════ ١) شاشة البداية ══════════ */
function screenStart(){
  stopCam();
  $('tot').style.display='none'; $('done').style.display='none';
  $('back').style.visibility='hidden';
  $('hTitle').textContent='جرد المخزون'; $('hSub').textContent='صيدلية السوسي';
  $('main').innerHTML = '<div class="state"><div class="spin"></div>بيحمّل…</div>';

  Promise.all([ api('openCounts', S.by?{by:S.by}:{}).catch(function(){return null;}),
                STAFF.length ? {ok:true,staff:STAFF} : api('scanStaff').catch(function(){return null;}) ])
  .then(function(r){
    if (r[1] && r[1].ok) STAFF = r[1].staff || [];
    if (r[0] && r[0].ok) TOTAL = r[0].total || 0;
    drawStart(r[0] && r[0].ok ? (r[0].open||[]) : null);
  });
}

var OPEN = [], TOTAL = 0;

/* اسم الجرد بيتولّد من الشهر — مفيش تسمية يدوية.
   الجرد عملية مستمرة، مش حدث بيتسمّى كل مرة. */
function monthTitle(){
  var M = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
           'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var d = new Date();
  return 'جرد ' + M[d.getMonth()] + ' ' + d.getFullYear();
}
function monthId(){
  var d = new Date();
  return 'M' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2);
}

function drawStart(open){
  OPEN = open || [];
  var h = '<div class="lbl" style="margin-top:0">مين بيجرد؟</div>' +
    '<div class="picks" id="who">' +
      STAFF.map(function(s){
        var on = (S.by === s.name) ? ' on' : '';
        return '<button class="pick' + on + '" data-nm="' + esc(s.name) +
          '" onclick="pickWho(this)">' + esc(s.name) + '</button>'; }).join('') +
    '</div>';

  var cur = OPEN.filter(function(x){ return x.id === monthId(); })[0];

  if (cur){
    var pct = TOTAL ? Math.round(cur.lines/TOTAL*100) : 0;
    h += '<div class="lbl">الجرد الشغال</div>' +
      '<button class="btn primary" onclick="resume(\'' + esc(cur.id) + '\')">' +
      esc(cur.title) + '<small>' + cur.lines + ' من ' + n(TOTAL) + ' صنف · ' +
      pct + '٪' + agoTxt(cur) + '</small></button>' +
      recentBlock(cur);
  } else if (open === null && S.id && Object.keys(S.lines).length){
    h += '<div class="lbl">محفوظ على الموبايل</div>' +
      '<button class="btn primary" onclick="screenCount()">' + esc(S.title) +
      '<small>' + Object.keys(S.lines).length + ' صنف · النت مش راضي</small></button>';
  } else {
    h += '<div class="lbl">' + monthTitle() + '</div>' +
      '<button class="btn primary" onclick="startNew()">ابدأ الجرد</button>';
  }

  /* جرود شهور فاتت لسه مفتوحة */
  var old_ = OPEN.filter(function(x){ return x.id !== monthId(); });
  if (old_.length){
    h += '<div class="lbl">شهور فاتت لسه مفتوحة</div>';
    h += old_.map(function(x){
      return '<div style="display:flex;gap:8px;align-items:stretch;margin-bottom:12px">' +
        '<button class="btn side" style="margin:0;flex:1" onclick="resume(\'' + esc(x.id) +
        '\')">' + esc(x.title) + '<small>' + x.lines + ' صنف' + agoTxt(x) +
        '</small></button>' +
        '<button class="btn" style="margin:0;width:64px;padding:0;font-size:22px" ' +
        'onclick="askDrop(\'' + esc(x.id) + '\',\'' +
        esc(String(x.title||'').replace(/'/g,'')) + '\')">🗑</button></div>';
    }).join('');
  }
  $('main').innerHTML = h;
}

/* آخر 5 أصناف — الموظف يبص عليهم ويفتكر هو كان واقف فين.
   لو اختار اسمه، بيشوف آخر 5 بتوعه هو مش بتوع الكل. */
function recentBlock(x){
  var list = (S.by && x.mine && x.mine.length) ? x.mine : (x.recent||[]);
  if (!list.length) return '';
  var mine = !!(S.by && x.mine && x.mine.length);
  return '<div class="lbl">' + (mine ? 'آخر ٥ عدّيتهم' : 'آخر ٥ اتعدّوا') + '</div>' +
    list.map(function(L){
      return '<div class="row"><div class="m"><b>' + esc(L.name) + '</b><small>' +
        (L.expire?esc(L.expire)+' · ':'') + 'عدّ ' + n(L.qty) +
        (ago(L.at) ? ' · ' + ago(L.at) : '') + '</small></div></div>';
    }).join('');
}

function pickWho(el){
  var all = document.querySelectorAll('#who .pick');
  for (var i=0;i<all.length;i++) all[i].classList.remove('on');
  el.classList.add('on');
  S.by = el.dataset.nm;
  save();
  /* نعيد الرسم عشان يشوف آخر 5 بتوعه هو */
  api('openCounts', { by: S.by }).then(function(d){
    if (d && d.ok){ TOTAL = d.total || TOTAL; drawStart(d.open||[]); }
  }).catch(function(){});
}

/* الصيغة "2026-08-09 14:01:22" بيفشل تحويلها في Safari وبترجع NaN.
   بنجرب الرقم الأول، وبعدين النص بصيغة ISO، وآخر حاجة نسيبها فاضية
   بدل ما نطبع NaN. */
function ago(t){
  var ms = 0;
  if (typeof t === 'number' && isFinite(t) && t > 0) ms = t;
  else if (t){
    var str = String(t).trim();
    ms = new Date(str.replace(' ','T')).getTime();
    if (!isFinite(ms)) ms = new Date(str).getTime();
  }
  if (!isFinite(ms) || ms <= 0) return '';
  var m = Math.round((Date.now() - ms)/60000);
  if (m < 0) return 'دلوقتي';
  if (m < 1) return 'دلوقتي';
  if (m < 60) return 'من ' + m + ' دقيقة';
  var hh = Math.round(m/60);
  if (hh < 24) return 'من ' + hh + ' ساعة';
  return 'من ' + Math.round(hh/24) + ' يوم';
}
function agoTxt(x){
  var a = ago(x.updatedMs || x.updated);
  return a ? (' · آخر مسحة ' + a) : '';
}

function startNew(){
  var sel = document.querySelector('#who .pick.on');
  if (!sel){ say('ناقص حاجة','اختار اسمك من القايمة الأول'); return; }
  S = { id: monthId(), title: monthTitle(), by: sel.dataset.nm,
        lines:{}, order:[], last:null };
  save(); screenCount(); startCam();
}

function resume(id){
  var sel = document.querySelector('#who .pick.on');
  if (!sel && !S.by){ say('ناقص حاجة','اختار اسمك من القايمة الأول'); return; }
  var me = sel ? sel.dataset.nm : S.by;

  $('main').innerHTML = '<div class="state"><div class="spin"></div>بيفتح…</div>';
  api('loadCount',{session:id}).then(function(d){
    if (!d || !d.ok){ say('مقدرتش','الجرد ده مش موجود'); screenStart(); return; }
    S = { id:d.sessionId, title:d.title, by:me, lines:{}, order:[], last:null };
    (d.lines||[]).forEach(function(L){
      var k = L.code+'|'+(L.expire||'');
      S.lines[k] = { code:L.code, name:L.name||'', expire:L.expire||'',
        qty:+L.qty||0, sys:+L.sys||0, isNew:!!L.isNew,
        who:L.who||'', at:L.at||0 };
      S.order.push(k);
    });
    save(); screenCount(); startCam();
  }).catch(function(){ say('النت','مش راضي يفتح — جرب تاني'); screenStart(); });
}

/* ══════════ ٢) شاشة الجرد ══════════ */
function screenCount(){
  $('tot').style.display='flex'; $('done').style.display='grid';
  $('back').style.visibility='visible';
  $('hTitle').textContent = S.title;
  $('hSub').textContent = S.by || '';
  draw();
}

function draw(){
  var keys = Object.keys(S.lines), items = {}, units = 0, diffs = 0;
  keys.forEach(function(k){ var L=S.lines[k];
    items[L.code]=1; units+=L.qty;
    if (Math.abs(L.qty-L.sys)>.001) diffs++; });
  var cnt = Object.keys(items).length;
  $('tI').innerHTML = cnt + (TOTAL ? '<small style="font-size:12px;opacity:.6">/' +
    TOTAL + '</small>' : '');
  $('tU').textContent = Math.round(units);
  $('tD').textContent = diffs;

  var h = '<button class="btn primary" onclick="startCam()">📷 امسح باركود</button>' +
          '<button class="btn" onclick="openFind()">بحث بالاسم</button>';
  if (S.last) h += lastCard(S.last);

  if (keys.length){
    h += '<div class="lbl">اللي اتعدّ</div>';
    h += keys.slice().reverse().map(function(k){
      var L = S.lines[k], d = L.qty-L.sys;
      var cls = Math.abs(d)<.001 ? 'ok' : (d>0?'warn':'bad');
      return '<div class="row"><div class="m"><b>' + esc(L.name) + '</b><small>' +
        (L.expire?esc(L.expire):'من غير صلاحية') + ' · السيستم ' + n(L.sys) +
        '</small></div><span class="tag ' + cls + '">' + n(L.qty) + '</span></div>';
    }).join('');
  } else {
    h += '<div class="state">دوس «امسح باركود» وصوّر ملصق العلبة</div>';
  }
  $('main').innerHTML = h;
}

function lastCard(it){
  var h = '<div class="card"><div class="nm">' + esc(it.name) + '</div>';
  var all = it.batches.slice();
  Object.keys(S.lines).forEach(function(k){ var L=S.lines[k];
    if (L.code!==it.code) return;
    if (!all.some(function(b){ return (b.expire||'')===(L.expire||''); }))
      all.push({expire:L.expire, stock:0, added:true}); });

  if (all.length > 1){
    h += '<div class="sub">' + all.length + ' صلاحيات — اكتب اللي عدّيته من كل واحدة</div>';
    all.forEach(function(b){
      var k = it.code+'|'+(b.expire||'');
      var cur = S.lines[k] ? S.lines[k].qty : '';
      h += '<div class="bt"><div class="ex"><b>' + esc(b.expire||'—') + '</b><small>' +
        (b.added?'مش في السيستم':'السيستم ' + n(b.stock)) + '</small></div>' +
        '<input type="number" inputmode="decimal" min="0" value="' + cur +
        '" onchange="setQty(\'' + it.code + '\',\'' + (b.expire||'') + '\',' +
        (b.stock||0) + ',this.value)"></div>';
    });
  } else {
    /* حتى الصنف بدفعة واحدة بياخد خانة — الموظف يكتب العدد على طول
       بدل ما يفضل يدوس + عشرين مرة */
    var b = all[0] || {expire:'', stock:it.stock};
    var k = it.code+'|'+(b.expire||'');
    var q = S.lines[k] ? S.lines[k].qty : 0;
    h += '<div class="sub">' + (b.expire?esc(b.expire):'من غير صلاحية') +
      ' · السيستم ' + n(b.stock) + '</div>' +
      '<div class="counter"><button class="step" onclick="bump(\'' + k + '\',-1)">−</button>' +
      '<input class="qty" type="number" inputmode="decimal" min="0" step="any" value="' + q +
      '" onchange="setQty(\'' + it.code + '\',\'' + (b.expire||'') + '\',' +
      (b.stock||0) + ',this.value)">' +
      '<button class="step" onclick="bump(\'' + k + '\',1)">+</button></div>';
  }

  /* ── التجزئة ── */
  if ((it.units||1) > 1){
    h += '<button class="btn" onclick="openPartial(\'' + it.code +
         '\')" style="margin:0 0 10px">علبة مفتوحة — عدّ بالـ' + partWord(it) + '</button>';
  }
  /* موجود دايمًا — أكتر حاجة بتكشف مشاكل: بضاعة بصلاحية متسجلتش */
  h += '<button class="btn" onclick="openAddBatch(\'' + it.code +
       '\')" style="margin:0">+ صلاحية تانية على الرف</button>';
  return h + '</div>';
}

/* ── العدّ ── */
function put(code,name,expire,qty,sys,isNew){
  var k = code+'|'+(expire||'');
  if (qty<=0){ delete S.lines[k]; }
  else {
    /* بنسجّل مين عدّه وإمتى — منهم بيتبني "كنت واقف فين" */
    S.lines[k] = { code:code, name:name, expire:expire||'', qty:qty,
                   sys:sys||0, isNew:!!isNew, who:S.by||'', at:Date.now() };
    S.order = (S.order||[]).filter(function(x){ return x!==k; });
    S.order.push(k);
  }
  save(); sync(); draw();
}
function bump(k,d){
  var L = S.lines[k];
  if (L){ put(L.code,L.name,L.expire,L.qty+d,L.sys,L.isNew); return; }
  var it = S.last; if (!it || d<=0) return;
  var b = it.batches[0] || {expire:'',stock:it.stock};
  put(it.code,it.name,b.expire,d,b.stock,false);
}
function setQty(code,expire,sys,val){
  var it = S.last; if (!it || it.code!==code) return;
  var known = it.batches.some(function(b){ return (b.expire||'')===expire; });
  put(code,it.name,expire,parseFloat(val)||0,sys,!known);
}

/* ── إضافة صلاحية (شيت مش prompt) ── */
function openAddBatch(code){
  var y = new Date().getFullYear(), yrs = '';
  for (var i=0;i<7;i++) yrs += '<option value="'+(y+i)+'">'+(y+i)+'</option>';
  var mo = '';
  for (var m=1;m<=12;m++){ var v=('0'+m).slice(-2); mo += '<option value="'+v+'">'+v+'</option>'; }
  openSheet('<h2>صلاحية تانية على الرف</h2>' +
    '<div class="lbl" style="margin-top:0">الشهر والسنة المكتوبين على العلبة</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:12px">' +
      '<select class="fld" id="bM" style="margin:0">' + mo + '</select>' +
      '<select class="fld" id="bY" style="margin:0">' + yrs + '</select></div>' +
    '<div class="lbl">عدّيت كام علبة بالصلاحية دي؟</div>' +
    '<input class="fld" id="bQ" type="number" inputmode="decimal" min="0" placeholder="مثلاً 3">' +
    '<button class="btn primary" onclick="doAddBatch(\'' + code + '\')">ضيف</button>' +
    '<button class="btn" onclick="closeSheet()">إلغاء</button>');
}
function doAddBatch(code){
  var it = S.last; if (!it || it.code!==code){ closeSheet(); return; }
  var q = parseFloat($('bQ').value)||0;
  if (q<=0){ return; }
  var full = $('bY').value + '-' + $('bM').value + '-01';
  var known = it.batches.filter(function(b){ return b.expire===full; })[0];
  put(code,it.name,full,q,known?known.stock:0,!known);
  closeSheet();
}

/* ══════════ التجزئة ══════════
   الرصيد متخزن بالعلبة. صنف units=10 ورصيده 0.9 معناه 9 أكياس.
   الموظف بيعدّ بالجزء (شرايط/أكياس) والحساب بيحوّل لعلب — أنضف
   من إنه يكتب 0.9 بإيده ويغلط. */
function partWord(it){
  var nm = (it.name||'');
  if (/كيس|اكياس|أكياس/.test(nm)) return 'كيس';
  if (/امبول|أمبول|امب/.test(nm))  return 'أمبول';
  if (/لبوس|اقماع/.test(nm))       return 'لبوسة';
  return 'شريط';
}

function openPartial(code){
  var it = S.last; if (!it || it.code !== code) return;
  var u = it.units || 1, w = partWord(it);

  var all = it.batches.slice();
  Object.keys(S.lines).forEach(function(k){ var L=S.lines[k];
    if (L.code!==it.code) return;
    if (!all.some(function(b){ return (b.expire||'')===(L.expire||''); }))
      all.push({expire:L.expire, stock:0}); });

  var opts = all.map(function(b,i){
    return '<option value="' + esc(b.expire||'') + '">' +
      (b.expire ? esc(b.expire) : 'من غير صلاحية') + '</option>'; }).join('');

  openSheet('<h2>علبة مفتوحة</h2>' +
    '<div class="state" style="padding:0 0 14px;text-align:right">' +
      esc(it.name) + '<br><span style="color:var(--ink-3)">العلبة الكاملة ' +
      n(u) + ' ' + w + '</span></div>' +
    (all.length > 1 ? '<div class="lbl" style="margin-top:0">الصلاحية</div>' +
      '<select class="fld" id="pE">' + opts + '</select>' :
      '<input type="hidden" id="pE" value="' + esc((all[0]||{}).expire||'') + '">') +
    '<div class="lbl">علب كاملة</div>' +
    '<input class="fld" id="pB" type="number" inputmode="numeric" min="0" value="0">' +
    '<div class="lbl">' + w + ' زيادة (من علبة مفتوحة)</div>' +
    '<input class="fld" id="pU" type="number" inputmode="numeric" min="0" max="' + (u-1) +
      '" value="0" oninput="prevPartial()">' +
    '<div class="state" id="pOut" style="padding:6px 0 14px"></div>' +
    '<button class="btn primary" onclick="doPartial(\'' + code + '\')">سجّل</button>' +
    '<button class="btn" onclick="closeSheet()">إلغاء</button>');
  prevPartial();
}

function prevPartial(){
  var it = S.last; if (!it) return;
  var u = it.units || 1;
  var b = parseFloat(($('pB')||{}).value) || 0;
  var p = parseFloat(($('pU')||{}).value) || 0;
  var tot = b + (p / u);
  var el = $('pOut'); if (!el) return;
  el.innerHTML = 'الإجمالي: <b style="color:var(--ink)">' +
    n(Math.round(tot*100)/100) + '</b> علبة';
}

function doPartial(code){
  var it = S.last; if (!it || it.code !== code){ closeSheet(); return; }
  var u = it.units || 1;
  var b = parseFloat($('pB').value) || 0;
  var p = parseFloat($('pU').value) || 0;
  var qty = Math.round((b + p/u) * 10000) / 10000;
  if (qty <= 0){ closeSheet(); return; }
  var ex = $('pE').value || '';
  var known = it.batches.filter(function(x){ return (x.expire||'') === ex; })[0];
  put(code, it.name, ex, qty, known ? known.stock : 0, !known);
  closeSheet();
}

/* ── بحث بالاسم ── */
function openFind(){
  openSheet('<h2>بحث</h2>' +
    '<input class="fld" id="fQ" placeholder="اسم الصنف أو الكود" autocomplete="off">' +
    '<button class="btn primary" onclick="doFind()">دوّر</button>' +
    '<div id="fRes"></div>');
  setTimeout(function(){ var e=$('fQ'); e&&e.focus(); },250);
}
function doFind(){
  var q = ($('fQ').value||'').trim(); if (!q) return;
  $('fRes').innerHTML = '<div class="state"><div class="spin"></div></div>';
  if (/^\d{6,14}$/.test(q)){
    api('scanLookup',{code:q}).then(function(d){
      if (d&&d.ok&&d.found){ S.last=d.item; closeSheet(); screenCount(); }
      else $('fRes').innerHTML = '<div class="state err">الكود مش موجود</div>';
    });
    return;
  }
  api('scanSearch',{q:q}).then(function(d){
    var r = (d&&d.results)||[];
    if (!r.length){ $('fRes').innerHTML='<div class="state">مفيش نتايج</div>'; return; }
    $('fRes').innerHTML = r.slice(0,12).map(function(x,i){
      return '<div class="row" onclick="chooseFind('+i+')" style="cursor:pointer">' +
        '<div class="m"><b>' + esc(x.name) + '</b><small>رصيد ' + n(x.stock) +
        '</small></div></div>'; }).join('');
    window.__found = r;
  });
}
function chooseFind(i){
  var r = window.__found||[]; if (!r[i]) return;
  S.last = r[i]; closeSheet(); screenCount();
}

/* مسح جرد شغال — للجرود القديمة اللي عمرها ما اتقفلت */
function askDrop(id, title){
  openSheet('<h2>تمسح الجرد ده؟</h2>' +
    '<div class="state">' + esc(title) + '<br>هيتمسح نهائيًا ومفيش رجوع.</div>' +
    '<button class="btn" style="background:var(--bad);color:#fff" onclick="doDrop(\'' +
      esc(id) + '\')">امسح</button>' +
    '<button class="btn" onclick="closeSheet()">إلغاء</button>');
}
function doDrop(id){
  closeSheet();
  $('main').innerHTML = '<div class="state"><div class="spin"></div>بيمسح…</div>';
  post({ action:'deleteCount', sessionId:id, confirm:'DELETE' }).then(function(d){
    if (S.id === id){ wipe(); S = {id:null,title:'',by:S.by,lines:{},order:[],last:null}; }
    screenStart();
  }).catch(function(){ say('مقدرتش','النت مش راضي — جرب تاني'); screenStart(); });
}

/* ══════════ ٣) الكاميرا ══════════ */
function startCam(){
  $('cam').classList.add('on');
  $('hint').textContent = 'وجّه الكاميرا على الباركود';
  $('flash').className='flash';
  $('flash').innerHTML = '<div class="state" style="padding:6px">مستني المسح…</div>';
  if (!window.ZXing){
    $('hint').innerHTML = '<span style="color:#E5646E">مكتبة القراءة متحمّلتش — راجع النت</span>';
    return;
  }
  try{
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
       ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
       ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.UPC_A]);
    reader = new ZXing.BrowserMultiFormatReader(hints, 200);
    reader.decodeFromConstraints({ video:{ facingMode:{ideal:'environment'} } }, 'video',
      function(res){ if (res) onScan(res.getText()); })
    .catch(function(e){
      $('hint').innerHTML = '<span style="color:#E5646E">الكاميرا مش راضية تفتح</span>';
      $('flash').innerHTML = '<div class="state" style="padding:6px">' + esc(e.message) + '</div>';
    });
  }catch(e){
    $('hint').innerHTML = '<span style="color:#E5646E">' + esc(e.message) + '</span>';
  }
}
function stopCam(){
  $('cam').classList.remove('on');
  try{ reader && reader.reset(); }catch(e){}
  reader = null;
}

function onScan(text){
  var code = String(text||'').replace(/\D/g,'');
  if (!code) return;
  var now = Date.now();
  /* نفس الباركود خلال ثانية ونص = ارتجاجة مش مسحة جديدة */
  if (code===lastCode && now-lastAt<1500) return;
  lastCode=code; lastAt=now;
  if (busy) return;
  busy = true;

  api('scanLookup',{code:code}).then(function(d){
    busy = false;
    if (!d || !d.ok || !d.found){
      feedback(false);
      $('flash').className='flash bad';
      $('flash').innerHTML = '<div class="nm">مش موجود</div><div class="sub">الكود ' +
        esc(code) + ' مش في المخزون</div>';
      return;
    }
    var it = d.item; S.last = it; feedback(true);

    if (it.multi){
      /* وقفة: الموظف لازم يوزّع على الصلاحيات */
      stopCam(); screenCount();
      return;
    }
    var b = it.batches[0] || {expire:'', stock:it.stock};
    var k = it.code+'|'+(b.expire||'');
    var q = (S.lines[k]?S.lines[k].qty:0) + 1;
    put(it.code,it.name,b.expire,q,b.stock,false);
    $('flash').className='flash';
    $('flash').innerHTML = '<div class="nm">' + esc(it.name) +
      '</div><div class="sub">عدّيت ' + n(q) + ' · السيستم ' + n(b.stock) + '</div>';
  }).catch(function(){
    busy=false; feedback(false);
    $('flash').className='flash bad';
    $('flash').innerHTML = '<div class="state" style="padding:6px">النت مش راضي — جرب تاني</div>';
  });
}

/* ══════════ ٤) الإنهاء ══════════ */
function goBack(){
  if (!S.id){ screenStart(); return; }
  sync(true);
  openSheet('<h2>تسيب الجرد؟</h2>' +
    '<div class="state">الشغل محفوظ. تقدر ترجع تكمّله من أي موبايل.</div>' +
    '<button class="btn primary" onclick="closeSheet();screenStart()">اسيبه</button>' +
    '<button class="btn" onclick="closeSheet()">كمّل</button>');
}

function askFinish(){
  var k = Object.keys(S.lines).length;
  if (!k){ say('الجرد فاضي','امسح حاجة الأول'); return; }
  stopCam();
  openSheet('<h2>تقفل الجرد؟</h2>' +
    '<div class="state">' + k + ' سطر هيتسجّل.<br>الجرد بيطلع تقرير بس ومش بيغيّر المخزون.</div>' +
    '<button class="btn go" onclick="finish()">اقفل واحفظ</button>' +
    '<button class="btn" onclick="closeSheet()">لسه</button>');
}

function finish(){
  closeSheet();
  var keys = Object.keys(S.lines);
  $('main').innerHTML = '<div class="state"><div class="spin"></div>بيحفظ…</div>';
  post({ action:'saveCount', sessionId:S.id, title:S.title, by:S.by,
    lines: keys.map(function(k){ var L=S.lines[k];
      return {code:L.code,expire:L.expire,qty:L.qty,isNewBatch:L.isNew}; }) })
  .then(function(d){
    if (!d || !d.ok) throw new Error((d&&d.error)||'فشل');
    wipe(); S = {id:null,title:'',by:'',lines:{},last:null};
    $('tot').style.display='none'; $('done').style.display='none';
    $('hTitle').textContent='تم'; $('hSub').textContent='';
    $('main').innerHTML =
      '<div class="state" style="color:var(--ok);font-size:22px;font-weight:700;padding-bottom:8px">' +
      '<span class="dot"></span>الجرد اتحفظ</div>' +
      '<div class="row"><div class="m"><b>الأصناف</b></div><span class="tag ok">' +
        n(d.lines) + '</span></div>' +
      '<div class="row"><div class="m"><b>فيها فرق</b></div><span class="tag ' +
        (d.diffCount?'warn':'ok') + '">' + n(d.diffCount) + '</span></div>' +
      '<button class="btn primary" style="margin-top:20px" onclick="screenStart()">جرد جديد</button>';
  }).catch(function(e){
    /* الجرد لسه محفوظ محليًا وعلى السيرفر — مفيش حاجة ضاعت */
    $('main').innerHTML = '<div class="state err">الحفظ فشل<br>' + esc(e.message) +
      '<br><br>الشغل لسه محفوظ. جرب تاني لما النت يرجع.</div>' +
      '<button class="btn primary" onclick="finish()">حاول تاني</button>' +
      '<button class="btn" onclick="screenCount()">ارجع للجرد</button>';
  });
}

/* ══════════ التشغيل ══════════ */
load();
screenStart();
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', function(){
  if (document.hidden && S.id && Object.keys(S.lines).length) sync(true);
});
</script>
