name: Kimi pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI
        run: pip install kimi-cli
      - name: Check connection
        env:
          KIMI_MODEL_NAME: k3-256k
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_MODEL_PROVIDER_TYPE: kimi
        run: |
          test -n "$KIMI_MODEL_API_KEY"
          kimi -p 'Reply exactly KIMI_CONNECTED; do not inspect or modify files.' --output-format stream-json | grep KIMI_CONNECTED
