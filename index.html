/* الفترة المختارة (نفس اختيارات باقي اللوحة من ⋯) */
function clsRange(){
  var v = RANGE.close, t = cairoNow().date, r;
  if (v === 'custom' && CUSTOM.close) r = { from: CUSTOM.close.from, to: CUSTOM.close.to };
  else if (v === 'today') r = { from: t, to: t };
  else if (v === 'yesterday'){ var y = clsAdd(t, -1); r = { from: y, to: y }; }
  else if (v === 'lastMonth'){
    var f = t.slice(0, 8) + '01'; r = { from: clsAdd(f, -1).slice(0, 8) + '01', to: clsAdd(f, -1) };
  } else if (v === 'month') r = { from: t.slice(0, 8) + '01', to: t };
  else r = { from: clsAdd(t, -6), to: t };           // week
  if (!r.from || !r.to || r.from > r.to) r = { from: clsAdd(t, -6), to: t };
  if (clsAdd(r.from, 61) < r.to) r.from = clsAdd(r.to, -61);   // أقصى ٦٢ يوم
  return r;
}
function clsTotals(days){
  var tot = { cash: 0, credit: 0, card: 0, ret: 0, collected: 0, gross: 0 };
  days.forEach(function(x){ Object.keys(tot).forEach(function(k){ tot[k] += x[k] || 0; }); });
  return tot;
}
/* بيحمّل الفترة كل ٧ أيام ورا بعض (الأحدث الأول) وبيرسم أول ما تيجي أول قطعة */
function pgClosing(){
  var box = document.getElementById('p-money'), R = clsRange(), my = ++CLS.req, days = [], cur = R.to, guard = 0;
  CLS.data = null; busy(box);
  var next = function(){
    var lo = clsAdd(cur, -6); if (lo < R.from) lo = R.from;
    return api('getClosingDays', { from: lo, to: cur }).then(function(d){
      if (my !== CLS.req) return;
      if (!d || !d.ok) throw new Error((d && d.error) || 'close');
      days = days.concat(d.days || []);
      CLS.data = { days: days, from: R.from, to: R.to, totals: clsTotals(days), loading: lo > R.from };
      markSync(); drawClosing();
      if (lo > R.from && ++guard < 12){ cur = clsAdd(lo, -1); return next(); }
    });
  };
  next().catch(function(e){ logErr(e); if (my === CLS.req && !CLS.data) oops(box, "pgClosing()"); });
}

function clsDrawDay(x, logo){

    });

      var r = R[q[0]]; if (!r || (q[0] === 'companies' && !r.sys && !r.user)) return;
      var z = Math.abs(r.diff) < 0.005;

    }

    if (it.t === 'row'){
      clsT(c, it.l, W - 66, y + RH / 2, (it.b ? '800 ' : '600 ') + '28px Cairo', CAMR_C.ink);
      clsT(c, it.v, 66, y + RH / 2, '800 30px Cairo', it.b ? CAMR_C.grn : CAMR_C.ink, 'left', 'ltr');

/* بحث الديون: بالاسم (من غير تشكيل وهمزات، وأي ترتيب كلمات) أو بجزء من التليفون */
function debtNorm(t){
  return String(t == null ? '' : t).toLowerCase()
    .replace(/[٠-٩]/g, function(c){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); })
    .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}
function debtMatch(c, q){
  if (!q) return true;
  var nm = debtNorm(c.name);
  if (q.split(' ').every(function(w){ return nm.indexOf(w) >= 0; })) return true;
  var dg = q.replace(/\D/g, '');
  return dg.length >= 3 && String(c.phone || '').replace(/\D/g, '').indexOf(dg) >= 0;
}
/* كروت النطاقات — بتتبني لوحدها عشان البحث ماقفلش الكيبورد */
function debtListHtml(){
  var d = DEBT.data; if (!d) return '';
  var q = debtNorm(DEBT.q);
  var all = (d.debtors || []).map(function(c){
    c._days = (c.daysSincePaid === null || c.daysSincePaid === undefined) ? null : c.daysSincePaid;
    return c;
  });
  var list = all.filter(function(c){ return debtMatch(c, q); });
  if (q && !list.length) return '<div class="state">لا توجد مدين بالاسم أو الرقم ده</div>';
  var head = q ? '<div class="state" style="padding:0 0 8px;text-align:start">' + ltr(list.length) + ' من ' + ltr(all.length) +
    ' · ' + ltr(num(list.reduce(function(a,c){ return a + c.net; }, 0))) + ' ج</div>' : '';
  var groups = {};
  DEBT_BUCKETS.forEach(function(b){ groups[b.key] = []; });
  list.forEach(function(c){
    if (c._days === null){ groups.none.push(c); return; }
    for (var i = 0; i < DEBT_BUCKETS.length; i++){
      var b = DEBT_BUCKETS[i];
      if (b.max !== null && c._days <= b.max){ groups[b.key].push(c); break; }
    }
  });
  return head + DEBT_BUCKETS.map(function(b){
    var g = groups[b.key];
    if (!g.length) return '';
    var total = g.reduce(function(a,c){ return a + c.net; }, 0);
    var open = !!DEBT.open[b.key] || !!q, lim = q ? 200 : 80;

    g.sort(DEBT.sort === 'age'
      ? function(x,y){ return y._days - x._days; }
      : function(x,y){ return y.net - x.net; });

    var body = open ? g.slice(0, lim).map(function(c){
      var paid = c.lastPaid ? tr('lastPaid') + ' ' + ltr(c.lastPaid) : tr('noPayRec');
      var sub = (c._days === null)
        ? paid
        : tr('lastMove') + ' ' + ltr(c._days) + ' ' + tr('daysAgo') + ' · ' + paid;

      return '<div class="row"><div class="row-main"><b>' + esc(c.name) + '</b>' +
        '<small>' + sub + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
        '<span class="row-val" style="color:var(--' + b.tone + ')">' + ltr(num(c.net)) + '</span></div></div>';
    }).join('') + (g.length > lim ? '<div class="state" style="padding:8px 0;font-size:12px">+' + ltr(g.length - lim) + ' كمان — ابحث بالاسم فوق</div>' : '') : '';

    return '<div class="card" style="padding:0;overflow:hidden;border-inline-start:3px solid var(--' + b.tone + ')">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;' +
        'padding:14px 16px;cursor:pointer" onclick="toggleBucket(\'' + b.key + '\')">' +
        '<div><b style="font-size:var(--t-title);font-weight:650">' + tr(b.label) + '</b>' +
        '<small style="display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px">' +
          ltr(g.length) + ' ' + tr('debtors') + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:16px;font-weight:700;color:var(--' + b.tone + ');' +
            'direction:ltr;unicode-bidi:isolate">' + LRI + num(total) + PDI + '</span>' +
          '<span style="color:var(--ink-3);font-size:15px">' + (open ? '⌄' : '›') + '</span>' +

  }).join('');

function drawDebts(isOld){
  var box = document.getElementById('p-money'), d = DEBT.data;
  if (!d) return;
  var now = new Date();
  var list = (d.debtors || []).map(function(c){
    c._days = (c.daysSincePaid === null || c.daysSincePaid === undefined) ? null : c.daysSincePaid;

  });

  var stale = list.filter(function(c){ return c._days === null || c._days > 30; });

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  /* المؤشرات لازم تكون متسقة: مجموع النطاقات = الإجمالي بالظبط */
  var totalAll   = list.reduce(function(a,c){ return a + c.net; }, 0);
  var staleTotal = stale.reduce(function(a,c){ return a + c.net; }, 0);
  var freshTotal = totalAll - staleTotal;

  /* 🎯 الإجمالي بياخده من نظام البيع مباشرة (رقم رسمي ولحظي).
     جمع التفاصيل من الملفات الخام مستحيل يظبط لأن فيه مرتجعات
     وتعديلات بتغيّر الرصيد من غير ما تتسجل في ملف الديون. */
  var headline = (d.total_official !== null && d.total_official !== undefined)
                 ? d.total_official : totalAll;

  html += vitals(tr('debts'), null, [
    { value: num(headline), label: tr('totalDebt'), tone: 'bad',
      note: num(list.length), sub: tr('debtors') },
    { value: num(staleTotal), label: tr('overdueDebt'), tone: 'warn',
      note: pct(staleTotal, totalAll) + '%', sub: tr('ofTotal') },
    { value: num(freshTotal), label: tr('bucketFresh'), tone: 'ok',
      note: num(list.length - stale.length), sub: tr('customers') }
  ]);

  /* تنبيه المطابقة: لو التفاصيل بعيدة عن الرقم الرسمي، يبقى فيه
     مدينين آخر حركة ليهم أقدم من سنة (بره نطاق القراءة). */
  /* تفصيل الأرقام: نظام البيع قصاد ملفات الديون (عشان لا توجد حاجة تتفترض) */

/* بيلزق الحضور بالأداء — الاسم في Connecteam ممكن يختلف عن اسم نظام البيع،
   فبنطابق بأول كلمة مشتركة */
/* نفس الموظف بأسماء مختلفة: نظام البيع بالعربي وConnecteam بالإنجليزي */
var STAFF_ALIASES = { 'ahmed shaat': 'احمد شعت', 'ahmed shaath': 'احمد شعت', 'ahmad shaat': 'احمد شعت' };
function staffKey(n){
  n = String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (STAFF_ALIASES[n]) n = STAFF_ALIASES[n];
  var EN = { ahmed:'احمد', ahmad:'احمد', hamada:'حماده', hamadah:'حماده', walaa:'ولاء', wala:'ولاء', mostafa:'مصطفي', mustafa:'مصطفي', ayman:'ايمن', abdelsalam:'عبدالسلام', shaat:'شعت' };
  n = n.split(' ').map(function(w){ return EN[w] || w; }).join(' ');
  n = n.replace(/^(الدكتورة|الدكتور|دكتورة|دكتور|د\.|استاذة|استاذ|أستاذة|أستاذ|أ\.)\s*/, '');
  return n.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
}
function sameStaff(a, b){
  var x = staffKey(a), y = staffKey(b);
  if (!x || !y) return false;
  if (x === y) return true;
  var fx = x.split(' ')[0], fy = y.split(' ')[0];
  if (fx !== fy) return x.indexOf(fy) === 0 || y.indexOf(fx) === 0 ? (x.indexOf(' ') < 0 || y.indexOf(' ') < 0) : false;
  return x.indexOf(' ') < 0 || y.indexOf(' ') < 0;
}
function matchShifts(name){
  var rows = (HR.hist.rows || []);
  var key = String(name || '').replace(/^(دكتور|دكتورة|استاذ|د\.|أستاذ)\s*/, '').trim().split(/\s+/)[0];
  if (!key) return [];
  return rows.filter(function(x){
    return sameStaff(name, x.name) || String(x.name || '').toLowerCase().indexOf(key.toLowerCase()) !== -1 ||
           key.toLowerCase().indexOf(String(x.name || '').split(/\s+/)[0].toLowerCase()) !== -1;
  });
}
function liveFor(name){
  var key = String(name || '').replace(/^(دكتور|دكتورة|استاذ|د\.|أستاذ)\s*/, '').trim().split(/\s+/)[0];
  var exact = (HR.live.live || []).filter(function(p){ return sameStaff(name, p.name); })[0];
  if (exact) return exact;
  return (HR.live.live || []).filter(function(p){
    return String(p.name || '').toLowerCase().indexOf(key.toLowerCase()) !== -1 ||
           key.toLowerCase().indexOf(String(p.name || '').split(/\s+/)[0].toLowerCase()) !== -1;
  })[0];
}

function staffCairoClock(timestamp){
  if(timestamp===null || timestamp===undefined || timestamp==='')return '—';
  var n=Number(timestamp),d=Number.isFinite(n)?new Date(n<1e12?n*1000:n):new Date(timestamp);
  if(!Number.isFinite(+d))return '—';
  return d.toLocaleTimeString('ar-EG-u-nu-latn',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:true});
}

function staffCardEntries(employees,live,history){
  var entries=(employees||[]).map(function(e){return {name:e.name,employee:e,live:null,shifts:[]};});
  function find(name){
    var exact=entries.filter(function(e){return staffKey(e.name)===staffKey(name);});
    if(exact.length===1)return exact[0];
    var matches=entries.filter(function(e){return sameStaff(e.name,name);});
    if(matches.length===1)return matches[0];
    var item={name:name,employee:null,live:null,shifts:[]};entries.push(item);return item;
  }
  (live||[]).forEach(function(p){find(p.name).live=p;});
  (history||[]).forEach(function(r){find(r.name).shifts.push(r);});
  return entries.sort(function(a,b){return Number(!!b.live)-Number(!!a.live)||(b.employee && b.employee.net || 0)-(a.employee && a.employee.net || 0);});
}

function pgAging(key){
  var box = document.getElementById('p-stock');
  INV_SEC = key === 'expTab' ? 'exp' : key === 'deadTab' ? 'dead' : (INV_NEXT || 'home'); INV_NEXT = null;
  loadInvExtras();
  var seed = cacheGet('inv', {});
  if (seed) { INV.data = seed; drawAging(true); } else busy(box);

  api('getInventoryAging').then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error);
    cacheSet('inv', {}, d);
    INV.data = d; markSync(); drawAging(false);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgAging()"); });
}

   الشاشة الأولى بتقول "فيه مشكلة ولا لأ" في نظرة واحدة، والتفاصيل
   كلها زي ما هي جوه كل قسم. الترتيب بالخطورة: السالب فوق لأنه خطأ

function loadInvExtras(){
  api('countAccuracy', { range: 'all' }).then(function(d){
    INV_ACC = d;

  }).catch(function(e){ logErr(e); INV_ACC = { ok: false, error: tr('failed') }; });

  api('getSystemDailyTotals').then(function(d){
    ORD_STAT = d;
    if (invOnTab() && INV.data && INV_SEC === 'order') drawAging(false);
  }).catch(function(e){ logErr(e); });

  var pr = { days: RANGE.short };

/* نسخ نص — Safari القديم مبيدعمش clipboard API في كل السياقات */
function copyTxt(text){
  var done = function(){ toast(tr('copied')); };
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast(tr('failed')); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

function secHead(title, expFn, backFn){
  return '<div class="sec-head">' +
    (backFn === 'none' ? '' : '<button class="ibtn" onclick="' + (backFn || "setInvSec('home')") + '">›</button>') +
    '<h3>' + title + '</h3>' +
    (expFn ? '<button class="ibtn" onclick="' + expFn + '">⤓</button>' : '') +
    '</div>';
}

function drawAging(isOld){
  var box = document.getElementById('p-stock'), d = INV.data;
  if (!d || CUR !== 'stock' || TAB === 1 || TAB === 4) return;   /* رد متأخر ميكتبش فوق تبويب تاني */

  var near  = d.near_expiry_list || [];
  var nearC = near.reduce(function(a, x){ return a + x.cost; }, 0);
  var neg   = d.negative_list || [];
  var deadPct = pct(d.slow_dead_total_cost, d.total_cost_value);
  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  /* السيرفر لسه بالنسخة القديمة؟ — من غير التنبيه ده الأقسام بتظهر ناقصة من غير تفسير */
  if (d.never_sold_count === undefined && d.all_category_summary === undefined){
    html += '<div class="state err" style="padding:0 0 10px">' + tr('needsDeploy') + '</div>';
  }

  /* ═══ الشاشة الأولى ═══
     كل قسم قرار مختلف: صلّح · مرتجع · اطلب · اعرض/خصّم · راجع الشراء.
     لا توجد دمج بين الراكد وقرب الصلاحية لأن قرارهم مختلف. */
  if (INV_SEC === 'home'){
    var A = (INV_ACC && INV_ACC.ok && INV_ACC.last) ? INV_ACC.last : null;
    html += vitals(tr('invAging'), d.snapshot_at || d.generated_date, [
      { value: num(d.total_cost_value), label: tr('stockValue'), tone: 'brand',
        note: num(d.total_retail_value), sub: tr('retailValue') },
      { value: num(d.slow_dead_total_cost), label: tr('deadStock'), tone: 'bad',
        note: deadPct + '%', sub: tr('turnover') },
      { value: A && A.accuracy !== null ? (A.accuracy + '%') : '—', label: tr('countAcc'),
        tone: 'brand', note: null, sub: A ? tr('lastCountLbl') : tr('noCountYet') }
    ]);

    var zN = SHORT_DATA ? (((SHORT_DATA.zero || {}).summary || {}).total || 0) : null;
    var lN = SHORT_DATA ? (((SHORT_DATA.low  || {}).summary || {}).total || 0) : null;

    html += '<div class="group-title">' + tr('groupAct') + '</div>';
    html += secBtn('fix', neg.length ? 'bad' : 'ok', tr('fixSec'), tr('fixSub'),
      ltr(num(neg.length)), tr('items'));
    html += secBtn('order', zN ? 'bad' : 'ok', tr('orderSec'),
      zN === null ? tr('orderSub') : (tr('outOfStock') + ' ' + ltr(num(zN)) + ' · ' + tr('lowStock') + ' ' + ltr(num(lN))),
      zN === null ? '…' : ltr(num(zN)), zN === null ? '' : tr('items'), 'stockGo');
    html += secBtn('exp', near.length ? 'warn' : 'ok', tr('nearExpSec'), tr('expSub'),
      ltr(num(Math.round(nearC))), ltr(num(near.length)) + ' ' + tr('items'), 'stockGo');

    html += '<div class="group-title">' + tr('groupMoney') + '</div>';
    html += secBtn('dead', d.slow_dead_count ? 'warn' : 'ok', tr('deadOnly'), tr('deadSub2'),
      ltr(num(Math.round(d.slow_dead_total_cost || 0))), ltr(num(d.slow_dead_count || 0)) + ' ' + tr('items'), 'stockGo');
    html += secBtn('never', d.never_sold_count ? 'warn' : 'ok', tr('neverSec'), tr('neverSub'),
      ltr(num(Math.round(d.never_sold_total_cost || 0))), ltr(num(d.never_sold_count || 0)) + ' ' + tr('items'));

    html += '<div style="height:8px"></div>';
    html += secBtn('all', 'ok', tr('allStock'),
      ltr(num(d.sku_in_stock)) + ' ' + tr('items') + ' · ' + tr('retailValue') + ' ' + ltr(num(d.total_retail_value)),
      ltr(num(d.total_cost_value)), tr('stockValue'));

    box.innerHTML = html;
    return;
  }

  /* ═══ رأس القسم: رجوع + تصدير ═══ */
  var TITLES = { fix: tr('fixSec'), exp: tr('nearExpSec'), order: tr('orderSec'),
                 dead: tr('deadOnly'), never: tr('neverSec'), all: tr('allStock') };
  var EXPFN  = { fix: 'negMenu()', exp: 'expiryMenu()', order: 'orderMenu()',
                 dead: 'agingMenu()', never: 'neverSoldMenu()', all: 'catAllMenu()' };
  /* لما القسم مفتوح كتبويب لوحده (الصلاحية/الراكد) عنوانه في الكارت اللي تحت، فلا توجد داعي لرأس تاني */
  if (TAB === 0) html += secHead(TITLES[INV_SEC] || '', EXPFN[INV_SEC]);

  if (INV_SEC === 'fix')   html += invFixHtml(d);
  if (INV_SEC === 'order') html += invOrderHtml();

  /* ═══ كل المخزون ═══ */
  if (INV_SEC === 'all'){
    html += card(tr('allStock'), d.snapshot_at || d.generated_date,
      row(tr('stockValue'), null, ltr(num(d.total_cost_value))) +
      row(tr('retailValue'), null, ltr(num(d.total_retail_value))) +
      row(tr('items'), tr('inStockSub'), ltr(num(d.sku_in_stock))));

    var AC = d.all_category_summary || [];
    html += card(tr('byCategory'), null, AC.length ? AC.map(function(c){
      var share = d.total_cost_value ? pct(c.cost, d.total_cost_value) : 0;
      return '<div class="row" onclick="catSheet(\'' + esc(String(c.category).replace(/'/g, '')) +
        '\',\'all\')" style="cursor:pointer"><div class="row-main"><b>' + esc(c.category) + '</b>' +
        '<small>' + ltr(num(c.count)) + ' ' + tr('items') + ' · ' + ltr(share) + '%</small></div>' +
        '<span class="row-val">' + ltr(num(c.cost)) + '</span>' +
        '<span style="opacity:.4;padding-inline-start:6px">›</span></div>';
    }).join('') : emptyState(), expBtn("catAllMenu()"));
  }

  /* فلتر الفئة/الرف — بيظهر في الأقسام اللي ليها فلترة */
  /* فلتر القسم: زرار صغير جوه الكارت بدل سطر لوحده */
  var invFilt = '<button class="v-filter' + ((INV.cat || INV.shelf !== 'all') ? ' on' : '') + '" onclick="event.stopPropagation();invMenu()">' +
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>' +
    esc(INV.cat || 'كل الأقسام') + '</button>';

  /* ═══ قرب الصلاحية ═══ */
  if (INV_SEC === 'exp'){
    /* مترتبة بالشهر لحد سنة: كل شهر كارت، والأقرب فوق. اللون = قد إيه الوقت ضاق.
       الشهر الكبير بيتقفل على أول 5 أصناف ويتفرد بدوسة، وكل شهر ليه PDF لوحده */
    var MN = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    /* الـ 6 شهور الجايين بالتقويم (مثلاً من نوفمبر لأبريل) — كلهم بيظهروا حتى الفاضي */
    var WIN = [], c0 = cairoNow().date;
    for (var wi = 1; wi <= 6; wi++){ var dt = new Date(Date.UTC(+c0.slice(0, 4), +c0.slice(5, 7) - 1 + wi, 1)); WIN.push(dt.toISOString().slice(0, 7)); }
    var groups = {}, sumX = { n: 0, c: 0 }, sum3 = { n: 0, c: 0 }, sum6 = { n: 0, c: 0 }, sum12 = { n: 0, c: 0 };
    var addIt = function(it){
      var dte = it.days_to_expire; if (dte == null) return;
      var k = dte < 0 ? 'x' : String(it.expire || '').slice(0, 7);
      if (k !== 'x' && WIN.indexOf(k) < 0) return;   /* 6 شهور لقدام بس */
      var g = groups[k] || (groups[k] = { key: k, dte: dte, items: {}, n: 0, c: 0 });
      var nm = String(it.name || '');
      var row = g.items[nm] || (g.items[nm] = { name: nm, stock: 0, cost: 0, dte: dte });
      row.stock += +it.stock || 0; row.cost += +it.cost || 0; row.dte = Math.min(row.dte, dte);
      g.c += +it.cost || 0; g.dte = Math.min(g.dte, dte);
      var b = dte < 0 ? sumX : dte <= 90 ? sum3 : sum6; b.n++; b.c += +it.cost || 0;
    };
    near.forEach(addIt);
    ((d.expiry_items || {}).e6_12 || []).forEach(addIt);
    WIN.forEach(function(k){ if (!groups[k]) groups[k] = { key: k, dte: Math.round((Date.parse(k + '-01') - Date.parse(c0)) / 86400000), items: {}, n: 0, c: 0, empty: true }; });    Object.keys(groups).forEach(function(k){ var g = groups[k];
      g.n = Object.keys(g.items).length;
      g.title = k === 'x' ? 'منتهي فعلًا' : (MN[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4));
      g.rows = Object.keys(g.items).map(function(n){ return g.items[n]; }).sort(function(a, b){ return b.cost - a.cost; });
    });
    EXP_GROUPS = groups;
    html += vitals('الصلاحية', '@@F@@', [
      { value: num(Math.round(sumX.c)), label: 'منتهي', tone: sumX.n ? 'bad' : '', note: ltr(sumX.n), sub: 'إزالة من الرف' },
      { value: num(Math.round(sum3.c)), label: 'خلال 3 شهور', tone: sum3.n ? 'bad' : '', note: ltr(sum3.n), sub: 'مراجعة الإرجاع للمورّد' },
      { value: num(Math.round(sum6.c)), label: 'من 3 لـ 6 شهور', tone: sum6.n ? 'warn' : '', note: ltr(sum6.n), sub: 'اعرضه أو رجّعه' }
    ]);
    var keys = Object.keys(groups).sort(function(a, b){ return a === 'x' ? -1 : b === 'x' ? 1 : a < b ? -1 : 1; });
    var k6 = keys.filter(function(k){ return groups[k].dte <= 180; });
    EXP_STAFF = k6.map(function(k){ var g = groups[k];
      return { title: g.title, items: g.rows.slice().sort(function(a, b){ return a.name < b.name ? -1 : 1; }) }; });
    html = html.replace('<span>@@F@@</span>', invFilt);
    html += '<div class="exp-hint">علّم ✓ على الشهور اللي عايز تبعتها للعامل، وبعدين «شارك»</div>';
    if (!keys.length) html += '<div class="card">' + emptyState() + '</div>';
    var shownLater = false;
    keys.forEach(function(k){
      var g = groups[k], tone = k === 'x' || g.dte <= 90 ? 'bad' : g.dte <= 180 ? 'warn' : 'brand';
      if (g.empty){
        html += '<div class="card exp-m exp-empty"><div class="exp-h"><span class="dot" style="background:var(--line)"></span><div><b>' + esc(g.title) + '</b><small>لا توجد أصناف بتنتهي هذا الشهر</small></div></div></div>';
        return;
      }
      var open = !!EXP_OPEN[k], rows = open ? g.rows : [], sel = !!EXP_SEL[k];
      html += '<div class="card exp-m' + (open ? ' open' : '') + (sel ? ' sel' : '') + '" style="--tone:var(--' + tone + ')"><div class="exp-h" onclick="expToggle(\'' + k + '\')" role="button">' +
        '<button class="exp-ck' + (sel ? ' on' : '') + '" onclick="event.stopPropagation();expSel(\'' + k + '\')" aria-label="اختار الشهر">✓</button>' +
        '<div><b>' + esc(g.title) + '</b>' +
        '<small>' + ltr(g.n) + ' صنف' + (k === 'x' ? '' : ' · بعد ' + ltr(Math.max(0, g.dte)) + ' يوم') + '</small></div>' +
        '<span class="exp-v">' + ltr(num(Math.round(g.c))) + '</span>' +
        '<button class="exp-pdf" onclick="event.stopPropagation();expMonthPDF(\'' + k + '\')" aria-label="PDF">PDF</button>' +
        '<span class="exp-arw">' + (open ? '⌄' : '‹') + '</span></div>' +
        rows.map(function(r){
          return '<div class="exp-r"><span class="exp-n">' + esc(r.name) + '</span><span class="exp-q">' + ltr(qtyFmt(Math.round(r.stock * 100) / 100)) + ' ' + tr('unitsWord') + '</span>' +
            '<span class="exp-c">' + ltr(num(Math.round(r.cost))) + '</span></div>';
        }).join('') +
        '</div>';
    });
    var selK = keys.filter(function(k){ return EXP_SEL[k] && groups[k] && !groups[k].empty; });
    if (selK.length){
      var selN = selK.reduce(function(a, k){ return a + groups[k].n; }, 0);
      html += '<div class="exp-bar"><span><b>' + ltr(selK.length) + ' شهر</b> · ' + ltr(selN) + ' صنف</span>' +
        '<button class="btn btn-quiet" onclick="expSelClear()">إلغاء</button>' +
        '<button class="btn btn-primary" onclick="expShareSel()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-inline-end:6px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>شارك</button></div>' +
        '<div style="height:70px"></div>';
    }
  }

  /* ═══ راكد ═══ */
  if (INV_SEC === 'dead'){
    var AG = [['never','never'],['b0_30','d0_30'],['b31_60','d31_60'],['b61_90','d61_90'],
              ['b91_180','d91_180'],['b181_365','d181_365'],['b365plus','d365']];
    html += card(tr('agingTitle'), null, AG.map(function(x){
      var g = (d.aging || {})[x[0]]; if (!g || !g.skus) return '';
      var tone = (x[0] === 'never' || x[0] === 'b365plus' || x[0] === 'b181_365') ? 'bad'
               : (x[0] === 'b91_180') ? 'warn' : 'ok';
      return '<div class="row" style="cursor:pointer" onclick="agingSheet(\'' + x[0] + '\',\'' + x[1] + '\')">' +
        '<div class="row-main"><b>' + tr(x[1]) + '</b><small>' + ltr(g.skus) + ' ' + tr('skus') + '</small></div>' +
        '<span class="row-val" style="color:var(--' + tone + ')">' + ltr(num(g.cost)) + '</span></div>';
    }).join('') || emptyState(), '<span style="display:flex;gap:6px;align-items:center">' + invFilt + expBtn("agingMenu()") + '</span>');

    var cats = d.slow_category_summary || [];
    html += card(tr('deadStock'),
      ltr(d.slow_dead_count) + ' ' + tr('items') + ' · ' + ltr(num(d.slow_dead_total_cost)),
      cats.length ? cats.slice(0, 12).map(function(c){
        return '<div class="row" style="cursor:pointer" onclick="catSheet(\'' +
          esc(c.category).replace(/'/g, '') + '\',\'dead\')">' +
          '<div class="row-main"><b>' + esc(c.category) + '</b>' +
          '<small>' + ltr(c.count) + ' ' + tr('items') + '</small></div>' +
          '<span class="row-val" style="color:var(--bad)">' + ltr(num(c.cost)) + '</span></div>';
      }).join('') : emptyState());
  }

  /* ═══ دون مبيعات مسجلة ═══ */
  if (INV_SEC === 'never'){
    var nl = d.never_sold_list || [];
    html += card(tr('neverSold'), tr('neverSoldSub'),
      row(tr('items'), null, ltr(num(d.never_sold_count || 0))) +
      row(tr('stockValue'), null, ltr(num(d.never_sold_total_cost || 0))) +
      nl.slice(0, 40).map(function(it){
        return '<div class="row"><div class="row-main"><b style="white-space:normal">' + esc(it.name) + '</b>' +
          '<small>' + ltr(qtyFmt(it.stock)) + ' ' + tr('unitsWord') +
          (it.expire ? ' · ' + esc(it.expire) : '') + '</small></div>' +
          '<span class="row-val">' + ltr(num(it.cost)) + '</span></div>';
      }).join('') +
      (nl.length > 40 ? '<div class="state" style="padding:10px 0 0">' + tr('moreInExport') + ' (' + ltr(nl.length - 40) + ')</div>' : ''),
      expBtn("neverSoldMenu()"));
  }

  box.innerHTML = html;
}

    return { 'الصنف': it.name, 'الرصيد': it.stock, 'التكلفة': it.cost,
             'ينتهي': it.expire || '—' };
  });

}

/* نافذة: أصناف شريحة ركود */
function agingSheet(key, labelKey){
  var d = INV.data; if (!d) return;
  var items = ((d.aging_items || {})[key] || []);
  openMenu(tr(labelKey), sheetItems(items, function(it){

  }));
}

/* نافذة: أصناف راكدة لفئة */
var CAT_ROWS = [];
function catSheet(cat, scope){
  var d = INV.data || {};
  var rows;
  if (scope === 'all'){
    /* كل أصناف الفئة (اللي ليها رصيد) — من شرايح آخر بيع، كل صنف في شريحة واحدة */
    rows = [];
    Object.keys(d.aging_items || {}).forEach(function(k){
      (d.aging_items[k] || []).forEach(function(it){ if (it.category === cat) rows.push(it); });
    });
  } else {
    /* الراكد بس — نفس الأصناف اللي الرقم اللي دوست عليه مبني عليها */
    rows = (d.slow_dead_list || []).filter(function(it){ return it.category === cat; });
  }
  rows.sort(function(a, b){ return (b.cost || 0) - (a.cost || 0); });
  CAT_ROWS = rows;

  var t = document.getElementById('sheet-title'), b = sheetBody();
  document.getElementById('sheet').classList.add('on');
  t.textContent = cat;
  var tot = rows.reduce(function(a, x){ return a + (x.cost || 0); }, 0);
  b.innerHTML =
    '<div class="state">' + ltr(num(rows.length)) + ' ' + tr('items') +
    ' · ' + ltr(num(Math.round(tot))) + ' ' + tr('egp') + '</div>' +
    '<button class="btn btn-quiet" onclick="catMenu()">' + tr('exportX') + ' / ' + tr('exportP') + '</button>' +
    (rows.length ? rows.slice(0, 80).map(function(it){
      return '<div class="row"><div class="row-main"><b>' + esc(it.name) + '</b>' +

/* ─────── مخزون: النواقص ─────── */
var SHORT_DATA = null, SHORT_SEC = 'zero', SHORT_OPEN = {}, EFF = null;

function setShortDays(v){ RANGE.short = v; SHORT_DATA = null; pgShort(); }
function setShortSec(v){ SHORT_SEC = v; drawShort(); }
function toggleCat(id){ SHORT_OPEN[id] = !SHORT_OPEN[id]; drawShort(); }

function pgShort(){
  var box = document.getElementById('p-stock');
  var pr  = { days: RANGE.short };
  var seed = cacheGet('getShortages', pr);
  if (seed && !seed.error) { SHORT_DATA = seed; drawShort(); } else busy(box);
  api('getShortages', pr, SHORTAGE_URL).then(function(d){
    if (!d || d.error) throw new Error(d && d.msg);
    cacheSet('getShortages', pr, d);
    SHORT_DATA = d; markSync(); drawShort();
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgShort()"); });
  api('orderEfficiency', { days: RANGE.short }).then(function(e){
    if (e && e.ok){ EFF = e; if (SHORT_DATA) drawShort(); }
  }).catch(logErr);
}

function effHtml(){
  var e = EFF;
  if (!e) return '';
  var dur = function(h){ return h == null ? '—' : (h >= 48 ? ltr(num(Math.round(h / 24 * 10) / 10)) + ' ' + tr('effDays') : ltr(num(h)) + ' ' + tr('effHours')); };
  if (e.collectedDays < 3 || !e.episodes)
    return card(tr('effTitle'), null, '<div class="state">' + tr('effCollect') + '</div>');
  var tone = e.trend == null ? 'brand' : (e.trend > 0 ? 'bad' : 'ok');
  var L = e.lost || {}, hasLost = L.matched > 0;
  var h = vitals(tr('effTitle'), tr('effSub'), [
    { value: hasLost ? num(L.value) + ' ' + tr('egp') : '—', label: tr('effLost'), tone: hasLost && L.value ? 'bad' : 'ok' },
    { value: dur(e.avgHours), label: tr('effAvg'), tone: 'brand' },
    { value: num(e.stale), label: tr('effStale'), tone: e.stale ? 'bad' : 'ok' }
  ]);
  if (e.trend != null) h += '<div class="state" style="padding:4px 0 10px">' +
    (e.trend > 0 ? 'النواقص بتزيد' : e.trend < 0 ? 'النواقص بتقل' : 'النواقص ثابتة') + ' <b style="color:var(--' + tone + ')" dir="ltr">(' +
    (e.trend > 0 ? '+' : '') + e.trend + ' صنف في اليوم)</b></div>';
  if (hasLost && (L.items || []).length) h += card(tr('effLostT'), tr('effLostNote'), L.items.slice(0, 8).map(function(o){
    return row(o.name, esc(o.co) + ' · ' + ltr(num(o.daysOut)) + ' ' + tr('effDaysOut') + ' × ' + ltr(o.perDay >= 10 ? num(o.perDay) : (Math.round(o.perDay * 10) / 10)) + ' ' + tr('effPerDay'),
               ltr(num(o.value)) + ' ' + tr('egp'));
  }).join(''));
  if ((e.oldest || []).length) h += card(tr('effOldest'), null, e.oldest.slice(0, 6).map(function(o){
    return row(o.name, esc(o.co), dur(o.hours));
  }).join(''));
  if ((e.repeat || []).length) h += card(tr('effRepeatT'), null, e.repeat.slice(0, 6).map(function(o){
    return row(o.name, esc(o.co), ltr(num(o.n)) + ' ' + tr('effTimes'));
  }).join(''));
  return h;
}

function drawShort(){
  var box = document.getElementById('p-stock'), d = SHORT_DATA;
  if (!d || CUR !== 'stock' || TAB !== 1) return;   /* رد متأخر ميكتبش فوق تبويب تاني */
  var zero = d.zero || { categories:{}, summary:{} }, low = d.low || { categories:{}, summary:{} };
  var sec = (SHORT_SEC === 'zero') ? zero : low;
  var sum = sec.summary || {};

  var html = ctlBar(
    ctlBtn(tr('outOfStock') + ' ' + ltr((zero.summary||{}).total || 0), SHORT_SEC === 'zero', "setShortSec('zero')") +
    ctlBtn(tr('lowStock') + ' ' + ltr((low.summary||{}).total || 0), SHORT_SEC === 'low', "setShortSec('low')"),
    'shortMenu()', RANGE.short !== '7');

  html += vitals(tr('shortages'), d.generatedAt || '', [
    { value: num((zero.summary||{}).total || 0), label: tr('outOfStock'), tone: 'bad' },
    { value: num((low.summary||{}).total || 0),  label: tr('lowStock'),   tone: 'warn' },
    { value: num(sum.totalAfter || 0), label: 'قيمة الطلب', sub: 'بعد خصم المورّد' }
  ]);

  var cats = Object.keys(sec.categories || {}).sort();
  if (!cats.length){ box.innerHTML = html + '<div class="card">' + emptyState() + '</div>' + effHtml(); return; }

  html += cats.map(function(cat, ci){
    var comps = sec.categories[cat], names = Object.keys(comps).sort();
    var count = names.reduce(function(a,c){ return a + comps[c].length; }, 0);
    var id = SHORT_SEC + '-' + ci, open = !!SHORT_OPEN[id];

    var body = open ? names.map(function(comp){
      return '<div class="group-title">' + esc(comp) + '</div>' + comps[comp].map(function(it){
        var code = esc(it.code || '').replace(/'/g, '');
        var nm   = esc(it.name || '').replace(/'/g, '');
        return '<div class="row"><div class="row-main"><b style="white-space:normal">' + esc(it.name) + '</b>' +
          '<small>' + tr('needed') + ' ' + ltr(it.shortage) + '</small></div>' +
          '<div style="display:flex;gap:6px">' +
          '<button class="badge" style="--tone:var(--ok);border:0;cursor:pointer" ' +
            'onclick="shortAct(this,\'markOrdered\',\'' + code + '\',\'' + nm + '\')">' + tr('markOrdered') + '</button>' +
          '<button class="badge" style="--tone:var(--bad);border:0;cursor:pointer" ' +
            'onclick="shortAct(this,\'markDiscontinued\',\'' + code + '\',\'' + nm + '\')">' + tr('markDiscont') + '</button>' +
          '</div></div>';
      }).join('');
    }).join('') : '';

    return '<div class="card" style="padding:0;overflow:hidden">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;' +
        'padding:14px 16px;cursor:pointer" onclick="toggleCat(\'' + id + '\')">' +
        '<div><b style="font-size:var(--t-title);font-weight:650">' + esc(cat) + '</b>' +
        '<small style="display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px">' +
          ltr(count) + ' ' + tr('items') + ' · ' + ltr(names.length) + ' ' + tr('supplier') + '</small></div>' +
        '<span style="color:var(--ink-3);font-size:15px">' + (open ? '⌄' : '›') + '</span></div>' +
      (open ? '<div style="padding:0 16px 14px">' + body + '</div>' : '') + '</div>';
  }).join('');
  /* أداء الطلبيات تحت القوايم: معلومة مش مهمة يومية */
  var eff = effHtml();
  if (eff) html += '<div class="group-title" style="padding-top:16px">أداء الطلبيات</div>' + eff;

  box.innerHTML = html;
}

function shortAct(btn, action, code, name){
  btn.disabled = true; btn.textContent = '…';
  fetch(SHORTAGE_URL, { method:'post', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action: action, code: code, name: name }) }).catch(logErr);
  if (action === 'markOrdered'){
    try{ navigator.clipboard.writeText(name); }catch(e){}
    toast(tr('copied'));
  }
  var r = btn.closest('.row'); if (r) r.style.opacity = '.35';
  btn.textContent = '✓';
}

/* ─────── عملاء: الرسائل ─────── */
var MSG = { data: null, type: 'all', failedOnly: false };

function setMsgType(v){ MSG.type = v; drawMessages(); }
function toggleFailed(){ MSG.failedOnly = !MSG.failedOnly; drawMessages(); }

function pgMessages(){
  var box = document.getElementById('p-cust');
  var seed = cacheGet('sms', {});
  if (seed) { MSG.data = seed; drawMessages(true); } else busy(box);

  api('getSMSLogFast', { days: 30 }).then(function(d){
    if (!d || !d.ok) throw new Error('sms');
    cacheSet('sms', {}, d);
    MSG.data = d; markSync(); drawMessages(false);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgMessages()"); });
}

function isFail(m){ return /فشل|❌|مبعتهاش/.test(String(m.status || '')); }

function drawMessages(isOld){
  var box = document.getElementById('p-cust'), d = MSG.data;
  if (!d) return;
  var all = d.messages || [];

  var counts = { all: all.length, invoice: 0, coupon: 0, debt: 0 };
  all.forEach(function(m){ if (counts[m.type] !== undefined) counts[m.type]++; });
  var bad = all.filter(isFail);

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  html += vitals(tr('messages'), '30' + ' ' + (LANG === 'ar' ? 'يوم' : 'days'), [
    { value: num(all.length - bad.length), label: tr('sent'), tone: 'ok' },
    { value: num(bad.length), label: tr('msgFailed'), tone: bad.length ? 'bad' : 'ok' },
    { value: num(all.length), label: tr('messages'), tone: 'brand' }
  ]);

  /* سطر تحكّم واحد: النوع ظاهر · الباقي جوه ⋯ */
  var TYPES = [['all','typeAll'],['invoice','typeInvoice'],['coupon','typeCoupon'],['debt','typeDebt']];
  html += ctlBar(
    TYPES.map(function(t){
      return ctlBtn(tr(t[1]) + ' ' + ltr(counts[t[0]]), MSG.type === t[0], "setMsgType('" + t[0] + "')");
    }).join(''),
    'msgMenu()',
    MSG.failedOnly
  );

  var shown = all.filter(function(m){
    if (MSG.failedOnly && !isFail(m)) return false;
    return MSG.type === 'all' || m.type === MSG.type;
  });

  var TYPE_LBL = { invoice:'typeInvoice', coupon:'typeCoupon', debt:'typeDebt' };
  html += card(tr('messages'), null, shown.length
    ? shown.slice(0, 80).map(function(m){
        var f = isFail(m);
        var actions = (f && m.invoiceid)
          ? '<button class="badge" style="--tone:var(--brand);border:0;cursor:pointer" ' +
              'onclick="smsAction(this,\'retrySMS\',\'' + m.invoiceid + '\')">' + tr('resend') + '</button>' +
            '<button class="badge" style="--tone:var(--ink-2);border:0;cursor:pointer" ' +
              'onclick="smsAction(this,\'dismissSMS\',\'' + m.invoiceid + '\')">' + tr('ignore') + '</button>'
          : badge(f ? tr('msgFailed') : tr('sent'), f ? 'bad' : 'ok');
        return '<div class="row"><div class="row-main"><b>' + esc(m.customername || '—') + '</b>' +
          '<small>' + ltr(m.phone) + ' · ' + ltr(m.date) + ' · ' + tr(TYPE_LBL[m.type] || 'typeAll') +
          '</small></div><div style="display:flex;gap:6px">' + actions + '</div></div>';
      }).join('')
    : '<div class="state">'+(MSG.failedOnly?'لا توجد رسائل فاشلة ضمن الفلتر الحالي':'لا توجد رسائل ضمن الفلتر الحالي')+'</div>');
  if(MSG.failedOnly)html='<div class="state">الفلتر الحالي: الرسائل الفاشلة فقط <button class="btn btn-quiet" onclick="toggleFailed()">عرض جميع الرسائل</button></div>'+html;
  box.innerHTML = html;
}

function smsAction(btn, action, id){
  btn.disabled = true; btn.textContent = '…';
  post({ action: action, invoiceid: id })
    .then(function(d){ if(!d || !d.ok)throw new Error((d && d.error)||'تعذر تنفيذ العملية'); btn.textContent = '✓'; })
    .catch(function(e){ logErr(e); btn.textContent = '✗'; });
}

/* ── إرسال كوبونات: فردي أو جماعي ── */
var COUPON = { list: [], sel: {} };

function couponSheet(){
  var t = document.getElementById('sheet-title'), b = sheetBody();
  document.getElementById('sheet').classList.add('on');
  t.textContent = tr('sendCoupon');
  var d30 = cairoDate(30);
  b.innerHTML =
    '<div class="group-title">' + tr('couponText') + '</div>' +
    '<textarea id="cpMsg" rows="3" style="width:100%;padding:12px;border-radius:12px;' +
      'border:1px solid var(--line);background:var(--surface-2);color:var(--ink);' +
      'font-family:inherit;font-size:14px;resize:vertical">' + esc(tr('couponDefault')) + '</textarea>' +
    '<div class="group-title">' + tr('expiry') + '</div>' +
    '<input id="cpExp" type="date" value="' + d30 + '" style="width:100%;padding:11px;' +
      'border-radius:12px;border:1px solid var(--line);background:var(--surface-2);' +
      'color:var(--ink);font-family:inherit;font-size:14px">' +
    '<div id="cpList"><div class="state"><div class="spin"></div></div></div>';

  api('getCustomers').then(function(res){
    var list = Array.isArray(res) ? res : (res && res.list);
    if (!Array.isArray(list)) throw new Error('cust');
    /* اللي محتاجين متابعة الأول — دول هدف الكوبون */
    COUPON.list = list.filter(function(c){ return c.phone && !c.is_blocked; })
      .sort(function(a, b){ return (a.status === 'تنبيه' ? -1 : 0) - (b.status === 'تنبيه' ? -1 : 0); });
    COUPON.sel = {};
    drawCouponList();
  }).catch(function(e){
    logErr(e);
    var el = document.getElementById('cpList');
    if (el) el.innerHTML = '<div class="state err">' + tr('failed') + '</div>';
  });
}

function toggleCp(ph){ COUPON.sel[ph] = !COUPON.sel[ph]; drawCouponList(); }
function selAllCp(on){
  COUPON.sel = {};
  if (on) COUPON.list.slice(0, 60).forEach(function(c){ COUPON.sel[c.phone] = true; });
  drawCouponList();
}

function drawCouponList(){
  var el = document.getElementById('cpList'); if (!el) return;
  var n = Object.keys(COUPON.sel).filter(function(k){ return COUPON.sel[k]; }).length;
  el.innerHTML =
    '<div class="group-title" style="display:flex;justify-content:space-between;align-items:center">' +
      '<span>' + tr('customers') + ' · ' + ltr(n) + ' ' + tr('selected') + '</span>' +
      '<span><u style="cursor:pointer" onclick="selAllCp(true)">' + tr('selectAll') + '</u> · ' +
      '<u style="cursor:pointer" onclick="selAllCp(false)">' + tr('clearSel') + '</u></span></div>' +
    (n ? '<button class="btn btn-primary" onclick="sendCoupons()">' + tr('sendToSel') +
         ' (' + ltr(n) + ')</button>' : '') +
    '<div id="cpRows">' + COUPON.list.slice(0, 60).map(function(c){
      var on = !!COUPON.sel[c.phone];
      return '<div class="row" style="cursor:pointer" onclick="toggleCp(\'' + c.phone + '\')">' +
        '<div style="display:flex;gap:10px;align-items:center;min-width:0">' +
        '<span style="width:18px;height:18px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;' +
          'border:1.5px solid var(--' + (on ? 'brand' : 'line') + ');background:var(--' +
          (on ? 'brand' : 'surface-2') + ');color:#fff;font-size:11px">' + (on ? '✓' : '') + '</span>' +
        '<div class="row-main"><b>' + esc(c.name || '—') + '</b>' +
        '<small>' + ltr(c.phone) + (c.cls ? ' · ' + esc(c.cls) : '') + '</small></div></div>' +
        (c.status === 'تنبيه' ? badge(tr('needFollow'), 'warn') : '') + '</div>';
    }).join('') + '</div>';
}

function sendCoupons(){
  var msg = (document.getElementById('cpMsg').value || '').trim();
  var exp = document.getElementById('cpExp').value;
  var phones = COUPON.list.filter(function(c){ return COUPON.sel[c.phone]; });
  if (!msg || !phones.length) return;

  var el = document.getElementById('cpRows');
  var done = 0, ok = 0;
  function step(i){
    if (i >= phones.length){
      el.innerHTML = '<div class="state">' + tr('sentCount') + ' ' + ltr(ok) + ' / ' + ltr(phones.length) + '</div>';
      toast(tr('sentCount') + ' ' + ok);
      return;
    }
    var c = phones[i];
    el.innerHTML = '<div class="state"><div class="spin"></div>' + tr('sending') + ' ' +
      ltr(i + 1) + '/' + ltr(phones.length) + '</div>';
    api('sendCoupon', { phone: c.phone, name: c.name, message: msg, expiry: exp })
      .then(function(r){ if (r && r.ok) ok++; })
      .catch(logErr)
      .then(function(){ done++; step(i + 1); });
  }
  step(0);
}

/* ─────── عملاء: القائمة ─────── */
/* ═══════════════════════════════════════════════════════════════
   العملاء — بأقسام، كل قسم قرار مختلف
   متابعة · استرجاع · جدد · محظورين · الكل
   وكل صف بيوريك "من كام يوم آخر زيارة" — وبيتداس يفتح ملف العميل.
   ═══════════════════════════════════════════════════════════════ */
var CUST_PERS = [[30, 'شهر'], [60, 'شهرين'], [90, '3 شهور'], [180, '6 شهور'], [365, 'سنة']];
var CUST_PER = 30;
try { CUST_PER = parseInt(localStorage.getItem('custPer'), 10) || 30; } catch (e) {}
var CUST_VIS = null, CUST_VIS_LOADING = false;
/* «غابوا من شهر إلى 3 أشهر»: محتاجين آخر زيارة في 90 يوم، منفصلة عن فترة «نشطين» */
var CUST_V90 = (function(){ try { var s = JSON.parse(localStorage.getItem('custV90') || 'null'); return s && s.day === cairoNow().date ? s.d : null; } catch (e) { return null; } })();
function loadCustV90(tries){
  tries = tries || 0;
  if (CUST_V90 && CUST_V90._fresh) return;
  api('getCustomerVisits', { days: 90 }).then(function(d){
    if (!d || !d.ok || d.days !== 90) return;
    if (d.missingDays && tries < 20){ loadCustV90(tries + 1); return; }
    d._fresh = true; CUST_V90 = d;
    try { localStorage.setItem('custV90', JSON.stringify({ day: cairoNow().date, d: d })); } catch (e) {}
    if (custOnTab() && CUST.list.length) drawCustomers(CUST.list, document.getElementById('p-cust'));
  }).catch(logErr);
}
function lapsedList(list){
  if (!CUST_V90 || !CUST_V90.customers) return null;
  var today = Date.parse(cairoNow().date + 'T00:00:00Z');
  return list.filter(function(c){ return !c.is_blocked; }).map(function(c){
    var v = CUST_V90.customers[custPhone(c.phone)]; if (!v || !v.l) return null;
    var d = Math.round((today - Date.parse(v.l + 'T00:00:00Z')) / 86400000);
    return (d > 30 && d <= 90) ? { c: c, d: d, v: v } : null;
  }).filter(Boolean).sort(function(a, b){ return b.v.s - a.v.s; });
}
var CUST = { sec: 'home', list: [], dash: null, news: null, q: '', cls: 'all',
             cur: [], curTitle: '', one: null, hist: null, confirmBlock: false };
var CUST_LOG = { type: 'call', result: 'answered' };
var ST_WAIT = 'تمت المتابعة - في الانتظار', ST_FAIL = 'محاولات استرجاع فشلت', ST_ALERT = 'تنبيه';

function custOnTab(){ return CUR === 'cust' && TAB === 0; }

var CUST_NEXT = null;
function pgCustomers(){
  var box = document.getElementById('p-cust');
  CUST.sec = CUST_NEXT || 'home'; CUST_NEXT = null;
  apiCached('getCustomers', {}, box, drawCustomers);
  loadCustDash();
  loadCustVisits();
  loadCustCalls();
  loadCustV90();
}

/* أرقام الاسترجاع من السيرفر — بتوصل بعد القايمة، وبنعيد الرسم لما توصل */
function loadCustDash(){
  var today = cairoNow().date, from = today.slice(0, 8) + '01';
  api('getDashboard', { from: from, to: today }).then(function(d){
    if (d && d.range){
      CUST.dash = d;
      if (custOnTab() && CUST.sec === 'home' && CUST.list.length)
        drawCustomers(CUST.list, document.getElementById('p-cust'));
    }
  }).catch(function(e){ logErr(e); });
}

/* زيارات الفترة — أول مرة بتتحسب على دفعات، فبنعيد النداء لحد ما تكمل */
function loadCustVisits(tries){
  tries = tries || 0;
  /* آخر حساب محفوظ على الموبايل (لنفس اليوم) بيظهر فورًا، والجديد بيتجاب ورا */
  if (!CUST_VIS && !tries) try { var sv = JSON.parse(localStorage.getItem('custVis') || 'null');
    if (sv && sv.day === cairoNow().date && sv.d && sv.d.days === CUST_PER){ CUST_VIS = sv.d; CUST_VIS._fresh = false; if (custOnTab() && CUST.list.length) drawCustomers(CUST.list, document.getElementById('p-cust')); } } catch (e) {}
  if (CUST_VIS && CUST_VIS._fresh) return;
  CUST_VIS_LOADING = true;
  api('getCustomerVisits', { days: CUST_PER }).then(function(d){
    if (!d || !d.ok) throw new Error((d && d.error) || 'visits');
    if (d.days !== CUST_PER) return;
    CUST_VIS = d; d._fresh = !d.missingDays;
    if (!d.missingDays) try { localStorage.setItem('custVis', JSON.stringify({ day: cairoNow().date, d: d })); } catch (e) {}
    CUST_VIS_LOADING = !!d.missingDays && tries < 20;
    if (custOnTab() && CUST.list.length) drawCustomers(CUST.list, document.getElementById('p-cust'));
    if (d.missingDays && tries < 20) loadCustVisits(tries + 1);
  }).catch(function(e){ logErr(e); CUST_VIS_LOADING = false; });
}
function setCustPer(n){
  CUST_PER = n; CUST_VIS = null;
  try { localStorage.setItem('custPer', String(n)); } catch (e) {}
  drawCustomers(CUST.list, document.getElementById('p-cust'));
  loadCustVisits();
}
function custVis(c){
  if (!CUST_VIS || !CUST_VIS.customers) return null;
  return CUST_VIS.customers[custPhone(c.phone)] || { v: 0, n: 0, s: 0, l: '' };
}
function custAvg(c){
  var v = custVis(c); if (!v) return null;
  return Math.round(v.v / (CUST_PER / 30) * 10) / 10;
}
function custPerBar(){
  var h = '<div class="ctl"><div class="ctl-main">' + CUST_PERS.map(function(p){
    return ctlBtn(p[1], CUST_PER === p[0], 'setCustPer(' + p[0] + ')');
  }).join('') + '</div></div>';
  if (CUST_VIS_LOADING) h += '<div class="state" style="padding:0 0 8px;font-size:12px">' +
    '<span class="spin" style="width:12px;height:12px;display:inline-block;vertical-align:middle"></span> بيحسب الزيارات' +
    (CUST_VIS && CUST_VIS.missingDays ? ' — فاضل ' + ltr(CUST_VIS.missingDays) + ' يوم' : '') + '</div>';
  return h;
}

function setCustSec(k){
  try { sessionStorage.setItem('subCust', k); } catch (e) {}
  CUST.sec = k; CUST.q = ''; CUST.cls = 'all';
  if (k === 'new' && !CUST.news) loadCustNew();
  drawCustomers(CUST.list, document.getElementById('p-cust'));
  window.scrollTo(0, 0);
}

function loadCustNew(){
  api('getNewCustomersDetail', { range: 'month' }).then(function(d){
    CUST.news = (d && d.customers) || [];
    if (custOnTab() && CUST.sec === 'new') drawCustomers(CUST.list, document.getElementById('p-cust'));
  }).catch(function(e){ logErr(e); CUST.news = []; });
}

/* آخر زيارة: من فواتير البيع الفعلية لو متاحة (أدق)، وإلا من الشيت */
function custLastDate(c){
  var v = (CUST_VIS && CUST_VIS.customers) ? CUST_VIS.customers[custPhone(c.phone)] : null;
  return (v && v.l) ? v.l : '';
}
function custDays(c){
  var ld = custLastDate(c);
  if (ld){
    var d = Math.round((Date.parse(cairoNow().date + 'T00:00:00Z') - Date.parse(ld + 'T00:00:00Z')) / 86400000);
    if (!isNaN(d) && d >= 0) return d;
  }
  /* الزيارات اتحسبت من فواتير نظام البيع والعميل مش فيها = مجاش في الفترة.
     خانة days_since في شيت الـ CRM بايظة (529 عميل مكتوب عندهم 0) فمش بنعتمد عليها. */
  if (CUST_VIS && CUST_VIS.customers && !CUST_VIS.missingDays) return null;
  var v = c.days_since;
  if (v === null || v === undefined || v === '') return null;
  v = parseFloat(v);
  return isNaN(v) ? null : v;
}

/* لون الشارة من مدة تنبيه العميل نفسه (alert_days في الشيت) — مش رقم من عندي */
function daysBadge(c){
  var ds = custDays(c), lim = parseFloat(c.alert_days) || 30;
  if (ds === null) return badge('—', 'brand');
  return badge(ds === 0 ? tr('today') : (ltr(ds) + ' ' + tr('daysWord')), ds > lim ? 'bad' : 'ok');
}

function byDaysDesc(a, b){
  var x = custDays(a), y = custDays(b);
  if (x === null && y === null) return 0;
  if (x === null) return 1;
  if (y === null) return -1;
  return y - x;
}

/* الشيت بيخزّن الرقم كعدد فالصفر اللي في الأول بيضيع: 1224565199 → 01224565199 */
function custPhone(p){
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 12 && p.indexOf('20') === 0) p = '0' + p.slice(2);
  return (p.length === 10 && p.charAt(0) === '1') ? '0' + p : p;
}
function custLast(c){
  var ds = custDays(c), ld = custLastDate(c);
  if (ds === null) return 'آخر زيارة: —';
  var dt = '';
  if (ld){ try { dt = new Date(ld + 'T00:00:00').toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long' }) + ' · '; } catch (e) {} }
  return 'آخر زيارة: ' + dt + (ds === 0 ? 'اليوم' : ds === 1 ? 'إمبارح' : ('من ' + ltr(ds) + ' يوم'));
}
function custRow(c, right){
  return '<div class="row" onclick="openCust(\'' + esc(String(c.phone)) + '\')" style="cursor:pointer">' +
    '<div class="row-main" style="flex:1"><b>' + esc(c.name || '—') + '</b>' +
    '<small>' + custLast(c) + (c.cls ? ' · ' + esc(c.cls) : '') + '</small>' +
    (custAvg(c) !== null ? '<small>متوسط ' + ltr(custAvg(c)) + ' زيارة/شهر' +
      (custVis(c).s ? ' · ' + ltr(num(custVis(c).s)) + ' ج' : '') + '</small>' : '') +
    '<small style="color:var(--ink-3)">' + ltr(custPhone(c.phone)) + '</small></div>' +
    '<span style="display:flex;align-items:center;gap:8px;flex-shrink:0">' + (right || daysBadge(c)) +
    '<span style="opacity:.4;font-size:16px">' + (document.documentElement.dir === 'rtl' ? '‹' : '›') + '</span></span></div>';
}

function custGroups(list){
  var blocked = list.filter(function(c){ return c.is_blocked; });
  var live    = list.filter(function(c){ return !c.is_blocked; });
  return {
    blocked: blocked,
    follow:  live.filter(function(c){ return c.status === ST_ALERT; }).sort(byDaysDesc),
    recover: live.filter(function(c){ return c.status === ST_WAIT || c.status === ST_FAIL; }).sort(byDaysDesc),
    active:  live.filter(function(c){ var d = custDays(c); return d !== null && d <= CUST_PER; })
                 .sort(function(a, b){ return ((custAvg(b) || 0) - (custAvg(a) || 0)) || -byDaysDesc(a, b); })
  };
}

function drawCustomers(res, box){
  var list = Array.isArray(res) ? res : (res && res.list);
  if (!Array.isArray(list)) { oops(box, "pgCustomers()"); return; }
  CUST.list = list;
  var G = custGroups(list), dash = CUST.dash, html = '';

  /* ── الشاشة الأولى ── */
  if (CUST.sec === 'active') html += custPerBar();
  if (CUST.sec === 'home'){
    var visReady = CUST_VIS && CUST_VIS.customers && !CUST_VIS.missingDays;
    var repeat = visReady ? G.active.filter(function(c){ var v = custVis(c); return v && v.v >= 2; }).length : null;
    html += vitals(tr('customers'), null, [
      { value: num(list.length), label: 'مسجلين' },
      { value: visReady ? num(G.active.length) : '…', label: 'اشتروا آخر ' + (CUST_PER === 30 ? 'شهر' : CUST_PER + ' يوم'),
        note: visReady ? pct(G.active.length, list.length) + '%' : null, sub: visReady ? 'من المسجلين' : null },
      { value: visReady ? num(repeat) : '…', label: 'اشتروا مجددًا', note: visReady ? pct(repeat, G.active.length) + '%' : null, sub: visReady ? 'جم مرتين+' : null }
    ], visReady ? (function(){
      /* الهدف: 40% في الشهر، 65% في 3 شهور (المزمن + المكالمات + التسجيل) */
      var tgt = CUST_PER <= 30 ? goalOf('active_30', 40) : CUST_PER <= 90 ? goalOf('active_90', 65) : 75;
      var cur = pct(G.active.length, list.length), need = Math.max(0, Math.ceil(list.length * tgt / 100) - G.active.length);
      var w = Math.min(100, Math.round(cur / tgt * 100));
      return '<div class="c-goal"><div class="c-goal-t"><span>هدف النشطين ' + ltr(tgt + '%') + '</span><span>' +
        (need ? 'ناقص ' + ltr(num(need)) + ' عميل' : '🎯 وصلنا') + '</span></div>' +
        '<div class="c-goal-b"><i style="width:' + w + '%;background:var(--' + (cur >= tgt ? 'ok' : 'warn') + ')"></i></div></div>';
    })() : '');

    html += secBtn('calls', 'warn', 'متابعة المكالمات', 'القايمة · النتايج والملاحظات',
      CUST.calls ? ltr(num(CUST.calls.left)) : '…', 'لسه', 'setCustSec');
    var perName = CUST_PERS.filter(function(p){ return p[0] === CUST_PER; })[0][1];
    var actAvg = G.active.length && CUST_VIS ? Math.round(G.active.reduce(function(a, c){ return a + (custAvg(c) || 0); }, 0) / G.active.length * 10) / 10 : null;
    html += secBtn('active', 'ok', 'نشطين', 'زاروا خلال ' + perName +
      (actAvg !== null ? ' · متوسط ' + ltr(actAvg) + ' زيارة/شهر' : ''),
      visReady ? ltr(num(G.active.length)) : '…', tr('customers'), 'setCustSec');
    var LP = lapsedList(list);
    html += secBtn('lapsed', 'warn', 'غابوا من شهر إلى 3 أشهر', 'كانوا بيشتروا ووقفوا — أسهل ناس ترجع',
      LP ? ltr(num(LP.length)) : '…', tr('customers'), 'setCustSec');
    html += secBtn('new', 'ok', tr('newSec'), tr('newSub'),
      dash && dash.new_customers !== undefined ? ltr(num(dash.new_customers)) : '…', tr('customers'), 'setCustSec');
    html += secBtn('bot', CHATS && CHATS.some(function(c){ return c.pending; }) ? 'warn' : 'ok', 'محادثات البوت', 'واتساب وتليجرام', '', '', 'goBot');
    html += secBtn('blocked', 'ok', tr('blockedSec'), tr('blockedSub'),
      ltr(num(G.blocked.length)), tr('customers'), 'setCustSec');
    html += '<div style="height:8px"></div>';
    html += secBtn('all', 'ok', tr('allCust'), tr('allCustSub'), ltr(num(list.length)), tr('customers'), 'setCustSec');
    box.innerHTML = html;
    return;
  }

  /* ── الأقسام ── */
  var TITLES = { lapsed: 'غابوا من شهر إلى 3 أشهر', active: 'نشطين', follow: tr('needFollow'), recover: tr('recoverSec'), new: tr('newSec'),
                 blocked: tr('blockedSec'), all: tr('allCust'), calls: 'متابعة المكالمات' };
  html = secHead(TITLES[CUST.sec] || '', 'custMenu()', 'setCustSec(\'home\')') + html;

  if (CUST.sec === 'active'){
    CUST.cur = G.active; CUST.curTitle = 'نشطين';
    html += card('نشطين', ltr(num(G.active.length)) + ' ' + tr('customers'),
      G.active.length ? G.active.map(function(c){ return custRow(c); }).join('') : emptyState());
  }

  if (CUST.sec === 'lapsed'){
    var LP2 = lapsedList(list) || [];
    CUST.cur = LP2.map(function(x){ return x.c; }); CUST.curTitle = 'غابوا من شهر إلى 3 أشهر';
    html += '<div class="state" style="padding:0 0 10px;text-align:start">مترتبين بالأكتر صرفًا في آخر 3 شهور. اتصل بيهم من «متابعة المكالمات» أو دوس على العميل.</div>';
    html += card('غابوا من شهر إلى 3 أشهر', ltr(num(LP2.length)) + ' ' + tr('customers'),
      !CUST_V90 ? '<div class="state"><div class="spin"></div></div>' :
      LP2.length ? LP2.map(function(x){
        return custRow(x.c, '<span style="text-align:end"><b style="display:block;font-size:13px">' + ltr(num(x.v.s)) + ' ج</b>' +
          badge('من ' + ltr(x.d) + ' يوم', x.d > 60 ? 'bad' : 'warn') + '</span>');
      }).join('') : emptyState());
  }

  if (CUST.sec === 'calls'){ CUST.cur = []; CUST.curTitle = 'متابعة المكالمات'; html += callsHtml(CUST.calls); }

  if (CUST.sec === 'follow'){
    CUST.cur = G.follow; CUST.curTitle = tr('needFollow');
    html += '<div class="state" style="padding:0 0 10px;text-align:start">' + tr('followNote') + '</div>';
    html += card(tr('needFollow'), ltr(num(G.follow.length)) + ' ' + tr('customers'),
      G.follow.length ? G.follow.map(function(c){ return custRow(c); }).join('') : emptyState());
  }

  if (CUST.sec === 'recover'){
    CUST.cur = G.recover; CUST.curTitle = tr('recoverSec');
    if (dash){
      html += card(tr('recoverSec'), tr('thisMonth'),
        row(tr('returnRate'), ltr(num(dash.returning_customers || 0)) + ' ' + tr('customers'),
            badge(ltr(dash.return_rate) + '%', 'brand')) +
        row(tr('lossRate'), ltr(num(dash.lost_customers || 0)) + ' ' + tr('customers'),
            badge(ltr(dash.loss_rate) + '%', 'brand')) +
        row(tr('failedWord'), tr('failedSub'), ltr(num(dash.failed_followups || 0))));
    }
    html += card(tr('inRecovery'), ltr(num(G.recover.length)) + ' ' + tr('customers'),
      G.recover.length ? G.recover.map(function(c){
        var failed = c.status === ST_FAIL;
        return custRow(c, badge(ltr(num(c.follow_up_count || 0)) + ' ' + tr('attemptsWord'), failed ? 'bad' : 'warn'));
      }).join('') : emptyState());
  }

  if (CUST.sec === 'new'){
    var N = CUST.news;
    CUST.cur = (N || []).map(function(x){ return { name: x.name, phone: x.phone, cls: x.employee, days_since: null }; });
    CUST.curTitle = tr('newSec');
    if (N === null){
      html += '<div class="state"><div class="spin"></div>' + tr('loading') + '</div>';
    } else {
      var byEmp = {};
      N.forEach(function(x){ byEmp[x.employee || '—'] = (byEmp[x.employee || '—'] || 0) + 1; });
      var emps = Object.keys(byEmp).sort(function(a, b){ return byEmp[b] - byEmp[a]; });
      if (emps.length) html += card(tr('custByEmp'), tr('thisMonth'), emps.map(function(e){
        return row(e, null, ltr(num(byEmp[e])));
      }).join(''));
      html += card(tr('newSec'), ltr(num(N.length)) + ' ' + tr('customers'),
        N.length ? N.map(function(x){
          return '<div class="row"><div class="row-main"><b>' + esc(x.name || '—') + '</b><small>' +
            ltr(x.phone) + ' · ' + esc(x.employee || '') + '</small></div>' +
            badge(ltr(String(x.date || '').substring(5)), 'brand') + '</div>';
        }).join('') : emptyState());
    }
  }

  if (CUST.sec === 'blocked'){
    CUST.cur = G.blocked; CUST.curTitle = tr('blockedSec');
    html += card(tr('blockedSec'), ltr(num(G.blocked.length)) + ' ' + tr('customers'),
      G.blocked.length ? G.blocked.map(function(c){ return custRow(c); }).join('') : emptyState());
  }

  if (CUST.sec === 'all'){
    var classes = {};
    list.forEach(function(c){ if (c.cls) classes[c.cls] = 1; });
    var cl = Object.keys(classes).sort();
    html += '<input id="custQ" oninput="custFilter()" placeholder="' + tr('searchCust') + '" autocomplete="off" ' +
      'style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);' +
      'background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:10px">';
    if (cl.length > 1){
      html += '<div class="ctl"><div class="ctl-main">' +
        ctlBtn(tr('allWord'), CUST.cls === 'all', "setCustCls('all')") +
        cl.map(function(k){ return ctlBtn(esc(k), CUST.cls === k, "setCustCls('" + esc(String(k).replace(/'/g, '')) + "')"); }).join('') +
        '</div></div>';
    }
    html += '<div id="custList">' + custListHtml() + '</div>';
  }
  box.innerHTML = html;
}

/* قايمة "الكل" — بتتفلتر من غير ما نعيد رسم حقل البحث (عشان الكيبورد ميتقفلش) */
function custListHtml(){
  var q = (CUST.q || '').trim().toLowerCase();
  var rows = CUST.list.filter(function(c){
    if (CUST.cls !== 'all' && c.cls !== CUST.cls) return false;
    if (!q) return true;
    return String(c.name || '').toLowerCase().indexOf(q) !== -1 || String(c.phone || '').indexOf(q) !== -1;
  }).sort(byDaysDesc);
  CUST.cur = rows; CUST.curTitle = tr('allCust');
  return card(tr('allCust'), ltr(num(rows.length)) + ' ' + tr('customers'),
    rows.length ? rows.map(function(c){ return custRow(c); }).join('') +
      (false ? '<div class="state" style="padding:10px 0 0">' + tr('moreInExport') +
        ' (' + ltr(rows.length - 100) + ')</div>' : '') : emptyState());
}
function custFilter(){
  var el = document.getElementById('custQ'); CUST.q = el ? el.value : '';
  var box = document.getElementById('custList'); if (box) box.innerHTML = custListHtml();
}
function setCustCls(k){ CUST.cls = k; drawCustomers(CUST.list, document.getElementById('p-cust')); }

/* ── تصدير ── */
function expCustList(k){
  var rows = (CUST.cur || []).map(function(c){
    var ds = custDays(c);

/* مشتريات العميل + الدين + إجراء مقترح */
function custAdvice(c, p){
  var ds = custDays(c), lim = parseFloat(c.alert_days) || 30;
  var debt = (p && p.debt && p.debt.net) || 0, dp = p && p.debt ? p.debt.daysSincePaid : null;
  var last = p && p.purchases && p.purchases[0];
  var top = last ? last.items.slice(0, 2).map(function(i){ return i.name; }).join(' و') : '';
  if (c.is_blocked) return { tone: 'slate', text: 'العميل محظور — لا توجد إجراء.' };
  if (debt > 0 && (dp === null || dp > 30))
    return { tone: 'bad', text: 'عليه دين ' + num(debt) + ' ج' + (dp !== null ? ' وآخر حركة من ' + dp + ' يوم' : '') +
      ' — كلّمه للسداد الأول قبل أي عرض.',
      msg: 'أهلاً ' + (c.name || '') + '، صيدلية السوسي. حابين نفكّرك بالمبلغ المتبقي عليك ' + num(debt) + ' جنيه. تقدر تسدده في أي وقت، شكراً لتعاملك معانا.' };
  if (ds !== null && ds > lim)
    return { tone: 'warn', text: 'غايب ' + ds + ' يوم (حد التنبيه ' + lim + ')' + (top ? ' — اسأله لو محتاج ' + top : '') +
      (debt > 0 ? ' · عليه دين ' + num(debt) + ' ج (ذكّره بلطف)' : '') + '.',
      msg: 'أهلاً ' + (c.name || '') + '، صيدلية السوسي 🌿 وحشتنا!' + (top ? ' لو محتاج ' + top + ' أو أي حاجة تانية إحنا موجودين.' : ' لو محتاج أي حاجة إحنا موجودين.') };
  if (debt > 0) return { tone: 'warn', text: 'عميل منتظم وعليه دين ' + num(debt) + ' ج — ذكّره عند الزيارة الجاية.' };
  return { tone: 'ok', text: 'عميل منتظم — لا توجد إجراء.' };
}

  var c = CUST.one; if (!c) return;

function settingsSelect(key,restoring){
  if(!SETTINGS.root)return;if(key && !SETTINGS_ITEMS.some(function(x){return x[0]===key;}))return;
  if(!restoring)settingsRemember();SETTINGS.key=key;
  SETTINGS.root.querySelector('#settingsNav').hidden=!!key;SETTINGS.root.querySelector('#settingsBar').hidden=!key;
  SETTINGS.root.querySelectorAll('[data-setting]').forEach(function(panel){panel.hidden=panel.dataset.setting!==key;});

  if(keys.some(function(k){return SETTINGS.dirty[k];})){toast('احفظ تعديلاتك الأول عشان التحديث ما يمسحهاش');return;}

/* 📷 فحص جاهزية الجرد بالكاميرا.
   أهم رقم فيه: "أصناف بأكثر من صلاحية" — دول اللي الشاشة هتوقف
   عندهم وتطلب من الموظف يوزّع الكمية. لو نسبتهم عالية، تصميم
   شاشة الجرد نفسه لازم يتغيّر. */
/* بيقيس اللقطة جزء جزء. ممكن ياخد كذا دقيقة — ده طبيعي، لأنه
   بيعمل نفس شغل اللقطة الحقيقي عشان يقيسه. */
/* ═══ نتايج الجرد ═══
   الموظف بيجرد من صفحة scan.html المنفصلة، والنتيجة بتيجي هنا.
   الترتيب بقيمة الفرق — الأغلى فوق، لأنه ده اللي يستاهل وقتك. */
var CNT = { sessions: [], open: null };

function pgCounts(){
  var box = document.getElementById('p-stock');
  var seed = cacheGet('counts', {});
  if (seed) { CNT.sessions = seed; drawCounts(); } else busy(box);

  Promise.all([ api('countSessions'),
                api('countActivity', { range:'month' }).catch(function(){ return null; }) ])
  .then(function(r){
    var d = r[0];
    if (!d || !d.ok) throw new Error('counts');
    CNT.sessions = d.sessions || [];
    CNT.act = r[1];
    cacheSet('counts', {}, CNT.sessions);
    markSync(); drawCounts();
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgCounts()"); });
}

function drawCounts(){
  var box = document.getElementById('p-stock');
  var L = CNT.sessions || [];
  var A = CNT.act || null;

  /* مين شغال دلوقتي + جرد كل موظف.
     ⚠️ الترتيب بالأصناف مش بالعلب عن قصد — لو قسنا بالعلبة الموظف
     هيابحث على الرفوف اللي فيها كميات كبيرة ويسيب الصعبة. */
  var actHtml = '';
  if (A && A.ok){
    if ((A.live||[]).length){
      actHtml += card(tr('liveNow'), null, A.live.map(function(x){
        return '<div class="row"><div class="row-main"><b>' + esc(x.who) + '</b>' +
          '<small>' + esc(x.title) + ' · ' + ltr(num(x.units)) + ' ' + tr('boxes') +
          ' · ' + agoMs(x.lastMs) + '</small></div>' +
          badge(ltr(num(x.items)) + ' ' + tr('items'), 'ok') + '</div>';
      }).join(''));
    }
    if ((A.staff||[]).length){
      actHtml += card(tr('staffCounts'), A.label, A.staff.map(function(x){
        return '<div class="row"><div class="row-main"><b>' + esc(x.who) + '</b>' +
          '<small>' + ltr(num(x.units)) + ' ' + tr('boxes') + ' · ' +
          ltr(x.days) + ' ' + tr('daysWord') + ' · ' + tr('hasGap') + ' ' +
          ltr(num(x.gaps)) + '</small></div>' +
          badge(ltr(num(x.items)) + ' ' + tr('items') + ' · ' + ltr(x.coverage) + '%',
                x.coverage >= 10 ? 'ok' : 'warn') + '</div>';
      }).join(''));
    }
  }
  if (!L.length){
    box.innerHTML =
      '<button class="btn btn-quiet" onclick="openDue()" style="margin-bottom:10px">' +
      tr('needsCount') + '</button>' + actHtml +
      card(tr('counts'), null, '<div class="state">' + tr('noCounts') + '</div>');
    return;
  }
  var totDiff = 0;
  L.forEach(function(x){ totDiff += Math.abs(+x.diffValue || 0); });

  var html = '<button class="btn btn-quiet" onclick="openDue()" style="margin-bottom:10px">' +
             tr('needsCount') + '</button>' +
             vitals(tr('counts'), null, [
    { value: num(L.length), label: tr('countSessions'), tone: 'brand' },
    { value: num(L[0].lines), label: tr('lastCount'), tone: 'ok', sub: tr('items') },
    { value: num(Math.round(totDiff)), label: tr('gapValue'), tone: 'warn', sub: tr('egp') }
  ]);

  html += actHtml;
  html += card(tr('countHistory'), null, L.map(function(x){
    var bad = Math.abs(+x.diffValue || 0) > 0.5;
    return '<div class="row" onclick="openCount(\'' + esc(x.id) + '\')" style="cursor:pointer">' +
      '<div class="row-main"><b>' + esc(x.title || '—') + '</b>' +
      '<small>' + esc(String(x.at).substring(0,16)) +
      (x.by ? ' · ' + esc(x.by) : '') +
      ' · ' + ltr(num(x.lines)) + ' ' + tr('items') + '</small></div>' +
      (bad ? '<span class="badge warn" onclick="event.stopPropagation();openFix(\'' +
             esc(x.id) + '\')" style="cursor:pointer">' + tr('fix') + '</span>' : '') +
      badge(ltr(num(x.diffValue)), bad ? 'bad' : 'ok') +
      '<span onclick="event.stopPropagation();askDeleteCount(\'' + esc(x.id) + '\',\'' +
        esc(String(x.title||'').replace(/'/g,'')) + '\',' + (x.lines||0) +
        ')" style="cursor:pointer;padding:6px 10px;opacity:.55">🗑</span></div>';
  }).join(''));

  box.innerHTML = html;
}

/* تفاصيل جلسة — الفروقات بس بتهمّك، فبتيجي الأول */
function openCount(id){
  var t = document.getElementById('sheet-title'), b = sheetBody();
  document.getElementById('sheet').classList.add('on');
  t.textContent = tr('countDetail');
  b.innerHTML = '<div class="state"><div class="spin"></div></div>';
  api('countReport', { session: id }).then(function(d){
    if (!d || !d.ok){ b.innerHTML = '<div class="state err">' + tr('failed') + '</div>'; return; }
    var L = d.lines || [];
    var diff = L.filter(function(x){ return Math.abs(x.diff) > 0.001; });
    var same = L.length - diff.length;

    var h = '<div class="state">' + tr('matched') + ': ' + ltr(num(same)) +
            ' · ' + tr('hasGap') + ': ' + ltr(num(diff.length)) + '</div>';

    if (diff.length){
      h += '<div class="group-title">' + tr('gaps') + '</div>';
      h += diff.map(function(x){
        var tone = x.diff > 0 ? 'warn' : 'bad';
        return '<div class="row"><div class="row-main"><b>' + esc(x.name) + '</b>' +
          '<small>' + (x.expire && x.expire !== '—' ? esc(x.expire) + ' · ' : '') +
          tr('system') + ' ' + ltr(num(x.sys)) + ' · ' + tr('counted') + ' ' + ltr(num(x.counted)) +
          (x.note ? ' · ' + esc(x.note) : '') + '</small></div>' +
          badge((x.diff > 0 ? '+' : '') + ltr(num(x.diff)), tone) + '</div>';
      }).join('');
    }
    if (same){
      h += '<div class="group-title">' + tr('matchedItems') + '</div>' +
        L.filter(function(x){ return Math.abs(x.diff) <= 0.001; }).map(function(x){
          return '<div class="row"><div class="row-main"><b>' + esc(x.name) + '</b>' +
            '<small>' + ltr(num(x.counted)) + '</small></div></div>';
        }).join('');
    }
    b.innerHTML = h;
  }).catch(function(e){ logErr(e); b.innerHTML = '<div class="state err">' + tr('failed') + '</div>'; });
}

function doDeleteCount(id){
  var w = (document.getElementById('delWord') || {}).value || '';
  if (w.trim() !== 'مسح'){ toast(tr('typeToConfirm')); return; }
  closeSheetX();
  toast(tr('deleting'));
  post({ action: 'deleteCount', sessionId: id, confirm: 'DELETE' }).then(function(d){
    if (!d || !d.ok){ toast((d && d.error) || tr('failed')); return; }
    toast(tr('deleted'));
    try{ localStorage.removeItem(cacheKey('counts', {})); }catch(e){}
    pgCounts();
  }).catch(function(e){ logErr(e); toast(tr('failed')); });
}

function agoMs(ms){
  if (!ms) return '';
  var m = Math.round((Date.now() - ms)/60000);
  if (m < 2) return tr('justNow');
  if (m < 60) return ltr(m) + ' ' + tr('minAgo');
  return ltr(Math.round(m/60)) + ' ' + tr('hrAgo');
}

/* ═══ نافذة تفاصيل فئة المصروفات ═══
   الفئة لوحدها رقم مجمّع — الفايدة إنك تشوف مكوّناته: مين أكبر
   مورّد، وإزاي اتوزّع على الأيام. */
function openExpCat(cat){
  var t = document.getElementById('sheet-title'), b = sheetBody();
  document.getElementById('sheet').classList.add('on');
  t.textContent = cat;

  var rows = (EXP_ITEMS || []).filter(function(i){ return i.category === cat; });
  if (!rows.length){ b.innerHTML = '<div class="state">' + tr('noData') + '</div>'; return; }

  var total = 0, byCo = {}, byDay = {};
  rows.forEach(function(i){
    total += i.amount;
    var co = i.company || i.name || '—';
    byCo[co] = (byCo[co] || 0) + i.amount;
    byDay[i.date] = (byDay[i.date] || 0) + i.amount;
  });

  var coList = Object.keys(byCo).map(function(k){ return { k:k, v:byCo[k] }; })
                 .sort(function(a,b){ return b.v - a.v; });
  var dayList = Object.keys(byDay).sort().reverse();

  var h = '<div class="state">' + tr('total') + ' ' + ltr(num(total)) + ' ' + tr('egp') +
          ' · ' + ltr(num(rows.length)) + ' ' + tr('entries') + '</div>';

  if (coList.length > 1){
    h += '<div class="group-title">' + tr('bySupplier') + '</div>' +
      coList.map(function(c){
        return '<div class="row"><div class="row-main"><b>' + esc(c.k) + '</b>' +
          '<small>' + ltr(pct(c.v, total)) + '%</small></div>' +
          '<span class="v">' + ltr(num(c.v)) + '</span></div>';
      }).join('');
  }

function copyFix(){
  if (!FIX || !FIX.text) return;
  var done = function(){ toast(tr('copied')); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(FIX.text).then(done).catch(fallbackCopy);
  } else fallbackCopy();
  function fallbackCopy(){
    /* Safari القديم مبيدعمش clipboard API خارج سياق آمن */
    var ta = document.createElement('textarea');
    ta.value = FIX.text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast(tr('failed')); }
    document.body.removeChild(ta);
  }
}

function runClean(apply){
  var box = document.getElementById('cleanbox');
  box.innerHTML = '<div class="state"><div class="spin"></div>' + tr('loading') + '</div>';
  api('cleanBackups', apply ? { apply: 1 } : {}).then(function(d){
    if (!d || !d.ok){ box.innerHTML = '<div class="state err">' + esc((d && d.error) || tr('failed')) + '</div>'; return; }
    var h = row('كل النسخ', null, ltr(num(d.total))) +
      row('هيفضل', ltr(num(d.keepMB)) + ' MB', ltr(num(d.keep))) +
      row('هيتمسح', ltr(num(d.freeMB)) + ' MB', badge(ltr(num(d.remove)), d.remove ? 'warn' : 'ok'));
    if (apply){
      h += '<div class="state">اتنقل لسلة المهملات: ' + ltr(num(d.trashed)) +
        (d.remaining ? ' — فاضل ' + ltr(num(d.remaining)) + '، بيكمّل لوحده...' : ' ✓') + '</div>' +
        (d.remaining ? '' : '<button class="btn btn-danger" onclick="runPurge()">امسح نهائي ورجّع المساحة</button>');
      if (d.remaining && d.trashed){ setTimeout(function(){ runClean(1); }, 500); box.innerHTML = h; return; }
    }
    if (d.remove || (apply && d.remaining))
      h += '<button class="btn btn-danger" onclick="runClean(1)">نفّذ — انقلهم لسلة المهملات</button>';
    h += '<button class="btn btn-quiet" onclick="api(\'cleanBackupsAuto\').then(function(){toast(\'✓ هيتنضف كل يوم الساعة 5 الصبح\')})">تشغيل يومي تلقائي</button>';
    box.innerHTML = h;
  }).catch(function(e){ box.innerHTML = '<div class="state err">' + esc(String(e)) + '</div>'; });
}
function runPurge(){

  runPurgeGo_();
}
function runPurgeGo_(){
  var box = document.getElementById('cleanbox');

      row(tr('scanNoExp'), null, ltr(num(d.noExp || 0))) +

/* ═══ السحب لتحت = تحديث (التطبيق المتثبّت على iPhone ملوش السحب بتاع Safari) ═══ */
(function(){
  var ind = document.createElement('div'); ind.id = 'ptr'; ind.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  document.body.appendChild(ind);
  var y0 = null, dy = 0, LIMIT = 70;
  function sheetOpen(){ var s = document.getElementById('sheet'); return s && s.classList.contains('on'); }
  document.addEventListener('touchstart', function(e){
    if (window.scrollY > 0 || sheetOpen() || e.touches.length !== 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ ind.style.opacity = 0; return; }
    var d = Math.min(dy, 120);
    ind.style.opacity = Math.min(1, d / LIMIT);
    ind.style.transform = 'translate(-50%,' + (d * 0.6) + 'px) rotate(' + (d * 3) + 'deg)';
    ind.classList.toggle('ready', dy > LIMIT);
  }, { passive: true });
  document.addEventListener('touchend', function(){
    if (y0 === null) return;
    var go = dy > LIMIT && window.scrollY <= 0; y0 = null;
    if (go){ ind.classList.add('spin'); setTimeout(function(){ location.reload(); }, 150); }
    else { ind.style.opacity = 0; ind.style.transform = 'translate(-50%,0)'; }
  }, { passive: true });
})();
