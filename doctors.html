<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صيدلية السوسي — بحث للأطباء</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#12302b;--mut:#6b7f7a;--line:#e1e9e7;--brand:#0f7a6b;--ok:#13894f;--low:#b7791f;--bad:#c0392b;--okbg:#e5f6ec;--lowbg:#fdf3df;--badbg:#fbe9e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
header img{width:44px;height:44px;border-radius:10px;display:none;background:#fff}
header h1{font-size:18px;margin:0}
header small{display:block;color:var(--mut);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--brand)}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.gate{margin-top:30px;text-align:center}
.gate p{color:var(--mut);margin:0 0 12px}
.gate input{text-align:center;letter-spacing:2px;margin-bottom:10px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.hint{color:var(--mut);font-size:13px;margin:10px 4px 0}
.res{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin-top:2px;direction:ltr;text-align:right}
.cat{color:var(--mut);font-size:12px;margin-top:2px}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.low{background:var(--lowbg);color:var(--low)}.out{background:var(--badbg);color:var(--bad)}
.pr{margin-top:8px;font-weight:700;color:var(--brand)}
.alts{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.alts b{color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.alt{display:flex;justify-content:space-between;padding:3px 0}
.state{text-align:center;color:var(--mut);padding:28px 10px}
.wa{display:none;margin-top:14px;text-align:center}
.wa a{display:inline-block;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:12px}
.add{margin-top:10px;width:100%;background:var(--bg);color:var(--brand);border:1px solid var(--brand);padding:9px;font-size:14px}
.add.in{background:var(--brand);color:#fff}
.fz{background:var(--lowbg);color:var(--low);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}
.hello{color:var(--mut);font-size:13px;margin:0 4px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:none;z-index:5}
.bar button{width:100%;font-size:16px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9;align-items:flex-end}
.sheet .in{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ci span.t{flex:1;font-size:14px;font-weight:600}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:2px 12px;font-size:18px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.rm{background:none;color:var(--bad);padding:4px 8px;font-size:18px}
textarea{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:12px;min-height:60px}
.okmsg{color:var(--ok);text-align:center;padding:18px;font-weight:700}
.out-link{background:none;color:var(--mut);font-size:12px;padding:6px;font-weight:400;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="">
    <div><h1>صيدلية السوسي</h1><small>بحث الأدوية المتوفرة — للأطباء</small></div>
  </header>

  <div id="gate" class="box gate" style="display:none">
    <p>اكتب كود الدخول اللي اتبعتلك</p>
    <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="الكود">
    <button onclick="enter()">دخول</button>
    <div class="err" id="gerr"></div>
  </div>

  <div id="app" style="display:none">
    <div class="hello" id="hello"></div>
    <div class="box">
      <input id="q" type="search" placeholder="اسم الدواء أو المادة الفعالة…" autocomplete="off" enterkeyhint="search">
      <div class="hint">اكتب حرفين أو أكتر — بالعربي أو الإنجليزي. تقدر تدوّر بالمادة الفعالة (مثلاً: amoxicillin).</div>
    </div>
    <div class="res" id="res"></div>
    <div class="wa" id="wa"><a id="walink" target="_blank" rel="noopener">اسأل الصيدلية على واتساب</a></div>
    <div style="text-align:center"><button class="out-link" onclick="logout()">خروج</button></div>
  </div>
</div>
<div class="bar" id="bar"><button onclick="openCart()" id="barbtn"></button></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeCart()"><div class="in" id="sheetin"></div></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyETI5UTPwpMFOu-aWoKKHqyppa7ctTVJjckmbTxegDq7E3R3p6aEBzqt275HNL8SBfWg/exec';
var WA_NUMBER = '';   /* رقم واتساب الصيدلية بالصيغة الدولية بدون + (مثال: 2010XXXXXXXX) — فاضي = الزرار مخفي */
var KEY = '', timer = null, seq = 0, LAST = [], CART = [], DNAME = '';
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
var LBL = { ok:'متوفر', low:'كمية محدودة', out:'غير متوفر' };

function show(app){
  $('gate').style.display = app ? 'none' : 'block';
  $('app').style.display = app ? 'block' : 'none';
  if (app) { $('q').focus(); }
}
function enter(){
  var c = $('code').value.trim();
  if (!c) return;
  $('gerr').textContent = 'بتأكد…';
  call('__check', c).then(function(d){
    if (d && d.ok){ KEY = c; DNAME = d.doctor || ''; lsSet('docKey', c); $('gerr').textContent = ''; show(true); hello(); }
    else $('gerr').textContent = (d && d.msg) || 'مشكلة في الاتصال';
  }).catch(function(){ $('gerr').textContent = 'النت مش راضي'; });
}
function logout(){ lsDel('docKey'); lsDel('docCart'); CART = []; cartUi(); KEY = ''; $('res').innerHTML = ''; $('q').value = ''; $('code').value = ''; show(false); }

function call(q, k){
  return fetch(API + '?action=doctorSearch&q=' + encodeURIComponent(q) + '&k=' + encodeURIComponent(k))
    .then(function(r){ return r.json(); });
}

function card(it){
  var h = '<div class="it"><div class="top"><div><div class="nm">' + esc(it.n) + '</div>';
  if (it.a) h += '<div class="sub">' + esc(it.a) + '</div>';
  if (it.c) h += '<div class="cat">' + esc(it.c) + '</div>';
  h += '</div><span class="pill ' + it.st + '">' + LBL[it.st] + '</span></div>';
  if (it.st !== 'out' && it.p > 0) h += '<div class="pr">' + esc(it.p) + ' ج</div>';
  if (it.st === 'out' && it.alts && it.alts.length){
    h += '<div class="alts"><b>بنفس المادة الفعالة ومتوفر:</b>' + it.alts.map(function(a){
      return '<div class="alt"><span>' + esc(a.n) + '</span><span>' + (a.p > 0 ? esc(a.p) + ' ج' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  var i = CART.findIndex(function(c){ return c.n === it.n; });
  h += '<button class="add' + (i >= 0 ? ' in' : '') + '" onclick="addItem(' + LAST.indexOf(it) + ')">' +
       (i >= 0 ? '✓ في القائمة (' + CART[i].q + ') — زوّد' : '＋ أضف للقائمة') + '</button>';
  return h + '</div>';
}

function search(){
  var q = $('q').value.trim(), my = ++seq;
  if (q.length < 2){ $('res').innerHTML = ''; return; }
  $('res').innerHTML = '<div class="state">بدوّر…</div>';
  call(q, KEY).then(function(d){
    if (my !== seq) return;
    if (!d || !d.ok){
      if (d && d.error === 'bad_code'){ logout(); $('gerr').textContent = 'الكود اتغيّر — اطلب الكود الجديد'; return; }
      $('res').innerHTML = '<div class="state">' + esc((d && d.msg) || 'حصلت مشكلة، حاول تاني') + '</div>'; return;
    }
    if (!d.results.length){
      $('res').innerHTML = '<div class="state">مفيش صنف بالاسم ده في المخزون.<br>جرّب المادة الفعالة أو اسم تاني.</div>'; return;
    }
    var more = d.total > d.results.length ? '<div class="hint">ظاهر أول ' + d.results.length + ' من ' + d.total + ' — اكتب أكتر لتضييق البحث.</div>' : '';
    LAST = d.results;
    $('res').innerHTML = (d.fuzzy ? '<div class="fz">مفيش تطابق تام — دي أقرب النتائج لاسمك 👇</div>' : '') + d.results.map(card).join('') + more;
  }).catch(function(){ if (my === seq) $('res').innerHTML = '<div class="state">النت مش راضي</div>'; });
}

function hello(){ $('hello').textContent = DNAME ? 'أهلاً د. ' + DNAME : ''; }
function saveCart(){ lsSet('docCart', JSON.stringify(CART)); }
function cartUi(){
  var n = CART.reduce(function(a, c){ return a + c.q; }, 0);
  $('bar').style.display = CART.length ? 'block' : 'none';
  $('barbtn').textContent = 'قائمتي (' + CART.length + ' صنف) — مراجعة وإرسال';
  document.body.style.paddingBottom = CART.length ? '70px' : '0';
}
function addItem(i){
  var it = LAST[i]; if (!it) return;
  var c = CART.find(function(x){ return x.n === it.n; });
  if (c) c.q = Math.min(99, c.q + 1); else CART.push({ n: it.n, q: 1 });
  saveCart(); cartUi(); search_redraw();
}
function search_redraw(){
  if (LAST.length) $('res').innerHTML = LAST.map(card).join('');
}
function openCart(){
  var h = '<h3>قائمتي للصيدلية</h3>' + CART.map(function(c, i){
    return '<div class="ci"><span class="t">' + esc(c.n) + '</span><div class="qty">' +
      '<button onclick="qty(' + i + ',-1)">−</button><b>' + c.q + '</b><button onclick="qty(' + i + ',1)">＋</button>' +
      '<button class="rm" onclick="qty(' + i + ',-99)">✕</button></div></div>';
  }).join('') +
  '<textarea id="note" placeholder="ملاحظة للصيدلية (اختياري)"></textarea>' +
  '<div class="err" id="cerr"></div>' +
  '<button style="width:100%;margin-top:10px" id="sendbtn" onclick="sendCart()">ابعت للصيدلية</button>' +
  '<button class="out-link" style="width:100%" onclick="closeCart()">رجوع</button>';
  $('sheetin').innerHTML = h; $('sheet').style.display = 'flex';
}
function closeCart(){ $('sheet').style.display = 'none'; }
function qty(i, d){
  CART[i].q += d;
  if (CART[i].q < 1) CART.splice(i, 1);
  if (CART[i] && CART[i].q > 99) CART[i].q = 99;
  saveCart(); cartUi(); search_redraw();
  if (!CART.length) closeCart(); else openCart();
}
function sendCart(){
  var b = $('sendbtn'); b.disabled = true; b.textContent = 'ببعت…';
  var note = $('note').value;
  fetch(API + '?action=doctorOrder&k=' + encodeURIComponent(KEY) + '&items=' + encodeURIComponent(JSON.stringify(CART)) +
        '&note=' + encodeURIComponent(note)).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok){
      CART = []; saveCart(); cartUi(); search_redraw();
      $('sheetin').innerHTML = '<div class="okmsg">✅ اتبعتت للصيدلية — هنتواصل معاك</div><button style="width:100%" onclick="closeCart()">تمام</button>';
    } else { b.disabled = false; b.textContent = 'ابعت للصيدلية'; $('cerr').textContent = (d && d.msg) || 'حصلت مشكلة'; }
  }).catch(function(){ b.disabled = false; b.textContent = 'ابعت للصيدلية'; $('cerr').textContent = 'النت مش راضي'; });
}

$('q').addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(search, 350); });
$('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') enter(); });

(function(){
  if (WA_NUMBER){
    $('walink').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent('أنا دكتور وعايز أستفسر عن دواء: ');
    $('wa').style.display = 'block';
  }
  var img = $('logo');
