<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<title>صيدلية السوسي</title>
<style>
/* ══════════════════════════════════════════════════════════
   نظام التصميم — المصدر الوحيد لكل شكل في التطبيق.
   تغيّر رقم هنا → يتغيّر في كل صفحة.
   ══════════════════════════════════════════════════════════ */
:root{
  /* الأسطح */
  --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F24; --line:#25292F;
  /* النص */
  --ink:#F2F4F7; --ink-2:#9BA3AF; --ink-3:#5F6670;
  /* المعاني — 3 بس */
  --brand:#1B92D4; --ok:#3DBE8B; --warn:#E8A33D; --bad:#E5646E;
  /* المسافات */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
  /* الحواف */
  --r1:8px; --r2:12px; --r3:18px;
  /* الخط */
  --t-micro:11px; --t-small:12px; --t-body:14px;
  --t-title:16px; --t-head:20px; --t-vital:26px;
}
body.light{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF2; --line:#E1E4E9;
  --ink:#14171A; --ink-2:#5A626C; --ink-3:#8B939D;
  --brand:#1272A6; --ok:#1E8A5F; --warn:#9A6410; --bad:#C33B47;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  font-size:var(--t-body);line-height:1.5;padding-bottom:84px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* الأرقام: لاتينية دايمًا ومعزولة عن اتجاه العربي */
.n{direction:ltr !important;unicode-bidi:isolate !important;display:inline-block;font-variant-numeric:tabular-nums}

/* ── الرأس ── */
.top{
  position:sticky;top:0;z-index:80;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding:var(--s3) var(--s4);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
.mark{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:#fff;padding:3px;
  object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.brand h1{font-size:var(--t-title);font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.brand p{font-size:var(--t-micro);color:var(--ink-3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:var(--s2);flex-shrink:0}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;
  cursor:pointer;font-size:13px;font-weight:700}

/* ── تبويبات القسم ── */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:10px var(--s4);
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:59px;z-index:70;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs.hide{display:none}
.subtabs button{flex-shrink:0;background:var(--surface-2);border:0;color:var(--ink-2);
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--brand);color:#fff}

/* ── الحاوية ── */
.wrap{padding:var(--s4);max-width:680px;margin:0 auto}

/* ── الكارت ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s3)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.card-head h3{font-size:var(--t-title);font-weight:650;letter-spacing:-.2px}
.card-head p{font-size:var(--t-small);color:var(--ink-2);margin-top:2px}

/* ── شريط المؤشرات: بداية كل قسم ── */
.vitals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s4)}
.vitals-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.vitals-head h2{font-size:var(--t-head);font-weight:700;letter-spacing:-.5px}
.vitals-head span{font-size:var(--t-micro);color:var(--ink-3);white-space:nowrap}
/* كل مؤشر في مربع مستقل — الرقم في سطر والكلام في سطر،
   فمفيش خلط اتجاهات في نفس السطر أصلاً */
.vitals-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.vital{background:var(--surface-2);border-radius:var(--r2);padding:12px 10px;
  min-width:0;text-align:center;border-top:2px solid var(--tone,var(--brand))}
.vital small{display:block;font-size:var(--t-micro);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.vital b{display:block;font-size:22px;font-weight:700;letter-spacing:-.8px;line-height:1.15;
  direction:ltr;unicode-bidi:isolate}
.vital i{display:block;font-style:normal;font-size:var(--t-micro);font-weight:700;
  color:var(--tone,var(--brand));margin-top:6px;direction:ltr;unicode-bidi:isolate}
.vital u{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── السطر ── */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row-main{min-width:0}
.row-main b{display:block;font-size:var(--t-body);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px}
.row-val{font-size:var(--t-body);font-weight:650;white-space:nowrap}
.group-title{font-size:var(--t-micro);font-weight:650;color:var(--ink-3);
  letter-spacing:.3px;padding:var(--s3) 0 var(--s1)}

/* ── الشارة ── */
.badge{font-size:var(--t-micro);font-weight:650;padding:4px 9px;border-radius:99px;white-space:nowrap;
  background:color-mix(in srgb,var(--tone,var(--ink-2)) 15%,transparent);color:var(--tone,var(--ink-2))}

/* ── التنبيه ── */
.alert{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);
  border-radius:var(--r2);margin-bottom:var(--s2);
  background:color-mix(in srgb,var(--tone) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--tone) 25%,transparent)}
.alert .dot{width:7px;height:7px;border-radius:99px;background:var(--tone);margin-top:6px;flex-shrink:0}
.alert b{display:block;font-size:var(--t-body);font-weight:600}
.alert small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:1px}

/* ── الأزرار ── */
.btn{display:block;width:100%;padding:12px;border:0;border-radius:var(--r2);
  font-size:var(--t-body);font-weight:650;cursor:pointer;margin-bottom:var(--s2)}
.btn-primary{background:var(--brand);color:#fff}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.btn-row{display:flex;gap:var(--s2)}
.btn-row .btn{margin-bottom:0}
.exp-btns{display:flex;gap:6px}
.exp-btns button{background:var(--surface-2);border:0;color:var(--ink-2);font-family:inherit;
  font-size:var(--t-micro);font-weight:650;padding:5px 10px;border-radius:99px;cursor:pointer}


/* ── سطر التحكّم: قاعدة واحدة لكل الصفحات ──
   الفلتر الأساسي شمال · زرار ⋯ يمين بيفتح الباقي */
.ctl{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.ctl-main{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ctl-main::-webkit-scrollbar{display:none}
.ctl-main button{flex-shrink:0;background:var(--surface-2);border:0;color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;
  cursor:pointer;white-space:nowrap}
.ctl-main button.on{background:var(--brand);color:#fff}
.ctl-more{flex-shrink:0;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;display:grid;place-items:center}
.ctl-more.dot{position:relative}
.ctl-more.dot::after{content:'';position:absolute;top:6px;inset-inline-end:6px;
  width:6px;height:6px;border-radius:99px;background:var(--brand)}

/* قايمة ⋯ */
.menu-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.menu-row:last-child{border-bottom:0}
.menu-row b{font-size:var(--t-body);font-weight:600}
.menu-row small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:1px}
.menu-ic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--tone,var(--brand)) 15%,transparent);color:var(--tone,var(--brand));
  font-size:15px}

/* ── الحالات ── */
.state{padding:var(--s6) var(--s4);text-align:center;color:var(--ink-2);font-size:var(--t-small)}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto var(--s3)}
@keyframes sp{to{transform:rotate(360deg)}}
.state.err{color:var(--bad)}
.state u{cursor:pointer}

/* ── شريط الأقسام ── */
.secnav{position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.secnav button{background:0;border:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:600;padding:4px 0}
.secnav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.secnav button.on{color:var(--brand)}

.screen{display:none}
.screen.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}.spin{animation-duration:1.4s}}


/* ── شبكة الموظفين ── */
/* الموظفين تحت بعض — صف كامل لكل واحد */
.staff-grid{display:block}
.staff{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3) var(--s4);cursor:pointer;margin-bottom:var(--s2);
  border-inline-start:3px solid var(--tone,var(--brand));
  display:flex;align-items:center;gap:var(--s3)}
.staff-body{flex:1;min-width:0}
.staff-top{display:flex;align-items:center;gap:6px;min-width:0}
.staff-top b{font-size:var(--t-body);font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.staff-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex-shrink:0}
.staff-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:5px;
  font-size:var(--t-micro);color:var(--ink-2)}
.staff-meta span{white-space:nowrap}
.staff-right{text-align:center;flex-shrink:0;min-width:78px}
.staff-sales{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;
  direction:ltr;unicode-bidi:isolate}
.staff-sales u{display:block;text-decoration:none;font-size:9px;color:var(--ink-3);
  font-weight:600;margin-top:1px}
.staff-score{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:99px;direction:ltr;unicode-bidi:isolate;
  background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--tone)}
.staff-shift{font-size:10px;color:var(--ok);direction:ltr;unicode-bidi:isolate}

/* ── مقاييس داخل النافذة ── */
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.mini{background:var(--surface-2);border-radius:var(--r1);padding:10px;text-align:center}
.mini small{display:block;font-size:10px;color:var(--ink-2);margin-bottom:4px}
.mini b{display:block;font-size:18px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--tone,var(--brand))}

/* ── نافذة منبثقة ── */
.sheet{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,#000 55%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-width:680px;
  border-radius:var(--r3) var(--r3) 0 0;padding:var(--s4);max-height:82vh;overflow:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.sheet-head b{font-size:var(--t-title);font-weight:700}
.sheet-head span{font-size:var(--t-small);color:var(--ink-2);cursor:pointer}

/* ── التوست ── */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  padding:10px 16px;border-radius:99px;font-size:var(--t-small);font-weight:600;
  z-index:300;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

/* ═══════════ ٢) المساعدات ═══════════ */
function num(v, d){
  var x = parseFloat(v);
  if (isNaN(x)) return '—';
  return x.toLocaleString('en-US', { maximumFractionDigits: (d === undefined ? 0 : d) });
}
var LRI = '\u2066', PDI = '\u2069';
function ltr(t){ return '<span dir="ltr" class="n">' + LRI + t + PDI + '</span>'; }
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pct(a, b){ return (b > 0) ? Math.round(a / b * 100) : 0; }
function dur(min){
  if (min === null || min === undefined) return null;
  var h = Math.floor(min / 60), m = min % 60;
  return (h ? h + (LANG==='ar'?'س ':'h ') : '') + m + (LANG==='ar'?'د':'m');
}
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}
function toggleTheme(){
  var on = document.body.classList.toggle('light');
  try{ localStorage.setItem('theme', on ? 'light' : 'dark'); }catch(e){}
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', on ? '#F4F5F7' : '#0A0B0D');
}
function markSync(){
  var el = document.getElementById('sync');
  if (el) el.textContent = new Date().toLocaleTimeString(LANG === 'ar' ? 'ar-EG' : 'en-US', {hour:'2-digit',minute:'2-digit'});
}

/* سجل الأخطاء — أي فشل بيتسجّل بدل ما يضيع في صمت */
var ERRORS = [];
function logErr(e){
  try{
    ERRORS.push({ t: new Date().toLocaleTimeString('en-US'), m: (e && (e.message || e)) + '' });
    if (ERRORS.length > 60) ERRORS.shift();
    if (window.console) console.warn('[خطأ]', e);
  }catch(x){}
}

/* ═══════════ ٣) الاتصال بالسيرفر ═══════════
   كل نداء بيعدّي من هنا — لو الرابط اتغيّر، يتغيّر في مكان واحد. */
function api(action, params, base){
  var url = (base || SCRIPT_URL) + '?action=' + action;
  for (var k in (params || {})) if (params[k] != null) url += '&' + k + '=' + encodeURIComponent(params[k]);
  url += '&_ts=' + Date.now();
  return fetch(url, { cache: 'no-store' }).then(function(r){ return r.json(); });
}
function post(body){
  return fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}

/* ═══ الكاش المحلي ═══
   سفاري بيقفل الصفحة لما تسيبها في الخلفية ويعيد تحميلها لما ترجع.
   بنحفظ آخر رد ناجح، فأول ما تفتح بيظهر على طول والتحديث بيحصل ورا. */
function cacheKey(a, p){ return 'c:' + a + ':' + JSON.stringify(p || {}); }
function cacheGet(a, p){
  try{
    var raw = localStorage.getItem(cacheKey(a, p)); if (!raw) return null;
    var o = JSON.parse(raw);
    if (Date.now() - o.t > 86400000) return null;   /* أقدم من يوم = نتجاهله */
    return o.d;
  }catch(e){ return null; }
}
function cacheSet(a, p, d){
  try{ localStorage.setItem(cacheKey(a, p), JSON.stringify({ t: Date.now(), d: d })); }
  catch(e){ /* المساحة اتملت — مش مشكلة */ }
}

/* بيرجّع المحفوظ فورًا (لو موجود) وبعدين الجديد */
function apiFresh(action, params, base){
  return api(action, params, base).then(function(d){ cacheSet(action, params, d); return d; });
}
/* ═══ الرسم الفوري ═══
   الصفحة بترسم المحفوظ من آخر مرة على طول، وبتحدّث ورا لما الرد ييجي.
   ده اللي بيخلي الفتح فوري بدل ما تقعد تبصّ على الدايرة بتاعة التحميل. */
function paint1(action, params, box, draw){
  var old = cacheGet(action, params);
  if (!old) return false;
  try{ draw(old, box); return true; }catch(e){ logErr(e); return false; }
}
/* نفس الفكرة بس للصفحات اللي بتنده نداءين مع بعض */
function paint2(key, a1, p1, a2, p2, box, draw){
  var old = cacheGet(key, p1);
  if (!old) return false;
  try{ draw(old.m, old.k, box); return true; }catch(e){ logErr(e); return false; }
}
function apiCached(action, params, box, draw){
  var seed = paint1(action, params, box, draw);
  if (!seed) busy(box);
  return apiFresh(action, params).then(function(d){
    markSync(); draw(d, box); return d;
  }).catch(function(e){ logErr(e); if (!seed) oops(box, ''); });
}

/* ═══ التصدير: Excel و PDF ═══
   نفس اللبنة في كل الصفحات — بتاخد صفوف جاهزة وبتطلّع ملف. */
function toExcel(rows, name){
  if (!rows || !rows.length) { toast(tr('noExport')); return; }
  try{
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, name + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
  }catch(e){ logErr(e); toast(tr('failed')); }
}
function toPDF(rows, title){
  if (!rows || !rows.length) { toast(tr('noExport')); return; }
  var cols = Object.keys(rows[0]);
  var w = window.open('', '_blank');
  if (!w) { toast(tr('failed')); return; }
  var head = cols.map(function(c){ return '<th>' + c + '</th>'; }).join('');
  var body = rows.map(function(r){
    return '<tr>' + cols.map(function(c){
      var v = r[c] == null ? '' : String(r[c]);
      var isNum = /^[\d.,\-%\s]+$/.test(v);

  w.document.close();

function pgHome(){
  var box = document.getElementById('p-home');
  var seed = cacheGet('home', {});
  if (seed) drawHome(seed.b, seed.kpi, true); else busy(box);

  Promise.all([ api('getHomeBundle'), api('getStaffKPI', { range: 'today' }) ])
  .then(function(res){
    cacheSet('home', {}, { b: res[0], kpi: res[1] });
    drawHome(res[0], res[1], false);
  }).catch(function(e){
    logErr(e);
    if (!seed) oops(box, "pgHome()");
  });
}

function drawHome(b, kpi, isOld){
  var box = document.getElementById('p-home');
  try{
    kpi = kpi || {};
    if (!b || !b.ok) throw new Error('bundle');
    if (!isOld) markSync();

    var d = b.daily || {}, at = b.attendance || {}, dt = b.debts || {},
        ex = b.expiry || {}, ag = b.agents || {};

    var salesT = d.sales_today || 0, salesY = d.sales_yesterday || 0;
    /* قبل ٦ المسا المقارنة بأمس مضلّلة (اليوم لسه مكملش)، فنعرض التقدّم بدل الفرق */
    var lateDay = new Date().getHours() >= 18;
    var delta = salesY > 0 ? Math.round((salesT - salesY) / salesY * 100) : 0;
    var progress = salesY > 0 ? Math.round(salesT / salesY * 100) : 0;
    var salesNote = lateDay
      ? { tone: delta >= 0 ? 'ok' : 'bad',
          num: (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '%', word: tr('vsYesterday') }
      : { tone: 'brand', num: progress + '%', word: tr('ofYesterday') };

    /* ── ١) المؤشرات ── */
    var html = '';
    markSync();
    if (isOld) toast(tr('cached') + ' · ' + tr('refreshing'));



    /* حساب أرقام اليوم — محتاجينها للتنبيهات كمان */
    var emps = kpi.employees || [];
    var tot = { inv:0, reg:0, nreg:0, newc:0, rep:0, disc:0, ret:0 };
    emps.forEach(function(e){
      tot.inv += e.invoices; tot.reg += e.registered; tot.nreg += e.not_reg;
      tot.newc += e.new_c;   tot.rep += e.repeat_c;   tot.disc += e.discount;
      tot.ret += e.returns;
    });
    var totCust = tot.reg + tot.nreg;
    var avgInv  = tot.inv ? Math.round(salesT / tot.inv) : 0;
    var regPct  = pct(tot.reg, totCust);

    /* ── ١) المؤشرات ──
       نظام البيع بيصفّر عداد اليوم عند فتح الصيدلية، مش نص الليل.
       فلو آخر تحديث ليه من يوم فات، الأرقام دي بتاعت أمس مش النهاردة. */
    /* نظام البيع بيصفّر عداده عند فتح الصيدلية مش نص الليل.
       الفواتير بتيجي من ملف اليوم (بيتصفّر فعلاً)، فلو الفواتير صفر
       والمبيعات مش صفر → الرقم ده بتاع يوم فات. */
    var upd = String(d.updated_at || '');
    var updDay = (upd.match(/\d{4}-\d{2}-\d{2}/) || [''])[0];
    var todayStr = new Date().toLocaleDateString('en-CA');
    var isStaleDay = (updDay && updDay < todayStr) || (tot.inv === 0 && salesT > 0);

    html += vitals(isStaleDay ? tr('yesterdayNums') : tr('today'),
      new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}), [
      { value: num(salesT), label: tr('salesToday'),
        tone: isStaleDay ? 'slate' : salesNote.tone,
        note: isStaleDay ? null : salesNote.num, sub: isStaleDay ? null : salesNote.word },
      { value: num(d.profit_today), label: tr('profitToday'),
        tone: isStaleDay ? 'slate' : 'brand',
        note: pct(d.profit_today, salesT) + '%', sub: tr('margin') },
      { value: num(tot.inv), label: tr('invoices'), tone: 'brand',
        note: num(totCust), sub: tr('customersToday') }
    ], (isStaleDay
        ? '<div class="state" style="padding:10px 0 0;font-size:11px;color:var(--warn)">' +
            tr('notResetYet') + '</div>'
        : '') +
       stamp(tr('srcSales'), upd.slice(-8) || null, tr('live')));

    /* ── ٢) محتاج تصرّف — فوق، مش تحت ── */
    var acts = [];
    var overdue = (dt.debtors || []).filter(function(c){
      return (new Date() - new Date(c.lastActivity)) / 86400000 > 30 && c.net > 0;
    });
    if (overdue.length) acts.push(alertBox('bad', esc(tr('overdueDebt')),
      ltr(overdue.length) + ' · ' + ltr(num(overdue.reduce(function(a,c){return a+c.net;},0))) + ' ' + tr('egp'),
      "go('money',2)"));

    if (ex.expired && ex.expired.count) acts.push(alertBox('bad', esc(tr('expiredNow')),
      ltr(ex.expired.count) + ' ' + tr('items'), "go('stock',0)"));

    var months = ex.months || [], soon = months.length ? months[0] : null;
    if (soon && soon.count) acts.push(alertBox('warn', esc(tr('expiringSoon')),
      ltr(soon.count) + ' ' + tr('items') + ' · ' + ltr(num(soon.totalCost)) + ' ' + tr('egp'),
      "go('stock',0)"));

    /* أضعف موظف في التسجيل — تنبيه بدل جدول كامل */
    var weak = emps.filter(function(e){ return e.invoices >= 3; })
                   .sort(function(a,b){ return a.reg_pct - b.reg_pct; })[0];
    if (weak && weak.reg_pct < 50) acts.push(alertBox('warn',
      esc(weak.name) + ' — ' + tr('regRate') + ' ' + weak.reg_pct + '%',
      tr('target') + ' ' + ltr('75%') + ' · ' + ltr(weak.invoices) + ' ' + tr('invoices'),
      "go('hr',1)"));

    var dueAgents = (ag.agents || []).filter(function(a){ return a.balance > 0; });
    if (dueAgents.length) acts.push(alertBox('warn', esc(tr('agentsDue')),
      ltr(dueAgents.length) + ' · ' + ltr(num(dueAgents.reduce(function(s,a){return s+a.balance;},0))),
      "go('cust',2)"));

    var snapAt = String((dt.snapshot_at || ex.snapshot_at || '')).slice(-8);
    html += card(tr('needsAction'), null,
      acts.length ? acts.join('') : '<div class="state">' + tr('allGood') + '</div>',
      null, stamp(tr('srcSnap'), snapAt || null, tr('hourly')));

    /* ── ٣) اللي اتغيّر (بيتحمّل بعدين) ── */
    html += '<div id="trends"></div>';

    /* ── ٤) أرقام اليوم — من غير تكرار، والأهداف بشريط ── */
    html += card(tr('todayNumbers'), null, tot.inv ? (
      row(tr('avgTicket'), tr('target') + ' ' + ltr(goalOf('avg_invoice', 150)),
          goal(avgInv, goalOf('avg_invoice', 150))) +
      row(tr('regRate'), tr('target') + ' ' + ltr(goalOf('registration', 75) + '%'),
          goal(regPct + '%', goalOf('registration', 75) + '%', regPct >= goalOf('registration', 75))) +
      rowLite(tr('customersToday'),
        ltr(tot.reg) + ' ' + tr('registered') + ' · ' + ltr(tot.nreg) + ' ' + tr('notReg'),
        ltr(num(totCust))) +
      rowLite(tr('newCust'), ltr(tot.rep) + ' ' + tr('repeat'), ltr(num(tot.newc))) +
      rowLite(tr('debtToday'), tr('collected') + ' ' + ltr(num(d.debt_paid_today)),
        ltr(num(d.debt_today))) +
      (tot.disc ? rowLite(tr('discount'), null, ltr(num(tot.disc))) : '') +
      (tot.ret ? rowLite(tr('returns'), null, ltr(num(tot.ret))) : '')
    ) : '<div class="state">' + tr('noSalesYet') + '</div>',
      null, stamp(tr('srcInv'), null, tr('minutely')));

    /* ── ٥) موجودين دلوقتي — الكارت يظهر بس لو فيه حد ── */
    var live = at.live || [];
    if (live.length) html += card(tr('onShiftNow'), null,
      live.map(function(p){ return row(p.name, null, badge(ltr(dur(p.elapsedMinutes)), 'ok')); }).join(''));

    box.innerHTML = html;
    if (!isOld) loadTrends();
  }catch(e){ logErr(e); if (!isOld) oops(box, "pgHome()"); }
}

/* بيقارن آخر ٧ أيام باللي قبلهم ويقول إيه اللي اتحرّك.
   بيتنادى بعد ما الشاشة تظهر، فمش بيأخّر التحميل. */
function loadTrends(){
  api('getStaffKPI', { range: 'month' }).then(function(k){
    var box = document.getElementById('trends'); if (!box) return;
    var d = (k.daily || []).slice();
    if (d.length < 6){ box.innerHTML = ''; return; }

    var recent = d.slice(-7), prior = d.slice(-14, -7);
    if (!prior.length) prior = d.slice(0, Math.max(1, d.length - 7));

    function avg(arr, f){ return arr.length ? arr.reduce(function(s,x){ return s + (f(x) || 0); }, 0) / arr.length : 0; }
    function pctChange(a, b){ return b > 0 ? Math.round((a - b) / b * 100) : 0; }

    var items = [];

    var sNow = avg(recent, function(x){ return x.sales; }),
        sOld = avg(prior,  function(x){ return x.sales; }),
        sCh  = pctChange(sNow, sOld);
    if (Math.abs(sCh) >= 5) items.push({
      tone: sCh > 0 ? 'ok' : 'bad', ic: sCh > 0 ? '↑' : '↓',
      title: tr('salesPerf') + ' ' + (sCh > 0 ? tr('trendUp') : tr('trendDown')) + ' ' + ltr(Math.abs(sCh) + '%'),
      sub: tr('avgDaily') + ' ' + ltr(num(sNow)) + ' ' + tr('egp') +
           ' <span style="color:var(--ink-3)">(' + ltr(num(sOld)) + ')</span>'
    });

    var rNow = pct(recent.reduce(function(s,x){ return s + x.registered; }, 0),
                   recent.reduce(function(s,x){ return s + x.total_cust; }, 0)),
        rOld = pct(prior.reduce(function(s,x){ return s + x.registered; }, 0),
                   prior.reduce(function(s,x){ return s + x.total_cust; }, 0));
    if (Math.abs(rNow - rOld) >= 4) items.push({
      tone: rNow > rOld ? 'ok' : 'bad', ic: rNow > rOld ? '↑' : '↓',
      title: tr('regRate') + ' ' + (rNow > rOld ? tr('trendUp') : tr('trendDown')),
      sub: ltr(rOld + '%') + ' <span style="color:var(--ink-3)">→</span> ' + ltr(rNow + '%') +
           ' · ' + tr('regRate') + ' ' + ltr('75%'),
      jump: "go('hr',1)"
    });

    var nNow = avg(recent, function(x){ return x.new_c; }),
        nOld = avg(prior,  function(x){ return x.new_c; }),
        nCh  = pctChange(nNow, nOld);
    if (Math.abs(nCh) >= 15) items.push({
      tone: nCh > 0 ? 'ok' : 'warn', ic: nCh > 0 ? '↑' : '↓',
      title: tr('newCust') + ' ' + (nCh > 0 ? tr('trendUp') : tr('trendDown')) + ' ' + ltr(Math.abs(nCh) + '%'),
      sub: tr('avgDaily') + ' ' + ltr(nNow.toFixed(1)) +
           ' <span style="color:var(--ink-3)">(' + ltr(nOld.toFixed(1)) + ')</span>',
      jump: "go('cust',1)"
    });

    box.innerHTML = card(tr('whatChanged'), tr('last7vs'), items.length
      ? items.map(function(i){
          return '<div class="row"' + (i.jump ? ' style="cursor:pointer" onclick="' + i.jump + '"' : '') + '>' +
            '<div style="display:flex;gap:12px;align-items:flex-start;min-width:0">' +
            '<span style="width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;' +
            'background:color-mix(in srgb,var(--' + i.tone + ') 15%,transparent);color:var(--' + i.tone + ');' +
            'font-size:15px;font-weight:800">' + i.ic + '</span>' +
            '<div class="row-main"><b style="white-space:normal">' + i.title + '</b><small>' + i.sub + '</small></div>' +
            '</div></div>';
        }).join('')
      : '<div class="state">' + tr('trendFlat') + '</div>');
  }).catch(function(e){ logErr(e); });
}

function setSalesRange(v){ setRange('sales', v, pgSales); }
function pgSales(){
  var box = document.getElementById('p-sales');
  var p = rangeParams('sales');

  /* الفترة اللي المستخدم اختارها بتتبعت زي ما هي للنداءين.
     قبل كده كانت بتتحوّل لـ"الشهر" دايمًا، فالعنوان يقول "اليوم"
     والأرقام تحته بتاعة الشهر كله. */
  var seed = paint2('sales', 'getMonthTotalsRaw', p, 'getStaffKPI', p, box, drawSales);
  if (!seed) busy(box);

  Promise.all([ apiFresh('getMonthTotalsRaw', p), apiFresh('getStaffKPI', p) ])
  .then(function(r){
    if (!r[0] || !r[0].ok) throw new Error('sales');
    cacheSet('sales', p, { m: r[0], k: r[1] });
    markSync();
    drawSales(r[0], r[1], box);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgSales()"); });
}
function drawSales(m, k, box){
  m = m || {}; k = k || {};
  var avg = m.invoices_total ? Math.round(m.sales_total / m.invoices_total) : 0;
  var tAvg = goalOf('avg_invoice', 150);

  /* العنوان والأرقام بقوا من نفس الفترة — مفيش تناقض تاني */
  var label = m.label || k.label || '';

  var html = ctlBar(
    RANGE_OPTS.slice(0, 4).map(function(o){
      return ctlBtn(tr(o[1]), RANGE.sales === o[0], "setSalesRange('" + o[0] + "')");
    }).join(''),
    'salesMenu()',
    RANGE.sales === 'custom' || RANGE.sales === 'lastMonth') +
    vitals(tr('salesPerf'), label, [
    { value: num(m.sales_total), label: tr('netSales'), tone: 'ok' },
    { value: num(avg), label: tr('avgTicket'), tone: avg >= tAvg ? 'ok' : 'warn', note: ltr(tAvg) },
    { value: num(m.invoices_total), label: tr('invoices'), tone: 'brand' }
  ]);

  html += card(tr('salesPerf'), label,
    row(tr('profit'), null, ltr(num(m.profit_total))) +
    row(tr('discount'), null, ltr(num(m.discount_total))) +
    row(tr('returns'), ltr(num(m.returns_value_total)) + ' ' + tr('egp'), ltr(num(m.returns_total))));

  var daily = (k.daily || []).slice(-14).reverse();
  html += card(tr('byDay'), null, daily.length ? daily.map(function(d){
    return row(d.date, ltr(d.new_c) + ' ' + tr('newCust'), ltr(num(d.sales)));

/* ─────── مالية: الديون ─────── */
var DEBT = { data: null, sort: 'amount', open: {} };

function setDebtSort(v){ DEBT.sort = v; drawDebts(); }
function toggleBucket(k){ DEBT.open[k] = !DEBT.open[k]; drawDebts(); }

function pgDebts(){
  var box = document.getElementById('p-money');

/* النطاقات حسب مدة السكوت — من الأحدث للأقدم */
var DEBT_BUCKETS = [
  { key:'fresh', max:30,   label:'bucketFresh', tone:'ok'    },
  { key:'b1_3',  max:90,   label:'bucket1_3',   tone:'warn'  },
  { key:'b3_6',  max:180,  label:'bucket3_6',   tone:'bad'   },
  { key:'b6',    max:1e9,  label:'bucket6',     tone:'bad'   },
  /* مفيش تاريخ سداد أصلاً — رمادي، لأن دي معلومة ناقصة مش حكم على العميل */
  { key:'none',  max:null, label:'bucketNone',  tone:'slate' }
];

function drawDebts(isOld){
  var box = document.getElementById('p-money'), d = DEBT.data;
  if (!d) return;
  var now = new Date();
  var list = (d.debtors || []).map(function(c){
    c._days = (c.daysSincePaid === null || c.daysSincePaid === undefined) ? null : c.daysSincePaid;
    return c;
  });

  /* التوزيع حسب آخر سداد — اللي مفيش ليه تاريخ يروح لنطاق رمادي منفصل */
  var groups = {};
  DEBT_BUCKETS.forEach(function(b){ groups[b.key] = []; });
  list.forEach(function(c){
    if (c._days === null){ groups.none.push(c); return; }
    for (var i = 0; i < DEBT_BUCKETS.length; i++){
      var b = DEBT_BUCKETS[i];
      if (b.max !== null && c._days <= b.max){ groups[b.key].push(c); break; }
    }
  });

  var stale = list.filter(function(c){ return c._days === null || c._days > 30; });

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  /* المؤشرات لازم تكون متسقة: مجموع النطاقات = الإجمالي بالظبط */
  var totalAll   = list.reduce(function(a,c){ return a + c.net; }, 0);
  var staleTotal = stale.reduce(function(a,c){ return a + c.net; }, 0);
  var freshTotal = totalAll - staleTotal;

  html += vitals(tr('debts'), null, [
    { value: num(totalAll), label: tr('totalDebt'), tone: 'bad',
      note: num(list.length), sub: tr('debtors') },
    { value: num(staleTotal), label: tr('overdueDebt'), tone: 'warn',
      note: pct(staleTotal, totalAll) + '%', sub: tr('ofTotal') },
    { value: num(freshTotal), label: tr('bucketFresh'), tone: 'ok',
      note: num(list.length - stale.length), sub: tr('customers') }
  ]);

  /* سطر تحكّم واحد */
  html += ctlBar(
    ctlBtn(tr('byAmount'), DEBT.sort === 'amount', "setDebtSort('amount')") +
    ctlBtn(tr('byAge'), DEBT.sort === 'age', "setDebtSort('age')"),
    'debtMenu()', false);

  html += DEBT_BUCKETS.map(function(b){
    var g = groups[b.key];
    if (!g.length) return '';
    var total = g.reduce(function(a,c){ return a + c.net; }, 0);
    var open = !!DEBT.open[b.key];

    g.sort(DEBT.sort === 'age'
      ? function(x,y){ return y._days - x._days; }
      : function(x,y){ return y.net - x.net; });

    var body = open ? g.slice(0, 80).map(function(c){
      var sub = (c._days === null)
        ? tr('noPayRec')
        : tr('lastPaid') + ' ' + ltr(c.lastPaid) + ' · ' + ltr(c._days) + ' ' + tr('daysAgo');
      if (c.seller && c.seller !== 'غير محدد') sub += ' · ' + tr('soldBy') + ' ' + esc(c.seller);
      return '<div class="row"><div class="row-main"><b>' + esc(c.name) + '</b>' +
        '<small>' + sub + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
        '<span class="row-val" style="color:var(--' + b.tone + ')">' + ltr(num(c.net)) + '</span>' +
        '<button class="badge" style="--tone:var(--brand);border:0;cursor:pointer" ' +
        'onclick="event.stopPropagation();remind(this,\'' + c.phone + '\',\'' +
          esc(c.name).replace(/'/g,"") + '\',' + Math.round(c.net) + ')">' +
        tr('sendReminder') + '</button></div></div>';
    }).join('') : '';

    return '<div class="card" style="padding:0;overflow:hidden;border-inline-start:3px solid var(--' + b.tone + ')">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;' +
        'padding:14px 16px;cursor:pointer" onclick="toggleBucket(\'' + b.key + '\')">' +
        '<div><b style="font-size:var(--t-title);font-weight:650">' + tr(b.label) + '</b>' +
        '<small style="display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px">' +
          ltr(g.length) + ' ' + tr('debtors') + '</small></div>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:16px;font-weight:700;color:var(--' + b.tone + ');' +
            'direction:ltr;unicode-bidi:isolate">' + LRI + num(total) + PDI + '</span>' +
          '<span style="color:var(--ink-3);font-size:15px">' + (open ? '⌄' : '›') + '</span>' +
        '</div></div>' +
      (open ? '<div style="padding:0 16px 14px">' + body + '</div>' : '') + '</div>';
  }).join('');

  html += '<div class="state" style="padding:4px 0 12px;font-size:11px">' + tr('noteLastMove') + '</div>';
  /* البايع الحقيقي — جاي مع نفس النداء، مفيش طلب زيادة */
  if ((d.by_seller || []).length) html += card(tr('byEmployee'), null,
    d.by_seller.map(function(e){
      return row(e.employee, null, ltr(num(e.total)));
    }).join(''));

  html += '<div class="state" style="padding:2px 0 12px;font-size:11px">' + tr('checkFirst') + '</div>';
  box.innerHTML = html;
}

function remind(btn, phone, name, amount){
  btn.disabled = true; btn.textContent = '…';
  api('sendDebtReminder', { phone: phone, name: name, amount: amount })
    .then(function(r){ btn.textContent = r && r.ok ? tr('reminderSent') : tr('msgFailed'); })
    .catch(function(e){ logErr(e); btn.textContent = tr('msgFailed'); });
}

/* ─────── موظفين: الحضور + الأداء في مكان واحد ─────── */
var HR = { live: null, hist: null, kpi: null };

function setHrRange(v){ setRange('perf', v, pgStaffHub); }

function pgStaffHub(){
  var box = document.getElementById('p-hr');
  var p = rangeParams('perf');
  var seed = cacheGet('hub', p);
  if (seed) { setHub(seed); drawStaffHub(true); } else busy(box);

  /* نداء واحد بيجيب الأداء والحضور مع بعض — بدل تلاتة */
  api('getStaffHub', p).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error);
    cacheSet('hub', p, d);
    setHub(d); markSync(); drawStaffHub(false);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgStaffHub()"); });
}
function setHub(d){
  setTargets(d.targets);            /* الأهداف من السيرفر بدل أرقام بالإيد */
  HR.kpi  = { employees: d.employees, daily: d.daily, label: d.label };
  HR.hist = { rows: d.rows, label: d.label };
  HR.live = { ok: !d.attendanceError, live: d.live, error: d.attendanceError };
}

/* بيلزق الحضور بالأداء — الاسم في Connecteam ممكن يختلف عن اسم نظام البيع،
   فبنطابق بأول كلمة مشتركة */
function matchShifts(name){
  var rows = (HR.hist.rows || []);
  var key = String(name || '').replace(/^(دكتور|دكتورة|استاذ|د\.|أستاذ)\s*/, '').trim().split(/\s+/)[0];
  if (!key) return [];
  return rows.filter(function(x){
    return String(x.name || '').toLowerCase().indexOf(key.toLowerCase()) !== -1 ||
           key.toLowerCase().indexOf(String(x.name || '').split(/\s+/)[0].toLowerCase()) !== -1;
  });
}
function liveFor(name){
  var key = String(name || '').replace(/^(دكتور|دكتورة|استاذ|د\.|أستاذ)\s*/, '').trim().split(/\s+/)[0];
  return (HR.live.live || []).filter(function(p){
    return String(p.name || '').toLowerCase().indexOf(key.toLowerCase()) !== -1 ||
           key.toLowerCase().indexOf(String(p.name || '').split(/\s+/)[0].toLowerCase()) !== -1;
  })[0];
}

function drawStaffHub(isOld){
  var box = document.getElementById('p-hr');
  var list = (HR.kpi.employees || []);
  var live = HR.live.live || [];

  var totReg  = list.reduce(function(a,x){ return a + x.registered; }, 0);
  var totCust = list.reduce(function(a,x){ return a + x.total_cust; }, 0);
  var totNew  = list.reduce(function(a,x){ return a + x.new_c; }, 0);

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');
  html += ctlBar(
    RANGE_OPTS.slice(0, 4).map(function(o){
      return ctlBtn(tr(o[1]), RANGE.perf === o[0], "setHrRange('" + o[0] + "')");
    }).join(''),
    'hrMenu()',
    RANGE.perf === 'custom' || RANGE.perf === 'lastMonth');

  html += vitals(tr('staffToday'), HR.kpi.label || '', [
    { value: num(live.length), label: tr('onShiftNow'), tone: live.length ? 'ok' : 'warn',
      note: num(list.length), sub: tr('staffToday') },
    { value: pct(totReg, totCust) + '%', label: tr('regRate'),
      tone: pct(totReg, totCust) >= goalOf('registration', 75) ? 'ok' : 'warn',
      note: goalOf('registration', 75) + '%', sub: tr('target') },
    { value: num(totNew), label: tr('newCust'), tone: 'brand' }
  ]);

  /* صف لكل موظف */
  /* مرتّبين بالمبيعات — الأعلى فوق */
  var sorted = list.slice().sort(function(a,b){ return b.sales - a.sales; });
  html += sorted.length ? '<div class="staff-grid">' + sorted.map(function(e){
    var i = list.indexOf(e);
    var tone = e.care_score >= 70 ? 'ok' : e.care_score >= 50 ? 'warn' : 'bad';
    var lv = liveFor(e.name);
    return '<div class="staff" style="--tone:var(--' + tone + ')" onclick="staffSheet(' + i + ')">' +
      '<div class="staff-body">' +
        '<div class="staff-top">' + (lv ? '<span class="staff-dot"></span>' : '') +
          '<b>' + esc(e.name) + '</b>' +
          (lv ? '<span class="staff-shift">' + LRI + dur(lv.elapsedMinutes) + PDI + '</span>' : '') +
        '</div>' +
        '<div class="staff-meta">' +
          '<span>' + ltr(e.invoices) + ' ' + tr('invoices') + '</span>' +
          '<span>' + ltr(num(e.avg_inv)) + ' ' + tr('avgTicket') + '</span>' +
          '<span>' + ltr(e.reg_pct + '%') + ' ' + tr('pReg') + '</span>' +
          '<span>' + ltr(e.new_c) + ' ' + tr('pNew') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="staff-right">' +
        '<span class="staff-sales">' + LRI + num(e.sales) + PDI +
          '<u>' + esc(tr('sales')) + '</u></span>' +
        '<span class="staff-score" style="--tone:var(--' + tone + ')">' +
          LRI + e.care_score + PDI + '</span>' +
      '</div></div>';
  }).join('') + '</div>' : '<div class="card">' + emptyState() + '</div>';

  /* موجودين دلوقتي — بس لو فيه حد مش متطابق مع القائمة فوق */
  if (HR.live.ok === false) html += card(tr('onShiftNow'), null,
    '<div class="state err">' + esc(HR.live.error) + '</div>');

  box.innerHTML = html;
}

/* نافذة تفاصيل الموظف */
function staffSheet(i){
  var e = (HR.kpi.employees || [])[i]; if (!e) return;
  var t = document.getElementById('sheet-title'), b = document.getElementById('sheet-body');
  document.getElementById('sheet').classList.add('on');
  t.textContent = e.name;

  var shifts = matchShifts(e.name);
  var mins = shifts.reduce(function(a,x){ return a + (x.durationMin || 0); }, 0);
  var lv = liveFor(e.name);

  function mini(label, val, tone){
    return '<div class="mini"><small>' + esc(label) + '</small>' +
      '<b style="color:var(--' + (tone || 'ink') + ')">' + LRI + val + PDI + '</b></div>';
  }
  function part(label, val){
    return '<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;' +
      'font-size:var(--t-small)"><span style="color:var(--ink-2)">' + esc(label) + '</span>' +
      '<span dir="ltr" class="n" style="font-weight:650">' + val + '%</span></div>' +
      '<div class="bar" style="--tone:var(--' + (val >= 70 ? 'ok' : val >= 50 ? 'warn' : 'bad') +
      ')"><i style="width:' + Math.min(100, val) + '%"></i></div></div>';
  }

  b.innerHTML =
    (lv ? '<div class="alert" style="--tone:var(--ok);margin-bottom:12px"><span class="dot"></span>' +
      '<div><b>' + tr('onShiftNow') + '</b><small>' + ltr(dur(lv.elapsedMinutes)) + '</small></div></div>' : '') +

    '<div class="mini-grid">' +
      mini(tr('sales'), num(e.sales)) +
      mini(tr('profit'), num(e.profit), 'ok') +
      mini(tr('invoices'), num(e.invoices)) +
      mini(tr('avgTicket'), num(e.avg_inv), e.avg_inv >= 150 ? 'ok' : 'warn') +
    '</div>' +

    '<div class="group-title">' + tr('customers') + '</div>' +
    rowLite(tr('regRate'), tr('target') + ' 75%',
      '<span dir="ltr" class="n" style="color:var(--' + (e.reg_pct >= goalOf('registration', 75) ? 'ok' : 'warn') + ')">' +
      e.reg_pct + '%</span>') +
    rowLite(tr('newCust'), null, ltr(num(e.new_c))) +
    rowLite(tr('pRepeat'), null, ltr(num(e.repeat_c))) +
    rowLite(tr('notReg'), null, ltr(num(e.not_reg))) +
    rowLite(tr('discount'), ltr(e.disc_pct + '%'), ltr(num(e.discount))) +
    (e.returns ? rowLite(tr('returns'), ltr(e.return_pct + '%'), ltr(num(e.returns))) : '') +

    '<div class="group-title">' + tr('scoreParts') + '</div>' +
    part(tr('pNew'), e.care_new) + part(tr('pReg'), e.care_reg) +
    part(tr('pRepeat'), e.care_repeat) + part(tr('pReturn'), e.care_return) +

    '<div class="group-title">' + tr('shifts') + '</div>' +
    (shifts.length
      ? rowLite(tr('totalHours'), ltr(shifts.length) + ' ' + tr('shiftsCount'),
          ltr(Math.round(mins / 60) + 'h')) +
        shifts.slice().reverse().slice(0, 14).map(function(x){
          return rowLite(x.date,
            ltr(x.checkIn) + ' → ' + (x.checkOut === 'مفتوح' ? '—' : ltr(x.checkOut)),
            x.durationMin ? ltr(dur(x.durationMin)) : badge(tr('stillIn'), 'warn'));
        }).join('')
      : '<div class="state">' + tr('noShift') + '</div>');

/* ─────── مخزون: التحليل ─────── */
var INV = { data: null, cat: '', shelf: 'all' };

function setInvCat(c){ INV.cat = c; drawAging(); }
function setInvShelf(v){ INV.shelf = v; drawAging(); }

function pgAging(){
  var box = document.getElementById('p-stock');
  var seed = cacheGet('inv', {});
  if (seed) { INV.data = seed; drawAging(true); } else busy(box);

  api('getInventoryAging').then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error);
    cacheSet('inv', {}, d);
    INV.data = d; markSync(); drawAging(false);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgAging()"); });
}

function drawAging(isOld){
  var box = document.getElementById('p-stock'), d = INV.data;
  if (!d) return;

  var deadPct = pct(d.slow_dead_total_cost, d.total_cost_value);
  var expCost = (d.near_expiry_list || []).reduce(function(a, x){ return a + x.cost; }, 0);
  var expPct  = pct(expCost, d.total_cost_value);
  var score   = Math.max(0, Math.min(100, 100 - deadPct * 1.6 - expPct * 2));
  var hTone   = score >= 70 ? 'ok' : score >= 45 ? 'warn' : 'bad';
  var hLabel  = score >= 70 ? tr('healthGood') : score >= 45 ? tr('healthMid') : tr('healthBad');

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  html += vitals(tr('invAging'), d.snapshot_at || d.generated_date, [
    { value: num(d.total_cost_value), label: tr('stockValue'), tone: 'brand',
      note: num(d.total_retail_value), sub: tr('retailValue') },
    { value: num(d.slow_dead_total_cost), label: tr('deadStock'), tone: 'bad',
      note: deadPct + '%', sub: tr('turnover') },
    { value: Math.round(score), label: tr('health'), tone: hTone, note: null, sub: hLabel }
  ]);

  /* سطر تحكّم واحد */
  html += ctlBar(
    ctlBtn(tr('invAging'), true, "void 0"),
    'invMenu()',
    (INV.cat || INV.shelf !== 'all')
  );

  /* ── كارت: الصلاحية شهر بشهر — كل شهر سطر يفتح نافذة ── */
  var months  = (d.expiry_by_month && d.expiry_by_month.months) || [];
  var expired = d.expiry_by_month && d.expiry_by_month.expired;
  html += card(tr('expByMonth'), null,
    ((expired && expired.count)
      ? '<div class="row" style="cursor:pointer" onclick="expSheet(\'expired\')">' +
          '<div class="row-main"><b style="color:var(--bad)">' + tr('expiredNow') + '</b>' +
          '<small>' + ltr(expired.count) + ' ' + tr('items') + '</small></div>' +
          '<span class="row-val" style="color:var(--bad)">' + ltr(num(expired.totalCost)) + '</span></div>'
      : '') +
    months.filter(function(m){ return m.count; }).map(function(m, i){
      return '<div class="row" style="cursor:pointer" onclick="expSheet(' + i + ')">' +
        '<div class="row-main"><b>' + esc(m.label) + '</b>' +
        '<small>' + ltr(m.count) + ' ' + tr('items') + '</small></div>' +
        '<span class="row-val">' + ltr(num(m.totalCost)) + '</span></div>';
    }).join('') || emptyState());

  /* ── كارت: الركود حسب آخر بيع — كل شريحة تفتح نافذة ── */
  var AG = [['never','never'],['b0_30','d0_30'],['b31_60','d31_60'],['b61_90','d61_90'],
            ['b91_180','d91_180'],['b181_365','d181_365'],['b365plus','d365']];
  html += card(tr('agingTitle'), null, AG.map(function(x){
    var g = (d.aging || {})[x[0]]; if (!g || !g.skus) return '';
    var tone = (x[0] === 'never' || x[0] === 'b365plus' || x[0] === 'b181_365') ? 'bad'
             : (x[0] === 'b91_180') ? 'warn' : 'ok';

  /* ── كارت: الأرصدة السالبة — أول حاجة لأنها خطأ محتاج تصحيح ── */
  var neg = d.negative_list || [];

          '<small>' + esc(it.category) + '</small></div>' +

      }).join('') +
      (neg.length > 8

        : ''),
      badge(ltr(neg.length) + ' ' + tr('items'), 'bad'));
  }

  /* ── كارت: الراكد حسب الفئة — كل فئة تفتح نافذة ── */
  var cats = d.slow_category_summary || [];
  html += card(tr('deadStock'),
    ltr(d.slow_dead_count) + ' ' + tr('items') + ' · ' + ltr(num(d.slow_dead_total_cost)),
    cats.length ? cats.slice(0, 12).map(function(c){

        '<span class="row-val" style="color:var(--bad)">' + ltr(num(c.cost)) + '</span></div>';
    }).join('') : emptyState());

  box.innerHTML = html;
}

function agingSheet(key, labelKey){

  openMenu(tr(labelKey), sheetItems(items, function(it){

/* نافذة: أصناف راكدة لفئة */
function catSheet(cat){
  var d = INV.data; if (!d) return;
  var items = (d.slow_dead_list || []).filter(function(it){
    if (it.category !== cat) return false;
    var e = it.days_to_expire;
    if (INV.shelf === 'u3')   return e !== null && e < 90;
    if (INV.shelf === '3_6')  return e !== null && e >= 90 && e < 180;
    if (INV.shelf === 'o6')   return e !== null && e >= 180;
    if (INV.shelf === 'none') return e === null;
    return true;
  });
  openMenu(cat, sheetItems(items, function(it){
    return ltr(it.stock) + ' ' + tr('qty') +
      (it.days !== null ? ' · ' + tr('daysIdle') + ' ' + ltr(it.days) + ' ' + tr('daysAgo') : '') +
      (it.expire ? ' · ' + tr('expiresOn') + ' ' + ltr(it.expire) : '');

/* ─────── مخزون: النواقص ─────── */
var SHORT_DATA = null, SHORT_SEC = 'zero', SHORT_OPEN = {};

function setShortDays(v){ RANGE.short = v; SHORT_DATA = null; pgShort(); }
function setShortSec(v){ SHORT_SEC = v; drawShort(); }
function toggleCat(id){ SHORT_OPEN[id] = !SHORT_OPEN[id]; drawShort(); }

function pgShort(){
  var box = document.getElementById('p-stock');
  var pr  = { days: RANGE.short };
  var seed = cacheGet('getShortages', pr);
  if (seed && !seed.error) { SHORT_DATA = seed; drawShort(); } else busy(box);
  api('getShortages', pr, SHORTAGE_URL).then(function(d){
    if (!d || d.error) throw new Error(d && d.msg);
    cacheSet('getShortages', pr, d);
    SHORT_DATA = d; markSync(); drawShort();
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgShort()"); });
}

function drawShort(){
  var box = document.getElementById('p-stock'), d = SHORT_DATA;
  if (!d) return;
  var zero = d.zero || { categories:{}, summary:{} }, low = d.low || { categories:{}, summary:{} };
  var sec = (SHORT_SEC === 'zero') ? zero : low;
  var sum = sec.summary || {};

  var html = ctlBar(
    ctlBtn(tr('outOfStock') + ' ' + ltr((zero.summary||{}).total || 0), SHORT_SEC === 'zero', "setShortSec('zero')") +
    ctlBtn(tr('lowStock') + ' ' + ltr((low.summary||{}).total || 0), SHORT_SEC === 'low', "setShortSec('low')"),
    'shortMenu()', RANGE.short !== '7');

  html += vitals(tr('shortages'), d.generatedAt || '', [
    { value: num((zero.summary||{}).total || 0), label: tr('outOfStock'), tone: 'bad' },
    { value: num((low.summary||{}).total || 0),  label: tr('lowStock'),   tone: 'warn' },
    { value: num(sum.totalAfter || 0), label: tr('afterDisc'), tone: 'brand' }
  ]);

  var cats = Object.keys(sec.categories || {}).sort();
  if (!cats.length){ box.innerHTML = html + '<div class="card">' + emptyState() + '</div>'; return; }

  html += cats.map(function(cat, ci){
    var comps = sec.categories[cat], names = Object.keys(comps).sort();
    var count = names.reduce(function(a,c){ return a + comps[c].length; }, 0);
    var id = SHORT_SEC + '-' + ci, open = !!SHORT_OPEN[id];

    var body = open ? names.map(function(comp){
      return '<div class="group-title">' + esc(comp) + '</div>' + comps[comp].map(function(it){
        var code = esc(it.code || '').replace(/'/g, '');
        var nm   = esc(it.name || '').replace(/'/g, '');
        return '<div class="row"><div class="row-main"><b style="white-space:normal">' + esc(it.name) + '</b>' +
          '<small>' + tr('needed') + ' ' + ltr(it.shortage) + '</small></div>' +
          '<div style="display:flex;gap:6px">' +
          '<button class="badge" style="--tone:var(--ok);border:0;cursor:pointer" ' +
            'onclick="shortAct(this,\'markOrdered\',\'' + code + '\',\'' + nm + '\')">' + tr('markOrdered') + '</button>' +
          '<button class="badge" style="--tone:var(--bad);border:0;cursor:pointer" ' +
            'onclick="shortAct(this,\'markDiscontinued\',\'' + code + '\',\'' + nm + '\')">' + tr('markDiscont') + '</button>' +
          '</div></div>';
      }).join('');
    }).join('') : '';

    return '<div class="card" style="padding:0;overflow:hidden">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;' +
        'padding:14px 16px;cursor:pointer" onclick="toggleCat(\'' + id + '\')">' +
        '<div><b style="font-size:var(--t-title);font-weight:650">' + esc(cat) + '</b>' +
        '<small style="display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px">' +
          ltr(count) + ' ' + tr('items') + ' · ' + ltr(names.length) + ' ' + tr('supplier') + '</small></div>' +
        '<span style="color:var(--ink-3);font-size:15px">' + (open ? '⌄' : '›') + '</span></div>' +
      (open ? '<div style="padding:0 16px 14px">' + body + '</div>' : '') + '</div>';
  }).join('');

  box.innerHTML = html;
}

function shortAct(btn, action, code, name){
  btn.disabled = true; btn.textContent = '…';
  fetch(SHORTAGE_URL, { method:'post', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action: action, code: code, name: name }) }).catch(logErr);
  if (action === 'markOrdered'){
    try{ navigator.clipboard.writeText(name); }catch(e){}
    toast(tr('copied'));
  }
  var r = btn.closest('.row'); if (r) r.style.opacity = '.35';
  btn.textContent = '✓';
}

/* ─────── عملاء: الرسايل ─────── */
var MSG = { data: null, type: 'all', failedOnly: false };

function setMsgType(v){ MSG.type = v; drawMessages(); }
function toggleFailed(){ MSG.failedOnly = !MSG.failedOnly; drawMessages(); }

function pgMessages(){
  var box = document.getElementById('p-cust');
  var seed = cacheGet('sms', {});
  if (seed) { MSG.data = seed; drawMessages(true); } else busy(box);

  api('getSMSLogFast', { days: 30 }).then(function(d){
    if (!d || !d.ok) throw new Error('sms');
    cacheSet('sms', {}, d);
    MSG.data = d; markSync(); drawMessages(false);
  }).catch(function(e){ logErr(e); if (!seed) oops(box, "pgMessages()"); });
}

function isFail(m){ return /فشل|❌|مبعتهاش/.test(String(m.status || '')); }

function drawMessages(isOld){
  var box = document.getElementById('p-cust'), d = MSG.data;
  if (!d) return;
  var all = d.messages || [];

  var counts = { all: all.length, invoice: 0, coupon: 0, debt: 0 };
  all.forEach(function(m){ if (counts[m.type] !== undefined) counts[m.type]++; });
  var bad = all.filter(isFail);

  var html = (isOld ? '<div class="state" style="padding:0 0 8px">' + tr('cached') + '</div>' : '');

  html += vitals(tr('messages'), ltr('30') + ' ' + (LANG === 'ar' ? 'يوم' : 'days'), [
    { value: num(all.length - bad.length), label: tr('sent'), tone: 'ok' },
    { value: num(bad.length), label: tr('msgFailed'), tone: bad.length ? 'bad' : 'ok' },
    { value: num(all.length), label: tr('messages'), tone: 'brand' }
  ]);

  /* سطر تحكّم واحد: النوع ظاهر · الباقي جوه ⋯ */
  var TYPES = [['all','typeAll'],['invoice','typeInvoice'],['coupon','typeCoupon'],['debt','typeDebt']];
  html += ctlBar(
    TYPES.map(function(t){
      return ctlBtn(tr(t[1]) + ' ' + ltr(counts[t[0]]), MSG.type === t[0], "setMsgType('" + t[0] + "')");
    }).join(''),
    'msgMenu()',
    MSG.failedOnly
  );

  var shown = all.filter(function(m){
    if (MSG.failedOnly && !isFail(m)) return false;
    return MSG.type === 'all' || m.type === MSG.type;
  });

  var TYPE_LBL = { invoice:'typeInvoice', coupon:'typeCoupon', debt:'typeDebt' };
  html += card(tr('messages'), null, shown.length
    ? shown.slice(0, 80).map(function(m){
        var f = isFail(m);
        var actions = (f && m.invoiceid)
          ? '<button class="badge" style="--tone:var(--brand);border:0;cursor:pointer" ' +
              'onclick="smsAction(this,\'retrySMS\',\'' + m.invoiceid + '\')">' + tr('resend') + '</button>' +
            '<button class="badge" style="--tone:var(--ink-2);border:0;cursor:pointer" ' +
              'onclick="smsAction(this,\'dismissSMS\',\'' + m.invoiceid + '\')">' + tr('ignore') + '</button>'
          : badge(f ? tr('msgFailed') : tr('sent'), f ? 'bad' : 'ok');
        return '<div class="row"><div class="row-main"><b>' + esc(m.customername || '—') + '</b>' +
          '<small>' + ltr(m.phone) + ' · ' + ltr(m.date) + ' · ' + tr(TYPE_LBL[m.type] || 'typeAll') +
          '</small></div><div style="display:flex;gap:6px">' + actions + '</div></div>';
      }).join('')
    : emptyState());

  box.innerHTML = html;
}

function smsAction(btn, action, id){
  btn.disabled = true; btn.textContent = '…';
  post({ action: action, invoiceid: id })
    .then(function(){ btn.textContent = '✓'; })
    .catch(function(e){ logErr(e); btn.textContent = '✗'; });
}


function msgMenu(){
  openMenu(tr('more'),

/* ── إرسال كوبونات: فردي أو جماعي ── */
var COUPON = { list: [], sel: {} };

function couponSheet(){
  var t = document.getElementById('sheet-title'), b = document.getElementById('sheet-body');
  document.getElementById('sheet').classList.add('on');
  t.textContent = tr('sendCoupon');
  var d30 = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
  b.innerHTML =
    '<div class="group-title">' + tr('couponText') + '</div>' +
    '<textarea id="cpMsg" rows="3" style="width:100%;padding:12px;border-radius:12px;' +
      'border:1px solid var(--line);background:var(--surface-2);color:var(--ink);' +
      'font-family:inherit;font-size:14px;resize:vertical">' + esc(tr('couponDefault')) + '</textarea>' +
    '<div class="group-title">' + tr('expiry') + '</div>' +
    '<input id="cpExp" type="date" value="' + d30 + '" style="width:100%;padding:11px;' +
      'border-radius:12px;border:1px solid var(--line);background:var(--surface-2);' +
      'color:var(--ink);font-family:inherit;font-size:14px">' +
    '<div id="cpList"><div class="state"><div class="spin"></div></div></div>';

  api('getCustomers').then(function(res){
    var list = Array.isArray(res) ? res : (res && res.list);
    if (!Array.isArray(list)) throw new Error('cust');
    /* اللي محتاجين متابعة الأول — دول هدف الكوبون */
    COUPON.list = list.filter(function(c){ return c.phone && !c.is_blocked; })
      .sort(function(a, b){ return (a.status === 'تنبيه' ? -1 : 0) - (b.status === 'تنبيه' ? -1 : 0); });
    COUPON.sel = {};
    drawCouponList();
  }).catch(function(e){
    logErr(e);
    var el = document.getElementById('cpList');
    if (el) el.innerHTML = '<div class="state err">' + tr('failed') + '</div>';
  });
}

function toggleCp(ph){ COUPON.sel[ph] = !COUPON.sel[ph]; drawCouponList(); }
function selAllCp(on){
  COUPON.sel = {};
  if (on) COUPON.list.slice(0, 60).forEach(function(c){ COUPON.sel[c.phone] = true; });
  drawCouponList();
}

function drawCouponList(){
  var el = document.getElementById('cpList'); if (!el) return;
  var n = Object.keys(COUPON.sel).filter(function(k){ return COUPON.sel[k]; }).length;
  el.innerHTML =
    '<div class="group-title" style="display:flex;justify-content:space-between;align-items:center">' +
      '<span>' + tr('customers') + ' · ' + ltr(n) + ' ' + tr('selected') + '</span>' +
      '<span><u style="cursor:pointer" onclick="selAllCp(true)">' + tr('selectAll') + '</u> · ' +
      '<u style="cursor:pointer" onclick="selAllCp(false)">' + tr('clearSel') + '</u></span></div>' +
    (n ? '<button class="btn btn-primary" onclick="sendCoupons()">' + tr('sendToSel') +
         ' (' + ltr(n) + ')</button>' : '') +
    '<div id="cpRows">' + COUPON.list.slice(0, 60).map(function(c){
      var on = !!COUPON.sel[c.phone];
      return '<div class="row" style="cursor:pointer" onclick="toggleCp(\'' + c.phone + '\')">' +
        '<div style="display:flex;gap:10px;align-items:center;min-width:0">' +
        '<span style="width:18px;height:18px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;' +
          'border:1.5px solid var(--' + (on ? 'brand' : 'line') + ');background:var(--' +
          (on ? 'brand' : 'surface-2') + ');color:#fff;font-size:11px">' + (on ? '✓' : '') + '</span>' +
        '<div class="row-main"><b>' + esc(c.name || '—') + '</b>' +
        '<small>' + ltr(c.phone) + (c.cls ? ' · ' + esc(c.cls) : '') + '</small></div></div>' +
        (c.status === 'تنبيه' ? badge(tr('needFollow'), 'warn') : '') + '</div>';
    }).join('') + '</div>';
}

function sendCoupons(){
  var msg = (document.getElementById('cpMsg').value || '').trim();
  var exp = document.getElementById('cpExp').value;
  var phones = COUPON.list.filter(function(c){ return COUPON.sel[c.phone]; });
  if (!msg || !phones.length) return;

  var el = document.getElementById('cpRows');
  var done = 0, ok = 0;
  function step(i){
    if (i >= phones.length){
      el.innerHTML = '<div class="state">' + tr('sentCount') + ' ' + ltr(ok) + ' / ' + ltr(phones.length) + '</div>';
      toast(tr('sentCount') + ' ' + ok);
      return;
    }
    var c = phones[i];
    el.innerHTML = '<div class="state"><div class="spin"></div>' + tr('sending') + ' ' +
      ltr(i + 1) + '/' + ltr(phones.length) + '</div>';
    api('sendCoupon', { phone: c.phone, name: c.name, message: msg, expiry: exp })
      .then(function(r){ if (r && r.ok) ok++; })
      .catch(logErr)
      .then(function(){ done++; step(i + 1); });
  }
  step(0);
}

/* ─────── عملاء: القائمة ─────── */
function pgCustomers(){
  var box = document.getElementById('p-cust');
  apiCached('getCustomers', {}, box, drawCustomers);
}
function drawCustomers(res, box){
  var list = Array.isArray(res) ? res : (res && res.list);
  if (!Array.isArray(list)) { oops(box, "pgCustomers()"); return; }
  {
    var alert_ = list.filter(function(c){ return c.status === 'تنبيه'; });
    var blocked = list.filter(function(c){ return c.is_blocked; });
    var html = vitals(tr('customers'), null, [
      { value: num(list.length), label: tr('customers'), tone: 'brand' },
      { value: num(alert_.length), label: tr('needFollow'), tone: alert_.length ? 'warn' : 'ok' },
      { value: num(blocked.length), label: LANG === 'ar' ? 'محظورين' : 'Blocked', tone: 'bad' }
    ]);
    var show = alert_.length ? alert_ : list;
    html += card(alert_.length ? tr('needFollow') : tr('customers'), null,
      show.slice(0, 60).map(function(c){
        return row(c.name || '—', ltr(c.phone) + (c.cls ? ' · ' + c.cls : ''),
          ltr(num(c.monthly_spend)));
      }).join('') || emptyState());
    box.innerHTML = html;
  }
}

/* ─────── عملاء: المندوبين ─────── */
function pgAgents(){
  var box = document.getElementById('p-cust');
  apiCached('getAgents', {}, box, drawAgents);
}
function drawAgents(d, box){
  if (!d || !d.ok) { oops(box, "pgAgents()"); return; }
  {
    var list = d.agents || [];
    var html = vitals(tr('agents'), null, [
      { value: num(list.length), label: tr('agents'), tone: 'brand' },
      { value: num(list.reduce(function(s,a){ return s + a.activated; }, 0)), label: tr('active'), tone: 'ok' },
      { value: num(list.reduce(function(s,a){ return s + a.balance; }, 0)), label: tr('due'), tone: 'warn' }
    ]);
    html += card(tr('agents'), null, list.length ? list.map(function(a){
      return row(a.agentName || a.agentPhone,
        ltr(a.activated) + ' ' + tr('active') + ' · ' + ltr(a.pending) + ' ' + tr('pending'),
        ltr(num(a.balance)));
    }).join('') : emptyState());
    box.innerHTML = html;
  }
}

/* ═══════════ الإعدادات ═══════════ */
function openSheet(kind){
  var s = document.getElementById('sheet'), t = document.getElementById('sheet-title'),
      b = document.getElementById('sheet-body');
  s.classList.add('on');
  if (kind === 'settings'){
    t.textContent = tr('settings');
    b.innerHTML =
      '<div id="snapbox" class="state"><div class="spin"></div></div>' +
      '<div class="btn-row"><button class="btn btn-quiet" onclick="snap(\'snapshotRefresh\')">' + tr('refreshNow') + '</button>' +
      '<button class="btn btn-primary" id="snapEnable" onclick="snap(\'snapshotEnable\')">' + tr('enableAuto') + '</button></div>' +
      '<button class="btn btn-quiet" onclick="runDiag()">' + tr('startCheck') + '</button>' +
      '<div id="diagbox"></div>' +
      '<div class="group-title">' + tr('errorLog') + '</div>' +
      (ERRORS.length ? ERRORS.slice().reverse().map(function(e){
        return row(e.m, ltr(e.t));
      }).join('') : '<div class="state">' + tr('noErrors') + '</div>');
    snapStatus();
  }
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

function snapStatus(){
  api('snapshotStatus').then(function(d){
    var box = document.getElementById('snapbox'); if (!box) return;
    if (!d || !d.ok){ box.className = 'state err'; box.textContent = tr('failed'); return; }
    box.className = '';
    var btn = document.getElementById('snapEnable');
    if (btn && d.triggerOn){ btn.textContent = tr('running'); btn.disabled = true; btn.style.opacity = '.5'; }
    box.innerHTML = row(tr('autoUpdate'), d.lastRun ? ltr(d.lastRun) : '',
      badge(d.triggerOn ? tr('autoOn') : tr('autoOff'), d.triggerOn ? 'ok' : 'warn')) +
      (d.files || []).map(function(f){
        return row(f.name, null, f.ready ? ltr(f.builtAt) : badge('—', 'warn'));
      }).join('');
  }).catch(function(e){ logErr(e); });
}
function snap(action){
  var box = document.getElementById('snapbox');
  if (box){ box.className = 'state'; box.innerHTML = '<div class="spin"></div>' + tr('loading'); }
  api(action).then(function(){ snapStatus(); toast('✓'); }).catch(function(e){ logErr(e); snapStatus(); });
}
function runDiag(){
  var box = document.getElementById('diagbox');
  box.innerHTML = '<div class="state"><div class="spin"></div>' + tr('loading') + '</div>';
  api('diagnoseAll').then(function(d){
    if (!d || !d.checks){ box.innerHTML = '<div class="state err">' + tr('failed') + '</div>'; return; }
    box.innerHTML = '<div class="group-title">' + tr('diagnose') + '</div>' + d.checks.map(function(c){
      return '<div class="row"><div class="row-main"><b>' +
        '<span style="display:inline-block;width:7px;height:7px;border-radius:99px;margin-inline-end:6px;background:var(--' +
        (c.ok ? 'ok' : 'bad') + ')"></span>' + esc(c.name) + '</b>' +
        '<small>' + esc(c.detail) + '</small></div></div>';
    }).join('');
  }).catch(function(e){ logErr(e); box.innerHTML = '<div class="state err">' + tr('failed') + '</div>'; });
}

/* ═══════════ ٥) التشغيل ═══════════ */
try{
  /* الدارك هو الافتراضي — الفاتح بيتفعّل بس لو اخترته بنفسك */
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content',
    document.body.classList.contains('light') ? '#F4F5F7' : '#0A0B0D');
}catch(e){}
try{ setLang(localStorage.getItem('lang') || 'ar'); }catch(e){ setLang('ar'); }
go('home');

</script>
