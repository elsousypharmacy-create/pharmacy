<style>@font-face{font-family:'Cairo';src:url(fonts/cairo.woff) format('woff');font-weight:400 800;font-style:normal;font-display:block}
/* Camera coverage is distinct from pages of findings. */
.cam-chips{flex-wrap:wrap}.cam-chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}.cam-chip.reviewed{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.camr-coverage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.camr-camera{padding:12px;border:1px solid var(--line);border-radius:var(--r2);border-inline-start:3px solid var(--ink-3);background:var(--surface-2)}.camr-camera b,.camr-camera small{display:block}.camr-camera small{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.7}.camr-camera.reviewed{border-inline-start-color:var(--brand)}.camr-camera.has-notes{border-inline-start-color:var(--warn)}.camr-camera .btn{margin-top:8px;min-height:44px;width:100%}
.camr-findings,.camr-method{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin:12px 0}.camr-findings summary,.camr-method summary{cursor:pointer;font-weight:800;min-height:32px}.camr-method p{font-size:13px;line-height:1.9;color:var(--ink-2);overflow-wrap:anywhere}.camr-finding{padding:12px;border-inline-start:3px solid var(--warn);background:var(--surface-2);border-radius:10px;margin-top:8px;line-height:1.8}.camr-finding.urgent{border-inline-start-color:var(--bad)}.camr-finding small{display:block;color:var(--ink-2);font-size:12px;margin-top:6px;overflow-wrap:anywhere}
.appearance-issue.status-new .appearance-state{color:var(--warn)}.appearance-issue.status-ongoing .appearance-state{color:var(--brand)}.appearance-issue.status-resolved .appearance-state{color:var(--ok)}.appearance-issue.status-unverified .appearance-state{color:var(--ink-2)}
@media(min-width:700px){.camr-coverage{grid-template-columns:repeat(5,minmax(0,1fr))}}


#settingsRoot [hidden],#settingsParking[hidden]{display:none!important}
.settings-link{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:14px;margin:8px 0;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r2);font:inherit;text-align:start;cursor:pointer}.settings-link i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--brand);font-style:normal;font-size:21px;flex-shrink:0}.settings-link span{flex:1;min-width:0}.settings-link b,.settings-link small{display:block}.settings-link small,.settings-sub{font-size:13px;color:var(--ink-2);line-height:1.8}.settings-link em{font-style:normal;color:var(--ink-3);font-size:24px}.settings-link:active{background:var(--surface)}.settings-link:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#settingsBar{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:-1px;z-index:2;background:var(--surface);padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}#settingsBar .btn{flex:1;min-height:44px;margin:0;padding:9px}#settingsDraft{width:100%;color:var(--warn);font-size:12px}.settings-panel h3{margin:8px 0;font-size:18px}.settings-panel{padding-bottom:12px}.settings-panel .group-title{margin-top:20px}#settingsRoot .set-status:empty{display:none}

</style>
<style>
/* ══════════════════════════════════════════════════════════
   نظام التصميم — المصدر الوحيد لكل شكل في التطبيق.
   تغيّر رقم هنا → يتغيّر في كل صفحة.
   ══════════════════════════════════════════════════════════ */
:root{
  /* الأسطح */
  --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F24; --line:#25292F;
  /* النص */
  --ink:#F2F4F7; --ink-2:#9BA3AF; --ink-3:#5F6670;
  /* المعاني — 3 بس */
  --brand:#1B92D4; --ok:#3DBE8B; --warn:#E8A33D; --bad:#E5646E;
  /* المسافات */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
  /* الحواف */
  --r1:8px; --r2:12px; --r3:18px;
  /* الخط */
  --t-micro:11px; --t-small:12px; --t-body:14px;
  --t-title:16px; --t-head:20px; --t-vital:26px;
}
body.light{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF2; --line:#E1E4E9;
  --ink:#14171A; --ink-2:#5A626C; --ink-3:#8B939D;
  --brand:#1272A6; --ok:#1E8A5F; --warn:#9A6410; --bad:#C33B47;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:var(--t-body);line-height:1.5;padding-bottom:calc(100px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* الأرقام: لاتينية دايمًا ومعزولة عن اتجاه العربي */
.n{direction:ltr !important;unicode-bidi:isolate !important;display:inline-block;font-variant-numeric:tabular-nums}

/* ── الرأس ── */
.top{
  position:sticky;top:0;z-index:80;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding:var(--s3) var(--s4);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
.brand > div{min-width:0}
.mark{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:#fff;padding:3px;
  object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.brand h1{font-size:var(--t-title);font-weight:700;letter-spacing:-.3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:var(--t-micro);color:var(--ink-3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:var(--s2);flex-shrink:0}
#sync.old{color:var(--warn)}
.bot-pause{display:none;background:var(--bad);color:#fff;text-align:center;font-weight:800;
  padding:12px 14px;font-size:16px;line-height:1.45;position:sticky;top:0;z-index:85}
.bot-pause.on{display:block}
/* ═══ أقسام المخزون ═══ */
.sec{width:100%;display:flex;align-items:center;gap:var(--s3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:16px;margin-bottom:var(--s2);text-align:right;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.sec:active{transform:scale(.99)}
.sec-dot{width:10px;height:10px;border-radius:99px;flex:0 0 auto;background:var(--ink-3)}
.sec-mid{flex:1;min-width:0}
.sec-mid b{display:block;font-size:15px;font-weight:700}
.sec-mid small{display:block;color:var(--ink-3);font-size:var(--t-small);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-num{text-align:left;flex:0 0 auto}
.sec-num b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.sec-num small{color:var(--ink-3);font-size:var(--t-micro)}
.sec-arw{color:var(--ink-3);font-size:17px}
.sec.bad .sec-dot{background:var(--bad)}
.sec.bad .sec-num b{color:var(--bad)}
.sec.warn .sec-dot{background:var(--warn)}
.sec.warn .sec-num b{color:var(--warn)}
.sec.ok .sec-dot{background:var(--ok)}
.sec-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.sec-head h3{flex:1;font-size:16px;font-weight:700}

.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;
  cursor:pointer;font-size:16px;font-weight:700}
/* الشاشات الضيقة: ٤ زراير ٤٤px لازم يسيبوا مكان لاسم الصيدلية */
@media (max-width:400px){
  .top{padding:var(--s3)}
  .tools{gap:6px}
}

/* ── تبويبات القسم ── */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:10px var(--s4);
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:69px;z-index:70;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs.hide{display:none}
.subtabs button{flex-shrink:0;background:var(--surface-2);border:0;color:var(--ink-2);
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--brand);color:#fff}

/* ── الحاوية ── */
.wrap{padding:var(--s4);max-width:680px;margin:0 auto}
/* ═══ شكل موحّد لكل الصفحات ═══ */
.vitals2{padding:14px}
.v-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.v-head h2{font-size:17px;font-weight:750;letter-spacing:-.3px}
.v-head span{font-size:var(--t-micro);color:var(--ink-3);white-space:nowrap}
.v-grid{display:grid;gap:8px;align-items:stretch}
.v-tile{background:var(--surface-2);border-radius:var(--r2);padding:10px 12px;min-width:0;display:flex;flex-direction:column;min-height:86px}
.v-tile small{display:block;font-size:var(--t-micro);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.25;text-align:right;margin-top:2px}
.v-tile em{display:block;font-style:normal;font-size:var(--t-micro);color:var(--ink-3);margin-top:auto;padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
@media (max-width:400px){.v-tile b{font-size:19px}.v-tile{padding:9px 10px}}
/* الكمبيوتر: الصفحات أعرض والكروت عمودين */
@media (min-width:1000px){
  .wrap{max-width:1080px}
  .wrap:not(#p-home):not(#p-bot){columns:2;column-gap:var(--s3)}
  .wrap:not(#p-home):not(#p-bot) > *{break-inside:avoid}
  .wrap:not(#p-home) > .ctl,.wrap:not(#p-home) > .vitals2,.wrap:not(#p-home) > .state,.wrap:not(#p-home) > .period{column-span:all}
}
/* ═══ الرئيسية ═══ */
.h-pace{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:10px 12px;border-radius:var(--r2);
  background:color-mix(in srgb,var(--brand) 10%,transparent);font-size:12.5px;color:var(--ink-2)}
.h-pace b{color:var(--ink);font-weight:800}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:var(--r2);
  background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;min-height:68px}
.qa svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa:active{transform:scale(.97)}
.h-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:var(--s3);scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--s4));padding:0 var(--s4);scroll-padding:0 var(--s4)}
.h-slides::-webkit-scrollbar{display:none}
.h-slide{flex:0 0 100%;scroll-snap-align:center;margin:0 !important;min-width:0}
.home-col .h-slides{margin-bottom:0}
.h-dots{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.h-dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s}
.h-dots i.on{width:18px;background:var(--brand)}
#heroMonth .h-num b{font-size:40px}
.m-track{position:relative;height:8px;border-radius:99px;background:var(--surface-2);margin-top:14px;direction:ltr}
html[dir=rtl] .m-track{direction:rtl}
.m-track i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.m-track em{position:absolute;top:-4px;width:2px;height:16px;background:var(--warn);border-radius:2px}
.m-legend{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-3);margin-top:6px}
.m-legend i{display:inline-block;width:10px;height:4px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.m-legend .lg-b{background:var(--brand)}.m-legend .lg-w{background:var(--warn);width:3px;height:10px}
.m-grid{grid-template-columns:1fr 1fr !important}
.m-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px 0 12px}
.m-chips::-webkit-scrollbar{display:none}
.m-chips button{flex:0 0 auto;border:0;background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:12px;font-weight:650;padding:6px 11px;border-radius:99px;cursor:pointer}
.m-custom{display:flex;align-items:center;gap:6px;margin:-4px 0 12px;font-size:12px;color:var(--ink-2)}
.m-custom[hidden]{display:none}
.m-custom input{flex:1;min-width:0;background:var(--surface-2);border:0;border-radius:10px;color:var(--ink);font:inherit;font-size:12.5px;padding:7px 8px;color-scheme:dark}
body.light .m-custom input{color-scheme:light}
.m-custom button{border:0;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:10px;cursor:pointer}
.m-chips button.on{background:var(--ink);color:var(--bg)}
@media (min-width:900px){.h-slides{margin:0;padding:0}}
.c-goal{margin-top:12px}
.c-goal-t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:5px}
.c-goal-b{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.c-goal-b i{display:block;height:100%;border-radius:99px}
.h-day{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding:10px 12px;border-radius:var(--r2);background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.h-day > b{color:var(--ink);font-size:13.5px}.h-day span b{color:var(--ink)}
.h-share{display:block;height:4px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden;direction:ltr}
.h-share i{display:block;height:100%;background:var(--brand);border-radius:99px;opacity:.75}
.home-grid{display:flex;flex-direction:column;gap:var(--s3)}
.home-col{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.home-col .card{margin:0}
@media (min-width:900px){#p-home{max-width:1080px}.home-grid{display:grid;grid-template-columns:1.1fr 1fr;align-items:start}}
.h-hero{padding:18px}
.cam-chips{display:flex;gap:6px;margin-top:10px}
.cam-chip{flex:1;text-align:center;border-radius:var(--r2);padding:7px 4px;font-size:var(--t-small);font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.cam-chip.ok{color:var(--ok)}
.cam-chip.bad{color:var(--bad)}
.cam-note{margin-top:8px;font-size:var(--t-small);color:var(--ink-2)}
.task.busy{opacity:.55;pointer-events:none}
.q-act.busy{opacity:.55;pointer-events:none}
.q-acts{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.cam-card .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.appearance-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.appearance-period{font-weight:800;font-size:var(--t-h3);margin:8px 0 2px}
.appearance-main{display:flex;gap:18px;align-items:center;margin:16px 0}
.appearance-ring{--appearance-score:0%;width:106px;height:106px;flex-shrink:0;border-radius:50%;background:conic-gradient(var(--brand) var(--appearance-score),var(--surface-2) 0);display:grid;place-items:center}
.appearance-ring>div{width:90px;height:90px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column}
.appearance-ring b{font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.appearance-ring small,.appearance-time,.appearance-muted{font-size:var(--t-small);color:var(--ink-2)}
.appearance-delta{font-weight:800;margin:5px 0}.appearance-delta.up{color:var(--ok)}.appearance-delta.down{color:var(--bad)}
.appearance-cover{padding:9px 12px;background:var(--surface-2);border-radius:var(--r2);font-size:var(--t-small)}
.appearance-time{margin-top:8px}.appearance-detail{margin:12px 0;border-top:1px solid var(--line);padding-top:10px}
.appearance-detail summary{min-height:42px;font-weight:700;cursor:pointer}
.appearance-kpi{margin:10px 0}.appearance-kpi>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:var(--t-small)}
.appearance-kpi b{white-space:nowrap;font-variant-numeric:tabular-nums}.appearance-track{height:5px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:5px}.appearance-track i{display:block;height:100%;background:var(--brand);border-radius:6px}
.appearance-statuses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}.appearance-statuses>div{background:var(--surface-2);padding:8px 2px;border-radius:var(--r2);text-align:center}.appearance-statuses b{display:block;font-size:20px}.appearance-statuses small{font-size:11px;color:var(--ink-2)}
.appearance-issue{padding:11px 0;border-top:1px solid var(--line)}.appearance-issue>div:first-child{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.appearance-issue b{font-size:var(--t-small)}.appearance-state{font-size:11px;white-space:nowrap;color:var(--ink-2)}.appearance-issue p{font-size:var(--t-small);color:var(--ink-2);margin:4px 0}
.appearance-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.appearance-actions .btn{flex:1;min-height:44px}
.appearance-reports{display:grid;gap:7px;margin-top:12px}.appearance-report{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:10px;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px}.appearance-report small{display:block;color:var(--ink-2)}
@media(max-width:360px){.appearance-main{gap:12px}.appearance-ring{width:94px;height:94px}.appearance-ring>div{width:80px;height:80px}}
.camr-zoom{position:fixed;inset:0;z-index:300;background:#000;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.camr-zoom img{display:block;width:200%;max-width:none;height:auto}
.camr-zoom button{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-end:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;font-weight:800;cursor:pointer}
.camr-zoom.fit img{width:100%}
.camr-page img{cursor:zoom-in}
.q-act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);color:var(--ink);font-family:inherit;cursor:pointer;text-align:center;min-height:96px;transition:transform .12s,border-color .12s}
.q-act:active{transform:scale(.97)}
.q-act i{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface);color:var(--ink-2);margin-bottom:4px}
.q-act i svg,.camr-bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.q-act.q-main i{background:var(--brand);color:#fff}
.camr-bar .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ctl-more svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.ic{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.ic[disabled]{opacity:.45}
.q-act b{font-size:var(--t-body,14px);font-weight:700}
.q-act small{font-size:var(--t-micro);color:var(--ink-2);line-height:1.35}
.q-act.q-main{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:color-mix(in srgb,var(--brand) 10%,var(--surface-2))}
.q-act.q-main small{color:var(--brand);font-weight:700}
.q-act small.bad{color:var(--bad)}
.sheet.wide{align-items:stretch}
.sheet.wide .sheet-in{max-width:980px;max-height:none;height:100%;border-radius:0;padding-top:max(16px,env(safe-area-inset-top))}
.camr-list{display:flex;flex-direction:column;gap:8px}
.camr-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);color:var(--ink);font-family:inherit;cursor:pointer}
.camr-row .cam-chips{grid-column:1/-1;margin-top:6px}
.camr-rt b{display:block;font-size:16px;font-weight:800}.camr-rt small{color:var(--ink-2);font-size:var(--t-small)}
.camr-n{font-weight:800;font-size:var(--t-small);padding:5px 12px;border-radius:99px;background:var(--surface)}
.camr-n.bad,.camr-sum.bad{color:var(--bad)}.camr-n.ok,.camr-sum.ok{color:var(--ok)}
.camr-bar{display:flex;gap:8px;justify-content:space-between;margin-bottom:10px}.camr-bar .btn{width:auto;min-width:110px;margin:0}
.camr-sum{font-weight:800;font-size:15px;margin-bottom:10px}
.camr-page{margin-bottom:12px;border-radius:var(--r2);overflow:hidden;background:var(--surface-2)}
.camr-page img{display:block;width:100%;height:auto}

.h-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.h-top h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.h-top span{font-size:var(--t-small);color:var(--ink-3)}
.h-tag{font-size:11px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 8px;border-radius:99px;vertical-align:middle}
.h-main{display:flex;align-items:center;gap:16px}
.h-ring{width:112px;height:112px;flex:0 0 auto}
.h-num{min-width:0}
.h-num small{display:block;font-size:var(--t-small);color:var(--ink-2)}
.h-num b{display:block;font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.h-num u{display:block;text-decoration:none;font-size:13px;color:var(--ink-2);margin-top:2px}
.h-cmp{font-size:12.5px;color:var(--ink-2);margin-top:6px;font-weight:600}
.h-cmp:empty{display:none}
.h-minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.h-mini{background:var(--surface-2);border-radius:var(--r2);padding:10px;display:flex;flex-direction:column;min-height:86px}
.h-mini u{margin-top:auto !important;padding-top:4px}
.h-mini small{display:block;font-size:var(--t-micro);color:var(--ink-2)}
.h-mini b{display:block;font-size:19px;font-weight:750;letter-spacing:-.5px;margin-top:2px;white-space:nowrap}
.h-mini em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600}
.h-mini u{display:block;text-decoration:none;font-size:var(--t-micro);color:var(--ink-3);margin-top:4px}
.h-bar{display:block;height:5px;border-radius:99px;background:var(--line);overflow:hidden;direction:ltr}
.h-bar i{display:block;height:100%;background:var(--warn);border-radius:99px}
.task{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.task:last-of-type{border-bottom:0}
.task .dot{width:9px;height:9px;border-radius:99px;background:var(--tone);flex:0 0 auto}
.task-m{flex:1;min-width:0}
.task-m b{display:block;font-size:var(--t-body);font-weight:650}
.task-m small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:1px}
.task-n{font-size:20px;font-weight:800;color:var(--tone);white-space:nowrap}
.task-a{color:var(--ink-3);font-size:17px}
.task:active{opacity:.6}
.h-stats{display:flex;justify-content:space-between;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.h-stats b{color:var(--ink);font-weight:750}
.h-team{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.h-team:last-child{border-bottom:0}
.h-dot{width:9px;height:9px;border-radius:99px;background:var(--line);flex:0 0 auto}
.h-dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.h-tn{flex:1;min-width:0}.h-tn b{display:block;font-size:var(--t-body);font-weight:650}
.h-tn small{display:block;font-size:var(--t-small);color:var(--ink-2)}
.h-tv{font-size:16px;font-weight:750}
@media (max-width:400px){.h-num b{font-size:34px}.h-ring{width:96px;height:96px}.h-mini b{font-size:17px}}

/* ── الكارت ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s3)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.card-head h3{font-size:var(--t-title);font-weight:650;letter-spacing:-.2px}
.card-head p{font-size:var(--t-small);color:var(--ink-2);margin-top:2px}

/* ── شريط المؤشرات: بداية كل قسم ── */
.vitals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:var(--s4);margin-bottom:var(--s4)}
.vitals-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.vitals-head h2{font-size:var(--t-head);font-weight:700;letter-spacing:-.5px}
.vitals-head span{font-size:var(--t-micro);color:var(--ink-3);white-space:nowrap}
/* كل مؤشر في مربع مستقل — الرقم في سطر والكلام في سطر،
   فلا توجد خلط اتجاهات في نفس السطر أصلاً */
.vitals-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.vital{background:var(--surface-2);border-radius:var(--r2);padding:12px 10px;
  min-width:0;text-align:center;border-top:2px solid var(--tone,var(--brand))}
.vital small{display:block;font-size:var(--t-micro);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.vital b{display:block;font-size:22px;font-weight:700;letter-spacing:-.8px;line-height:1.15;
  direction:ltr;unicode-bidi:isolate}
.vital i{display:block;font-style:normal;font-size:var(--t-micro);font-weight:700;
  color:var(--tone,var(--brand));margin-top:6px;direction:ltr;unicode-bidi:isolate}
.vital u{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── السطر ── */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row-main{min-width:0}
.row-main b{display:block;font-size:var(--t-body);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:2px}
.row-val{font-size:var(--t-body);font-weight:650;white-space:nowrap}
.group-title{font-size:var(--t-micro);font-weight:650;color:var(--ink-3);
  letter-spacing:.3px;padding:var(--s3) 0 var(--s1)}

/* ── الشارة ── */
.badge{font-size:var(--t-micro);font-weight:650;padding:4px 9px;border-radius:99px;white-space:nowrap;
  background:color-mix(in srgb,var(--tone,var(--ink-2)) 15%,transparent);color:var(--tone,var(--ink-2))}

/* ── التنبيه ── */
.alert{display:flex;gap:var(--s3);align-items:center;padding:12px 2px;min-height:48px;
  border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .dot{width:9px;height:9px;border-radius:99px;background:var(--tone);flex-shrink:0}
.alert b{display:block;font-size:var(--t-body);font-weight:650;color:var(--ink)}
.alert small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:1px}

/* ── الأزرار ── */
.btn{display:block;width:100%;padding:12px;border:0;border-radius:var(--r2);
  font-size:var(--t-body);font-weight:650;cursor:pointer;margin-bottom:var(--s2)}
.btn-primary{background:var(--brand);color:#fff}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-row{display:flex;gap:var(--s2)}
.btn-row .btn{margin-bottom:0}
.exp-btns{display:flex;gap:6px}
.exp-btns button{background:var(--surface-2);border:0;color:var(--ink-2);font-family:inherit;
  font-size:var(--t-micro);font-weight:650;padding:5px 10px;border-radius:99px;cursor:pointer}


/* ── سطر التحكّم: قاعدة واحدة لكل الصفحات ──
   الفلتر الأساسي شمال · زرار ⋯ يمين بيفتح الباقي */
.ctl{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.ctl-main{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ctl-main::-webkit-scrollbar{display:none}
.ctl-main button{flex-shrink:0;background:var(--surface-2);border:0;color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;
  cursor:pointer;white-space:nowrap}
.ctl-main button.on{background:var(--brand);color:#fff}
.ctl-more{flex-shrink:0;width:34px;height:34px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;display:grid;place-items:center}
.ctl-more.dot{position:relative}
.ctl-more.dot::after{content:'';position:absolute;top:6px;inset-inline-end:6px;
  width:6px;height:6px;border-radius:99px;background:var(--brand)}

/* قايمة ⋯ */
.menu-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.menu-row:last-child{border-bottom:0}
.menu-row b{font-size:var(--t-body);font-weight:600}
.menu-row small{display:block;font-size:var(--t-small);color:var(--ink-2);margin-top:1px}
.menu-ic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--tone,var(--brand)) 15%,transparent);color:var(--tone,var(--brand));
  font-size:15px}

/* ── الحالات ── */
.state{padding:var(--s6) var(--s4);text-align:center;color:var(--ink-2);font-size:var(--t-small)}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto var(--s3)}
@keyframes sp{to{transform:rotate(360deg)}}
.state.err{color:var(--bad)}
.state u{cursor:pointer}
.state .retry{display:block;margin:var(--s3) auto 0;min-height:44px;padding:10px 22px;border-radius:var(--r2);
  border:0;background:var(--brand);color:#fff;font-size:var(--t-body);font-weight:700;cursor:pointer}

/* ── شريط الأقسام ── */
.secnav{position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.secnav button{background:0;border:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:600;padding:6px 0 4px;
  border-radius:var(--r2);position:relative}
.secnav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.secnav button.on{color:var(--brand);font-weight:800;background:color-mix(in srgb,var(--brand) 12%,transparent)}
.secnav button.on::before{content:"";position:absolute;top:-6px;left:25%;right:25%;height:3px;
  border-radius:0 0 3px 3px;background:var(--brand)}
.nbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;
  border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center}

/* ── 💬 محادثات البوت ── */
.chat-search{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t-body);margin-bottom:var(--s3)}
.chat-row{cursor:pointer}
.chat-top{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.chat-top .btn{width:auto;margin:0;padding:8px 12px;flex-shrink:0}
.chat-top>div{flex:1;min-width:0}
.chat-top b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top small{color:var(--ink-2);font-size:var(--t-small)}
.chat-pend{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r2);
  margin-bottom:var(--s3);font-size:var(--t-small);background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad)}
.chat-pend u{cursor:pointer;color:var(--ink-2)}
.chat-thread{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:var(--s3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);margin-bottom:var(--s3)}
.bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:var(--t-body);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-img{display:block;width:100%;max-width:220px;min-height:90px;border-radius:10px;margin:0 0 6px;background:var(--surface-2);cursor:zoom-in;object-fit:cover}
.chat-zoom{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px}
.chat-zoom img{max-width:100%;max-height:100%;border-radius:8px}
.bub small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.bub.u{align-self:flex-start;background:var(--surface-2)}
.bub.b{align-self:flex-end;background:color-mix(in srgb,var(--brand) 14%,transparent)}
.bub.p{align-self:flex-end;background:color-mix(in srgb,var(--ok) 20%,transparent)}
.bub-sys{align-self:center;font-size:11.5px;color:var(--ink-3);background:var(--surface-2);padding:4px 10px;border-radius:99px;text-align:center}
.chat-send{display:flex;gap:var(--s2);align-items:flex-end}
.chat-send textarea{flex:1;min-width:0;box-sizing:border-box;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t-body);resize:vertical}
.chat-send .btn{width:auto;margin:0;padding:12px 16px}
/* ── ☰ المزيد ── */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.tile{background:var(--surface-2);border:0;border-radius:var(--r2);padding:14px 4px;display:flex;flex-direction:column;
  align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.tile i{font-style:normal;font-size:24px;line-height:1}
/* ── أقسام الإعدادات ── */
details.setg{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:var(--s2);padding:0 var(--s3)}
details.setg>summary{cursor:pointer;padding:14px 0;font-weight:650;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.setg>summary b{display:block;font-size:15px}
details.setg>summary small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px}
.set-status{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}
.set-line b{display:block;font-size:15px}.set-line small{display:block;font-size:12px;color:var(--ink-2)}
details.setg>summary::-webkit-details-marker{display:none}
details.setg>summary::after{content:'▾';color:var(--ink-3)}
details.setg[open]>summary::after{content:'▴'}
details.setg[open]{padding-bottom:var(--s3)}

.screen{display:none}
.screen.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}.spin{animation-duration:1.4s}}


/* ── شبكة الموظفين ── */
/* الموظفين تحت بعض — صف كامل لكل واحد */
.staff-grid{display:block}
.staff{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s3) var(--s4);cursor:pointer;margin-bottom:var(--s2);
  border-inline-start:3px solid var(--tone,var(--brand));
  display:flex;align-items:center;gap:var(--s3)}
.staff-body{flex:1;min-width:0}
.staff-top{display:flex;align-items:center;gap:6px;min-width:0}
.staff-top b{font-size:var(--t-body);font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.staff-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex-shrink:0}
.staff-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:5px;
  font-size:var(--t-micro);color:var(--ink-2)}
.staff-meta span{white-space:nowrap}
.staff-right{text-align:center;flex-shrink:0;min-width:78px}
.staff-sales{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;
  direction:ltr;unicode-bidi:isolate}
.staff-sales u{display:block;text-decoration:none;font-size:9px;color:var(--ink-3);
  font-weight:600;margin-top:1px}
.staff-score{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:99px;direction:ltr;unicode-bidi:isolate;
  background:color-mix(in srgb,var(--tone) 16%,transparent);color:var(--tone)}
.staff-shift{font-size:10px;color:var(--ok);direction:ltr;unicode-bidi:isolate}

/* ── مقاييس داخل النافذة ── */
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.mini{background:var(--surface-2);border-radius:var(--r1);padding:10px;text-align:center}
.mini small{display:block;font-size:10px;color:var(--ink-2);margin-bottom:4px}
.mini b{display:block;font-size:18px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--tone,var(--brand))}

/* ── نافذة منبثقة ── */
.sheet{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,#000 55%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-width:680px;
  border-radius:var(--r3) var(--r3) 0 0;padding:var(--s4);max-height:82vh;overflow:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.sheet-head b{font-size:var(--t-title);font-weight:700}
.sheet-head span{font-size:var(--t-small);color:var(--ink-2);cursor:pointer}
.sheet-close{position:sticky;bottom:0;display:block;width:100%;min-height:48px;margin-top:var(--s3);
  border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);color:var(--ink);
  font-size:15px;font-weight:700;cursor:pointer}

/* ── التوست ── */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  padding:10px 16px;border-radius:99px;font-size:var(--t-small);font-weight:600;
  z-index:300;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ════════ هوية جديدة: كحلي صيدلية السوسي ════════
   الأساس كحلي غامق مستوحى من لون اللوجو بدل الرمادي.
   الكروت من غير حدود، والقوايم سطور مش صناديق. */
:root{
  /* الخلفية الغامقة الأصلية (أسود/رمادي) — أحمد بيفضّلها عن الكحلي */
  --bg:#0A0B0D; --surface:#141619; --surface-2:#1C1F24; --line:#25292F;
  --ink:#F2F4F7; --ink-2:#9BA3AF; --ink-3:#5F6670;
  --brand:#2A9FDB; --ok:#3DBE8B; --warn:#E8A33D; --bad:#E5646E;
  --r3:20px; --r2:14px;
}
body.light{
  --bg:#EEF3F8; --surface:#FFFFFF; --surface-2:#E8EEF5; --line:#DCE5EE;
  --ink:#0D1A28; --ink-2:#4F6378; --ink-3:#8597AA;
  --brand:#0E7CC0; --ok:#13875F; --warn:#A86A08; --bad:#C9384F;
}
body.light .card, body.light .sec{box-shadow:0 1px 2px rgba(13,26,40,.06)}
.card,.sec{border:0}
.card{padding:18px}
.card-head h3{font-size:17px;font-weight:750}

/* الرأس: اسم + حالة حية، وزرارين بس */
.top{padding:10px var(--s4);min-height:58px;border-bottom:0;
  background:color-mix(in srgb,var(--bg) 85%,transparent)}
.mark{width:34px;height:34px}
.brand h1{font-size:17px;font-weight:800}
.brand p{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);display:inline-block;flex:0 0 auto}
#sync.old + .live-dot,.brand p.stale .live-dot{background:var(--warn)}
.tools{gap:8px}
.ibtn{width:40px;height:40px;border-radius:99px;border:0;background:var(--surface);color:var(--ink-2)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.94)}
/* علامة «فيه تحديث للسيرفر» — نقطة حمرا على زرار التحديث */
.ibtn{position:relative}
.ibtn.upd::after{content:'';position:absolute;top:4px;inset-inline-end:4px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.ibtn:focus-visible,.secnav button:focus-visible,.subtabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* تبويبات القسم: شريط واحد زي مفتاح iPhone */
.subtabs{top:58px;border-bottom:0;padding:6px var(--s4) 8px;gap:0;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.subtabs button{background:transparent;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--ink-2)}
.subtabs:not(.hide){box-shadow:inset 0 0 0 1px transparent}
.subtabs button.on{background:var(--surface);color:var(--ink);font-weight:750;box-shadow:0 1px 0 var(--line)}

/* أزرار الفترة (اليوم/أمس...) */
.ctl-main button{background:transparent;color:var(--ink-2);font-weight:650}
.ctl-main button.on{background:var(--ink);color:var(--bg)}
.ctl-more{border:0;background:var(--surface)}

/* الشريط اللي تحت: كبسولة عايمة */
.secnav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border:0;border-radius:24px;
  padding:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:560px;margin:0 auto}
body.light .secnav{box-shadow:0 8px 24px rgba(13,26,40,.12)}
.secnav button{padding:7px 0 5px;border-radius:18px;font-size:11.5px;color:var(--ink-3)}
.secnav button.on{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}
.secnav button.on::before{display:none}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* سطور القوايم */
.row-val{font-weight:750}
.sec{min-height:68px}
.v-tile{background:var(--surface-2)}
.sheet-in{border-radius:24px 24px 0 0}
.set-prefs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.set-prefs .btn{margin:0}
#ptr{position:fixed;top:64px;left:50%;z-index:95;width:38px;height:38px;border-radius:99px;background:var(--surface);
  display:grid;place-items:center;opacity:0;transform:translate(-50%,0);pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#ptr svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready svg{stroke:var(--brand)}
#ptr.spin{opacity:1 !important;animation:ptrspin .7s linear infinite}

.exp-m{padding:14px 16px}
.exp-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.exp-m.open .exp-h{padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}

.exp-m{margin-bottom:8px}

.exp-h small{display:block;font-size:12px;color:var(--ink-2)}

.v-filter.on{background:var(--brand);color:#fff}

  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid var(--line)}

.exp-more{display:block;width:100%;margin-top:8px;border:0;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;font-weight:650;padding:9px;border-radius:10px;cursor:pointer}
.exp-r{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:13.5px}

function storedPin(){ try { return localStorage.getItem('adminPin') || ''; } catch (e) { return ''; } }
var PIN_ASK = null, AUTH_REQUIRED=false;
function askPinOnce(){
  if (!PIN_ASK) PIN_ASK = new Promise(function(res){
    setTimeout(function(){
      var p = (prompt('🔒 اللوحة مقفولة — اكتب الرقم السري') || '').trim();
      try { if (p) localStorage.setItem('adminPin', p); } catch (e) {}

function api(action, params, base){
  if (!ADMIN_ACTIONS[action] && !base){
    var pin0 = storedPin();
    return api_(action, pin0 ? Object.assign({}, params || {}, { pin: pin0 }) : params, base).then(function(d){
      if (!(d && d.lockError)) return d;
      AUTH_REQUIRED=true;
      try { localStorage.removeItem('adminPin'); } catch (e) {}
      return askPinOnce().then(function(p){ return p ? api_(action, Object.assign({}, params || {}, { pin: p }), base) : d; });
    });
  }
  if (ADMIN_ACTIONS[action] && !base){
    params = Object.assign({}, params || {}, { pin: adminPin() });
    return api_(action, params, base).then(function(d){
      if (d && d.pinError){ try { localStorage.removeItem('adminPin'); } catch (e) {} toast(d.error); }
      return d;
    });
  }

}
function api_(action, params, base){
  var qs = '?action=' + action;
  for (var k in (params || {})) if (params[k] != null) qs += '&' + k + '=' + encodeURIComponent(params[k]);
  var slow = function(){ return fetch((base || SCRIPT_URL) + qs + '&_ts=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }); };
  if (base || !FAST_URL || !FAST_READ[action]) return slow();
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl && setTimeout(function(){ ctl.abort(); }, 30000);
  return fetch(FAST_URL + qs, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error('fast ' + r.status); return r.json(); })
    .then(function(d){ clearTimeout(tm); return d; })
    .catch(function(){ clearTimeout(tm); return slow(); });
}
function post(body){

  });
}

function isoAdd(s, n){ var d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function homeChart(days, salesT, isStale, g){
  var today = cairoNow().date, map = {};

  if (!isStale) map[today] = { date: today, net: salesT, sales: salesT, live: true };

      '<text x="' + (xx + bw / 2) + '" y="' + (H + 15) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="' + (i === HOME_SEL ? 'var(--ink)' : 'var(--ink-2)') + '" font-family="Cairo,system-ui">' + dd + '</text>' +
      '<text x="' + (xx + bw / 2) + '" y="' + (H + 28) + '" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="Cairo,system-ui">' + dn + '</text></g>';
  }).join('');
  var done = list.filter(function(x){ return !x.live && x.sales > 0; });
  var avg = done.length ? Math.round(done.reduce(function(s, x){ return s + x.sales; }, 0) / done.length) : 0;
  var best = done.reduce(function(b, x){ return x.sales > (b ? b.sales : 0) ? x : b; }, null);
  var hits = done.filter(function(x){ return x.sales >= g; }).length;
  HOME_LIST = list;

  return '<svg viewBox="0 -6 ' + W + ' ' + (H + 40) + '" style="width:100%;height:auto;direction:ltr;display:block" role="img" aria-label="مبيعات آخر 14 يوم">' +
    '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.2"/>' +
    '<text x="' + W + '" y="' + (gy - 4) + '" text-anchor="end" font-size="10" fill="var(--ok)" font-family="Cairo,system-ui">الهدف ' + num(g) + '</text>' +
    bars + '</svg>' + '<div id="homeDayInfo" class="h-day">' + homeDayHtml(HOME_SEL) + '</div>' +
    '<div class="h-stats"><span>المتوسط <b>' + ltr(num(avg)) + '</b></span><span>أحسن يوم <b>' + ltr(num(best ? best.sales : 0)) + '</b></span><span>وصلنا الهدف <b>' + ltr(hits + '/' + done.length) + '</b></span></div>';

/* ═══ الكاش المحلي ═══
   سفاري بيقفل الصفحة لما تسيبها في الخلفية ويعيد تحميلها لما ترجع.
   بنحفظ آخر رد ناجح، فأول ما تفتح بيظهر على طول والتحديث بيحصل ورا. */
function cacheKey(a, p){ return 'c:' + a + ':' + JSON.stringify(p || {}); }
function cacheGet(a, p){
  if(!storedPin())return null;
  try{
    var raw = localStorage.getItem(cacheKey(a, p)); if (!raw) return null;
    var o = JSON.parse(raw);
    if (Date.now() - o.t > 86400000) return null;   /* أقدم من يوم = نتجاهله */
    return o.d;
  }catch(e){ return null; }
}
function cacheSet(a, p, d){
  if(!storedPin() || !d || d.ok===false || d.lockError || d.pinError)return;
  try{ localStorage.setItem(cacheKey(a, p), JSON.stringify({ t: Date.now(), d: d })); }
  catch(e){ /* المساحة اتملت — مش مشكلة */ }
}

/* بيرجّع المحفوظ فورًا (لو موجود) وبعدين الجديد */
function apiFresh(action, params, base){
  return api(action, params, base).then(function(d){ if (!(d && d.lockError)) cacheSet(action, params, d); return d; });
}
/* ═══ الرسم الفوري ═══
   الصفحة بترسم المحفوظ من آخر مرة على طول، وبتحدّث ورا لما الرد ييجي.
   ده اللي بيخلي الفتح فوري بدل ما تقعد تبصّ على الدايرة بتاعة التحميل. */
function paint1(action, params, box, draw){
  var old = cacheGet(action, params);
  if (!old) return false;
  try{ draw(old, box); return true; }catch(e){ logErr(e); return false; }
}
/* نفس الفكرة بس للصفحات اللي بتنده نداءين مع بعض */
function paint2(key, a1, p1, a2, p2, box, draw){
  var old = cacheGet(key, p1);
  if (!old) return false;
  try{ draw(old.m, old.k, box); return true; }catch(e){ logErr(e); return false; }
}
var API_CACHED_REQUESTS={};
function apiCached(action, params, box, draw){
  var section=CUR,tab=TAB;
  var seed = paint1(action, params, box, draw);
  if (!seed) busy(box);
  var requestKey=cacheKey(action,params),cachedTime=0;try{var snap=JSON.parse(localStorage.getItem(requestKey)||'null');cachedTime=snap&&snap.t||0;}catch(e){}
  if(action==='getExpensesData' && seed && Date.now()-cachedTime<300000)return Promise.resolve(cacheGet(action,params));
  if(!API_CACHED_REQUESTS[requestKey])API_CACHED_REQUESTS[requestKey]=apiFresh(action,params).finally(function(){delete API_CACHED_REQUESTS[requestKey];});
  return API_CACHED_REQUESTS[requestKey].then(function(d){
    if(CUR!==section || TAB!==tab)return d;
    if(d && (d.lockError || d.pinError)){dashboardSignIn(box);return d;}
    markSync(); draw(d, box); return d;
  }).catch(function(e){ logErr(e); if (!seed) oops(box, ''); else box.insertAdjacentHTML('afterbegin','<div class="state err" role="status">تعذر التحديث؛ المعروض نسخة محفوظة وقديمة.</div>'); });
}

function toPDF(rows, title){
  if (!rows || !rows.length) { toast(tr('noExport')); return; }

  var w = window.open('', '_blank');
  if (!w) { toast(tr('failed')); return; }
  var head = cols.map(function(c){ return '<th>' + c + '</th>'; }).join('');
  var body = rows.map(function(r){
    return '<tr>' + cols.map(function(c){
      var v = r[c] == null ? '' : String(r[c]);
      var isNum = /^[\d.,\-%\s]+$/.test(v);
      return '<td' + (isNum ? ' dir="ltr" class="n"' : '') + '>' + v + '</td>';
    }).join('') + '</tr>';
  }).join('');
  w.document.write(
    '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>' + title + '</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">' +
    '<style>@page{margin:14mm}' +
    'body{font-family:Cairo,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#111;font-size:12px}' +
    'h1{font-size:17px;margin:0 0 2px}' +
    '.sub{color:#666;font-size:11px;margin-bottom:14px}' +
    'table{width:100%;border-collapse:collapse}' +
    'th{background:#f2f4f7;text-align:right;font-size:11px;padding:7px 8px;border-bottom:2px solid #ccc}' +
    'td{padding:6px 8px;border-bottom:1px solid #eee}' +
    '.n{direction:ltr;unicode-bidi:isolate}' +
    'tr:nth-child(even) td{background:#fafbfc}' +
    '</style></head><body>' +
    '<h1>' + title + ' — صيدلية السوسي</h1>' +
    '<div class="sub">' + new Date().toLocaleString('en-GB') + ' · ' + rows.length + ' سطر</div>' +
    '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>' +
    '<script>window.onload=function(){(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){window.print();},250);});};<\/script>' +
    '</body></html>');

}

/* ─────── 💬 محادثات البوت: كل اللي العملاء قالوه والبوت رد بيه، وترد من هنا ─────── */
var CHATS = null, CHAT_Q = '', CHAT_OPEN = null;
function chatWhen(t){
  t = String(t || ''); var today = cairoNow().date;
  return t.slice(0, 10) === today ? t.slice(11, 16) : t.slice(8, 10) + '/' + t.slice(5, 7) + ' ' + t.slice(11, 16);
}
function chatName(c){ return c.name || c.phone || ('عميل ' + String(c.id).slice(-4)); }
function pgChats(){
  CHAT_OPEN = null;
  var box = document.getElementById('p-bot');
  if (!CHATS) busy(box); else drawChats();
  api('getBotChats').then(function(d){
    if (!d || !d.ok){ if (!CHATS) box.innerHTML = '<div class="state err">' + esc((d && d.error) || tr('failed')) + ' <button class="retry" onclick="pgChats()">' + tr('retry') + '</button></div>'; return; }
    CHATS = d.chats || [];
    chatBadge();
    if (CUR === 'bot' && !CHAT_OPEN) drawChats();
  }).catch(function(){ if (!CHATS) oops(box, 'pgChats()'); });
}
function drawChats(){
  var box = document.getElementById('p-bot'), all = CHATS || [];
  var pend = all.filter(function(c){ return c.pending; }).length;
  box.innerHTML = vitals('💬 محادثات البوت', null, [
      { value: num(all.length), label: 'محادثات', tone: 'brand' },
      { value: num(pend), label: 'محتاجة ردك', tone: pend ? 'bad' : 'ok' },
      { value: num(all.filter(function(c){ return c.hold; }).length), label: 'ماسكها بنفسك', tone: 'warn' }
    ]) +
    '<input class="chat-search" placeholder="🔍 ابحث بالاسم أو الرقم أو الكلام" value="' + esc(CHAT_Q) + '" oninput="CHAT_Q=this.value;drawChatList()">' +
    '<div id="chatlist"></div>';
  drawChatList();
}
function drawChatList(){
  var el = document.getElementById('chatlist'); if (!el) return;
  var q = CHAT_Q.trim().toLowerCase();
  var list = (CHATS || []).filter(function(c){ return !q || (chatName(c) + ' ' + c.phone + ' ' + c.lastText).toLowerCase().indexOf(q) !== -1; });
  if (!list.length){ el.innerHTML = '<div class="state">' + ((CHATS || []).length ? 'لا توجد نتائج' : 'لا توجد حاليًا محادثات متسجلة — أول ما عميل يكلّم البوت هتظهر هنا') + '</div>'; return; }
  var icon = { user: '👤', bot: '🤖', pharm: '👨‍⚕️', sys: '⚕️' };
  el.innerHTML = card('المحادثات', 'الأحدث فوق — اللي محتاجة ردك الأول', list.slice(0, 150).map(function(c){
    var id = String(c.id).replace(/[^\w-]/g, '');
    return '<div class="row chat-row" onclick="openChat(\'' + id + '\')"><div class="row-main"><b>' +
      (c.pending ? '🔴 ' : '') + (c.hold ? '🤫 ' : '') + (String(c.id).indexOf('wa_') === 0 ? '🟢 ' : '✈️ ') + esc(chatName(c)) + '</b>' +
      '<small>' + (icon[c.lastRole] || '') + ' ' + esc(c.lastText) + '</small></div>' +
      '<span class="row-val" style="font-size:var(--t-small);color:var(--ink-3)">' + ltr(esc(chatWhen(c.last))) + '</span></div>';
  }).join(''));
}
function openChat(id){
  CHAT_OPEN = id;
  busy(document.getElementById('p-bot'));
  loadChat(id);
}
function loadChat(id){
  return api('getBotChat', { id: id }).then(function(d){
    if (CHAT_OPEN !== id || CUR !== 'bot') return;
    if (!d || !d.ok){ document.getElementById('p-bot').innerHTML = '<div class="state err">' + esc((d && d.error) || tr('failed')) + ' <button class="retry" onclick="openChat(\'' + id + '\')">' + tr('retry') + '</button></div>'; return; }
    drawChat(d);
  }).catch(function(){ if (CHAT_OPEN === id) oops(document.getElementById('p-bot'), 'openChat(\'' + id + '\')'); });
}
function drawChat(d){
  var box = document.getElementById('p-bot'), id = d.id;
  var inp = document.getElementById('chatInput'), draft = inp ? inp.value : '';
  var th = document.getElementById('chatThread'), atEnd = !th || (th.scrollHeight - th.scrollTop - th.clientHeight < 60);
  var who = { u: 'العميل', b: '🤖 البوت', p: '👨‍⚕️ الصيدلي' };
  var h = '<div class="chat-top"><button class="btn btn-quiet" onclick="pgChats()">→ رجوع</button>' +
    '<div><b>' + esc(d.name || d.phone || ('عميل ' + String(id).slice(-4))) + '</b>' +
    '<small>' + (d.phone ? ltr(esc(d.phone)) : 'الرقم مش متسجل') + '</small></div>' +
    '<button class="btn ' + (d.hold ? 'btn-primary' : 'btn-quiet') + '" onclick="chatHold(\'' + id + '\',' + (d.hold ? 0 : 1) + ')">' +
      (d.hold ? '▶️ رجّع البوت' : '🤫 امسكها') + '</button></div>';
  if (d.pending) h += '<div class="chat-pend"><span>🔴 محتاجة ردك (من ' + ltr(esc(d.pending)) + ')</span><u onclick="chatDone(\'' + id + '\')">اتعاملت معاها ✓</u></div>';
  h += '<div class="chat-thread" id="chatThread">' + (d.msgs.length ? d.msgs.map(function(m){
    var txt = esc(m.text);
    if (m.role === 'sys') return '<div class="bub-sys">' + txt + ' · ' + ltr(esc(chatWhen(m.t))) + '</div>';
    var k = m.role === 'user' ? 'u' : (m.role === 'pharm' ? 'p' : 'b');
    var imgs = (m.f ? String(m.f).split(',') : []).map(function(fid){
      fid = fid.replace(/[^\w-]/g, '');
      return fid ? '<img class="chat-img" data-pid="' + fid + '" alt="" onclick="chatZoom(\'' + fid + '\')"' + (PHOTO_CACHE[fid] ? ' src="' + PHOTO_CACHE[fid] + '"' : '') + '>' : '';
    }).join('');
    return '<div class="bub ' + k + '">' + imgs + txt + '<small>' + (k === 'u' ? '' : who[k] + ' · ') + ltr(esc(chatWhen(m.t))) + '</small></div>';
  }).join('') : '<div class="state">لا توجد رسايل متسجلة</div>') + '</div>';
  h += '<div class="chat-send"><textarea id="chatInput" rows="2" placeholder="اكتب ردك — هيوصل للعميل من البوت باسم الصيدلي"></textarea>' +
    '<button class="btn btn-primary" id="chatSendBtn" onclick="chatSend(\'' + id + '\')">إرسال</button></div>' +
    '<div class="state" style="font-size:12px">بتتحدّث لوحدها كل ٢٠ ثانية وإنت فاتحها</div>';
  box.innerHTML = h;
  var inp2 = document.getElementById('chatInput'); if (inp2 && draft) inp2.value = draft;
  var th2 = document.getElementById('chatThread'); if (th2 && atEnd) th2.scrollTop = th2.scrollHeight;
  loadChatImgs();
}
var PHOTO_CACHE = {}, PHOTO_FULL = {};
function loadChatImgs(){
  var list = Array.prototype.slice.call(document.querySelectorAll('img.chat-img[data-pid]:not([src])'));
  (function next(){
    var im = list.shift(); if (!im) return;
    var fid = im.getAttribute('data-pid');
    api('botPhoto', { id: fid }).then(function(d){
      if (d && d.ok){ PHOTO_CACHE[fid] = d.data; im.src = d.data; }
      else { im.alt = (d && d.error) || 'الصورة غير متاحة'; im.style.minHeight = '0'; }
      next();
    }).catch(function(){ next(); });
  })();
}
function chatZoom(fid){
  var z = document.createElement('div'); z.className = 'chat-zoom';
  z.onclick = function(){ z.remove(); };
  var im = document.createElement('img'); im.src = PHOTO_FULL[fid] || PHOTO_CACHE[fid] || ''; z.appendChild(im);
  document.body.appendChild(z);
  if (!PHOTO_FULL[fid]) api('botPhoto', { id: fid, full: '1' }).then(function(d){ if (d && d.ok){ PHOTO_FULL[fid] = d.data; im.src = d.data; } });
}
function chatSend(id){
  var inp = document.getElementById('chatInput'), txt = inp ? inp.value.trim() : '';
  if (!txt) return;
  var btn = document.getElementById('chatSendBtn'); if (btn) btn.disabled = true;

    if (d && d.ok){ toast('✓ اتبعت للعميل'); var i2 = document.getElementById('chatInput'); if (i2) i2.value = ''; loadChat(id); }
    else { toast((d && d.error) || tr('failed')); if (btn) btn.disabled = false; }
  }).catch(function(){ toast(tr('failed')); if (btn) btn.disabled = false; });
}
function chatHold(id, on){
  api('botHold', { id: id, on: on ? '1' : '0' }).then(function(d){
    toast(d && d.ok ? (on ? '🤫 البوت ساكت — إنت اللي بترد' : '▶️ البوت رجع يرد') : ((d && d.error) || tr('failed')));
    loadChat(id);
  });
}
function chatDone(id){
  api('botDone', { id: id }).then(function(){

    loadChat(id);

/* 🔴 رقم على زرار البوت تحت = المحادثات اللي محتاجة ردك (بيتحدّث كل دقيقة لو الرقم السري محفوظ) */

function pgHome(){
  if(storedPin())homeCamLatest(true,true); // Fetch saved reports on entry/resume without notifications.
  var box = document.getElementById('p-home');
  var seed = cacheGet('home', {});
  // Keep the currently displayed net sales visible until fresh data arrives.
  // Repainting the cached snapshot on every reload causes a visible flash.
  if (!box.querySelector('.home-flash-deck')) {
    // A hard page reload must not paint a provisional home snapshot before the
    // authoritative invoice summary arrives: that causes net to dip and average to dash.
    // Show only the last verified invoice-backed snapshot immediately; refresh silently.
    if (seed && seed.b && seed.kpi && seed.kpi._salesSummary && seed.kpi._salesSummary.ok && seed.kpi._salesSummary.source==='pos-invoices-v1' && [seed.kpi._salesSummary.net_sales,seed.kpi._salesSummary.profit_total,seed.kpi._salesSummary.avg_invoice].every(function(v){return typeof v==='number' && isFinite(v);})) drawHome(seed.b,seed.kpi,true);
    else busy(box);
  }

  var loadHome = function(again){
    return Promise.all([ api('getHomeBundle'), api('getStaffKPI', { range: 'today' }), api('getMonthTotalsRaw',{range:'today'}) ])
    .then(function(res){
      if(res[1])res[1]._salesSummary=res[2];
      // Only today's complete invoice summary may replace visible financial KPIs.
      var summary=res[2], today=cairoNow().date;
      var complete=summary && summary.ok && summary.source==='pos-invoices-v1' &&
        Array.isArray(summary.daily) && summary.daily.some(function(x){return x.date===today;});
      if(!complete){
        var sync=document.getElementById('sync');
        if(sync){sync.textContent=tr('cached')+' · '+tr('refreshing');sync.classList.add('old');}
        return;
      }
      // Never persist a partial snapshot over the last authoritative home cache.
      if(res[1] && res[1]._salesSummary && res[1]._salesSummary.ok && res[1]._salesSummary.source==='pos-invoices-v1') cacheSet('home', {}, { b: res[0], kpi: res[1] });
      markSync();
      drawHome(res[0], res[1], false);
      /* الرقم كان قديم شوية والسيرفر السريع بيجيب الجديد دلوقتي: نسأل تاني بعد ثواني */
      if (again && ((res[0] && res[0]._stale) || (res[1] && res[1]._stale))) setTimeout(function(){ loadHome(false).catch(logErr); }, 5000);
    });
  };
  loadHome(true).catch(function(e){
    logErr(e);
    if (!seed && !box.querySelector('.home-flash-deck')) oops(box, "pgHome()");
    else { var el = document.getElementById('sync'); if (el){ el.textContent = tr('cached'); el.classList.add('old'); } }
  });

  startAutoRefresh();
}

/* ═══ التحديث التلقائي ═══
   المشكلة اللي كانت: الصفحة كانت بتجيب البيانات مرة واحدة بس عند
   الفتح. لو سيبت الموبايل مفتوح على الشاشة، الرقم بيفضل واقف لحد
   ما تخرج وترجع. دلوقتي بيسأل السيرفر كل دقيقة طول ما الشاشة قدامك.

   بيقف لوحده لما تقفل الموبايل أو تبدّل تبويب — عشان مناكلش
   من حصة Apps Script اليومية ومن بطارية الموبايل. */
var AUTO_TIMER = null;

function startAutoRefresh(){
  stopAutoRefresh();
  AUTO_TIMER = setInterval(function(){
    if (document.hidden) return;          // الشاشة مقفولة أو تبويب تاني
    if (CUR !== 'sales' || TAB !== 0) { stopAutoRefresh(); return; }
    if(storedPin())homeCamLatest(true,true); // Independent of sales success; metadata only, once per visible minute.
    Promise.all([ api('getHomeBundle'), api('getStaffKPI', { range: 'today' }), api('getMonthTotalsRaw',{range:'today'}) ])
    .then(function(res){
      if(res[1])res[1]._salesSummary=res[2];
      cacheSet('home', {}, { b: res[0], kpi: res[1] });
      markSync();
      drawHome(res[0], res[1], false);
    }).catch(function(e){ logErr(e); });
  }, 60000);
}

function stopAutoRefresh(){
  if (AUTO_TIMER){ clearInterval(AUTO_TIMER); AUTO_TIMER = null; }
}

/* لما ترجع للتطبيق بعد ما كان مقفول، حدّث على طول من غير ما تستنى الدورة */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && CUR === 'sales' && TAB === 0) pgHome();
});

function drawHome(b, kpi, isOld){
  var box = document.getElementById('p-home');
  try{
    HOME_FLASH_MODE=true;
    kpi = kpi || {};
    if (!b || !b.ok) throw new Error('bundle');
    if (!isOld) markSync();

    var d = b.daily || {}, at = b.attendance || {}, dt = b.debts || {},
        ex = b.expiry || {}, ag = b.agents || {};

    var salesT = d.sales_today || 0, salesY = d.sales_yesterday || 0;
    /* قبل ٦ المسا المقارنة بأمس مضلّلة (اليوم لسه مكملش)، فنعرض التقدّم بدل الفرق */
    var lateDay = cairoNow().hour >= 18;
    var delta = salesY > 0 ? Math.round((salesT - salesY) / salesY * 100) : 0;
    var progress = salesY > 0 ? Math.round(salesT / salesY * 100) : 0;
    var salesNote = lateDay
      ? { tone: delta >= 0 ? 'ok' : 'bad',
          num: (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '%', word: tr('vsYesterday') }
      : { tone: 'brand', num: progress + '%', word: tr('ofYesterday') };

    /* ── ١) المؤشرات ── */
    var html = '';
    if (isOld){
      var syncEl = document.getElementById('sync');
      if (syncEl){ syncEl.textContent = tr('cached') + ' · ' + tr('refreshing'); syncEl.classList.add('old'); }
    }



    /* حساب أرقام اليوم — محتاجينها للتنبيهات كمان */
    var emps = kpi.employees || [];
    var tot = { inv:0, reg:0, nreg:0, newc:0, rep:0, disc:0, ret:0 };
    emps.forEach(function(e){
      tot.inv += e.invoices; tot.reg += e.registered; tot.nreg += e.not_reg;
      tot.newc += e.new_c;   tot.rep += e.repeat_c;   tot.disc += e.discount;
      tot.ret += e.returns;
    });
    var totCust = tot.reg + tot.nreg;
    var avgInv  = tot.inv ? Math.round(salesT / tot.inv) : 0;
    var regPct  = pct(tot.reg, totCust);

    /* ── ١) المؤشرات ──
       نظام البيع بيصفّر عداد اليوم عند فتح الصيدلية، مش نص الليل.
       فلو آخر تحديث ليه من يوم فات، الأرقام دي بتاعت أمس مش اليوم. */
    /* نظام البيع بيصفّر عداده عند فتح الصيدلية مش نص الليل.
       الفواتير بتيجي من ملف اليوم (بيتصفّر فعلاً)، فلو الفواتير صفر
       والمبيعات مش صفر → الرقم ده بتاع يوم فات. */
    var upd = String(d.updated_at || '');
    var updDay = (upd.match(/\d{4}-\d{2}-\d{2}/) || [''])[0];
    var todayStr = cairoNow().date;
    var isStaleDay = !!kpi._yesterday || (updDay && updDay < todayStr) || (tot.inv === 0 && salesT > 0);

    if(kpi._salesSummary && kpi._salesSummary.source==='pos-invoices-v1' && kpi._salesSummary.daily && kpi._salesSummary.daily.some(function(x){return x.date===todayStr;}))isStaleDay=false;
    /* قبل أول فاتورة: نعرض أمس كامل من شيت الموظفين (نفس مصدر صفحة الفريق والأداء) */
    if (isStaleDay && !kpi._yesterday){
      var yk = HOME_YK && HOME_YK.day === todayStr ? HOME_YK.k : null;
      if (yk){ kpi = yk; }
      else {
        api('getStaffKPI', { range: 'yesterday' }).then(function(k){
          if (k && k.employees){ k._yesterday = 1; HOME_YK = { day: todayStr, k: k }; if (CUR === 'sales' && TAB === 0) drawHome(b, k, isOld); }
        }).catch(logErr);
      }
      if (yk){ emps = kpi.employees || []; tot = { inv:0, reg:0, nreg:0, newc:0, rep:0, disc:0, ret:0 };
        emps.forEach(function(e){ tot.inv += e.invoices; tot.reg += e.registered; tot.nreg += e.not_reg; tot.newc += e.new_c; tot.rep += e.repeat_c; });
        totCust = tot.reg + tot.nreg; }
    }
    /* المبيعات = صافي بعد المرتجعات، من نفس المصدر في كل الصفحات.
       عداد نظام البيع بيتاخد بس لو شيت الموظفين لسه فاضي. */
    var netSum = emps.reduce(function(s, e){ return s + (e.net || 0); }, 0);
    var profitT = d.profit_today || 0;
    if (emps.length && netSum > 0){
      salesT = netSum;
      profitT = emps.reduce(function(s, e){ return s + (e.profit || 0); }, 0);
    }
    /* متوسط الفاتورة = إجمالي البيع ÷ عدد الفواتير (قبل المرتجعات) — نفس حساب صفحة الأداء */
    var grossSum = emps.reduce(function(s, e){ return s + (e.sales || 0); }, 0);
    avgInv = tot.inv ? Math.round((grossSum || salesT) / tot.inv) : 0;
    var retCnt = emps.reduce(function(s, e){ return s + (e.returns || 0); }, 0), retVal = emps.reduce(function(s, e){ return s + (e.returns_val || 0); }, 0);

    var canonical=kpi._salesSummary,canonicalReady=canonical && canonical.ok && canonical.source==='pos-invoices-v1';
    if(!isStaleDay && canonicalReady){salesT=canonical.net_sales;profitT=canonical.profit_total;avgInv=canonical.avg_invoice;retVal=canonical.returns_value_total;retCnt=canonical.returns_total;tot.inv=canonical.invoices_total;}
    // A partial POS bundle can report a lower provisional net and no invoice average.
    // Do not replace an already displayed canonical total with this provisional snapshot.
    // Wait for the complete invoice summary instead of showing a misleading dip/dash.
    var visibleToday=box.querySelector('.home-flash-today');
    var visibleDay=HOME_FLASH_DAY_STATS && HOME_FLASH_DAY_STATS.date;
    if(!isOld && !isStaleDay && !canonicalReady && visibleToday && visibleDay===todayStr &&
       HOME_FLASH_DAY_STATS && HOME_FLASH_DAY_STATS.canonical===true){
      var syncNote=document.getElementById('sync');
      if(syncNote){syncNote.textContent=tr('cached')+' · '+tr('refreshing');syncNote.classList.add('old');}
      return;
    }
    // On a full reload, the visible seed may not have been painted yet.
    // Do not draw provisional numbers while waiting for the authoritative POS result.
    if(!isOld && !isStaleDay && !canonicalReady && !visibleToday) return;
    /* ═══ الرئيسية الجديدة: هدف فوق، مهام، آخر 14 يوم، الفريق ═══ */
    var gS = goalOf('daily_sales', 10000), gV = goalOf('daily_visits', 150);
    var pS = gS ? Math.round(salesT / gS * 100) : 0;
    var hit = salesT >= gS;
    var ring = homeGoalRing(salesT,gS);
    var left = Math.max(0, gS - salesT);
    var dayWord = isStaleDay ? 'أمس' : 'اليوم';
    var homeDay=isStaleDay?isoAdd(todayStr,-1):todayStr;
    var visits = (isStaleDay && !kpi._yesterday) ? null : totCust;
    var mini = function(label, val, sub, tone){
      return '<div class="h-mini"><small>' + label + '</small><b' + (tone ? ' style="color:var(--' + tone + ')"' : '') + '>' + val + '</b>' + (sub ? '<u>' + sub + '</u>' : '') + '</div>';
    };
    var vBar = function(v){
      var pv = gV ? Math.min(100, Math.round(v / gV * 100)) : 0;
      return '<span class="h-bar"><i style="width:' + pv + '%"></i></span>';
    };
    /* المعدل: الصيدلية بتشتغل من 8 الصبح لـ 1 بالليل */
    var paceLine = '';
    if (!isStaleDay && salesT > 0 && !hit){
      var cn = cairoNow(), hrs = cn.hour + (cn.minute || 0) / 60, OPEN = 8, CLOSE = 25;
      if (hrs < 2) hrs += 24;   /* بعد نص الليل لسه في نفس اليوم (بنقفل 1 بالليل) */
      var f = (hrs - OPEN) / (CLOSE - OPEN), leftH = Math.max(0.5, CLOSE - hrs);
      if (f > 0.12 && f < 0.97){
        var proj = Math.round(salesT / f / 50) * 50;
        paceLine = '<details class="h-pace"><summary>توقع الإغلاق <b>' + ltr(num(proj)) + '</b></summary><span>تقدير مبدئي بافتراض معدل بيع ثابت. المطلوب <b>' + ltr(num(Math.ceil(left / leftH / 10) * 10)) + '</b> في الساعة للوصول إلى الهدف.</span></details>';
      }
    }
    html += '<div class="home-grid"><div class="home-col">';
    html += '<div class="h-slides" id="heroSlides" onscroll="heroDots()"><div class="card h-hero h-slide">' +
      '<div class="h-top"><h2>' + dayWord + (isStaleDay ? ' <span class="h-tag">لسه مفتحناش</span>' : '') + '</h2>' +
        '<span>' + esc(new Date(Date.now() - (isStaleDay ? 86400000 : 0)).toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'Africa/Cairo' })) + '</span></div>' +
      (!isStaleDay&&!canonicalReady?'<div class="state err">مصدر المبيعات الموحد غير متاح؛ الأرقام التالية مؤقتة حتى تحديث السيرفر والبيانات.</div>':'')+'<div class="h-main">' + ring + '<div class="h-num"><small>صافي المبيعات</small><b>' + ltr(num(salesT)) + '</b>' +
        '<u>' + (hit ? '🎯 عدّينا الهدف ' + ltr(num(gS)) : 'فاضل ' + ltr(num(left)) + ' على ' + ltr(num(gS))) + '</u>' +
        '<div id="homeCmp" class="h-cmp"></div></div></div>' + paceLine +
      '<div class="h-minis" style="grid-template-columns:repeat(2,1fr)">' +
        mini('عملاء الفواتير', '<span id="homeVisits">' + (visits == null ? '—' : ltr(num(visits))) + '</span> <em>/ ' + ltr(num(gV)) + '</em>', '<span id="homeVisitsBar">' + (visits == null ? vBar(0) : vBar(visits)) + '</span>') +
        mini('ربح البيع', ltr(num(profitT)), salesT > 0 ? 'هامش ' + ltr(pct(profitT, salesT) + '%') : '') +
        ((isStaleDay && !kpi._yesterday) ? mini('أول فاتورة', '—', 'هتصفّر العداد') : mini('متوسط الفاتورة', ltr(num(avgInv)), ltr(num(tot.inv)) + ' فاتورة')) +
        mini('المرتجع', ltr(num(retVal)) + ' ' + tr('egp'), ltr(num(retCnt)) + ' مرتجع' + (salesT > 0 && retVal > 0 ? ' · ' + ltr(pct(retVal, salesT + retVal) + '%') : '')) +
      '</div><div class="home-insight-grid"><div class="home-insight-slot" id="homeDayExpenses" data-day="'+homeDay+'">'+homeExpenseHtml((homeReadExpense(homeDay.slice(0,7)) || {}).data,homeDay,homeDay,true,true)+'</div><div class="home-camera home-insight-slot" id="homeAppearance" aria-live="polite">'+(storedPin() && CAMR.list?appearanceHomeHtml(CAMR.list,CAMR.at===0):homeCameraPlaceholder(storedPin()?'جارٍ التحميل…':'سجّل الدخول'))+'</div></div></div>' +
      '<div class="card h-hero h-slide" id="heroMonth">' + (HOME_MONTH ? monthSlide(HOME_MONTH) : '<div class="state"><div class="spin"></div></div>') + '</div>' +
      '</div>';

    /* ── مطلوب اليوم ── */
    var acts = [];
    var overdue = (dt.debtors || []).filter(function(c){
      return (new Date() - new Date(c.lastActivity)) / 86400000 > 30 && c.net > 0;
    });
    if (overdue.length) acts.push(task('bad', 'ديون متأخرة', ltr(num(overdue.reduce(function(a,c){return a+c.net;},0))) + ' ' + tr('egp'), overdue.length, "go('money',3)"));
    if (ex.expired && ex.expired.count) acts.push(task('bad', 'أصناف منتهية', 'إزالة من الرف', ex.expired.count, "go('stock',2)"));
    var months = ex.months || [], soon = months.length ? months[0] : null;

/* بيقارن آخر ٧ أيام باللي قبلهم ويقول إيه اللي اتحرّك.
   بيتنادى بعد ما الشاشة تظهر، فمش بيأخّر التحميل. */
function loadTrends(){
  api('getStaffKPI', { range: 'month' }).then(function(k){
    var box = document.getElementById('trends'); if (!box) return;
    var d = (k.daily || []).slice();
    if (d.length < 6){ box.innerHTML = ''; return; }

    var recent = d.slice(-7), prior = d.slice(-14, -7);
    if (!prior.length) prior = d.slice(0, Math.max(1, d.length - 7));

    function avg(arr, f){ return arr.length ? arr.reduce(function(s,x){ return s + (f(x) || 0); }, 0) / arr.length : 0; }
    function pctChange(a, b){ return b > 0 ? Math.round((a - b) / b * 100) : 0; }

    var items = [];

    var sNow = avg(recent, function(x){ return x.sales; }),
        sOld = avg(prior,  function(x){ return x.sales; }),
        sCh  = pctChange(sNow, sOld);
    if (Math.abs(sCh) >= 5) items.push({
      tone: sCh > 0 ? 'ok' : 'bad', ic: sCh > 0 ? '↑' : '↓',
      title: tr('salesPerf') + ' ' + (sCh > 0 ? tr('trendUp') : tr('trendDown')) + ' ' + ltr(Math.abs(sCh) + '%'),
      sub: tr('avgDaily') + ' ' + ltr(num(sNow)) + ' ' + tr('egp') +
           ' <span style="color:var(--ink-3)">(' + ltr(num(sOld)) + ')</span>'
    });

    var rNow = pct(recent.reduce(function(s,x){ return s + x.registered; }, 0),
                   recent.reduce(function(s,x){ return s + x.total_cust; }, 0)),
        rOld = pct(prior.reduce(function(s,x){ return s + x.registered; }, 0),
                   prior.reduce(function(s,x){ return s + x.total_cust; }, 0));
    if (Math.abs(rNow - rOld) >= 4) items.push({
      tone: rNow > rOld ? 'ok' : 'bad', ic: rNow > rOld ? '↑' : '↓',
      title: tr('regRate') + ' ' + (rNow > rOld ? tr('trendUp') : tr('trendDown')),
      sub: ltr(rOld + '%') + ' <span style="color:var(--ink-3)">→</span> ' + ltr(rNow + '%') +
           ' · ' + tr('regRate') + ' ' + ltr('75%'),
      jump: "go('team',0)"
    });

    var nNow = avg(recent, function(x){ return x.new_c; }),
        nOld = avg(prior,  function(x){ return x.new_c; }),
        nCh  = pctChange(nNow, nOld);
    if (Math.abs(nCh) >= 15) items.push({
      tone: nCh > 0 ? 'ok' : 'warn', ic: nCh > 0 ? '↑' : '↓',
      title: tr('newCust') + ' ' + (nCh > 0 ? tr('trendUp') : tr('trendDown')) + ' ' + ltr(Math.abs(nCh) + '%'),
      sub: tr('avgDaily') + ' ' + ltr(nNow.toFixed(1)) +
           ' <span style="color:var(--ink-3)">(' + ltr(nOld.toFixed(1)) + ')</span>',
      jump: "go('cust',0)"
    });

    box.innerHTML = card(tr('whatChanged'), tr('last7vs'), items.length
      ? items.map(function(i){
          return '<div class="row"' + (i.jump ? ' style="cursor:pointer" onclick="' + i.jump + '"' : '') + '>' +
            '<div style="display:flex;gap:12px;align-items:flex-start;min-width:0">' +
            '<span style="width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;' +
            'background:color-mix(in srgb,var(--' + i.tone + ') 15%,transparent);color:var(--' + i.tone + ');' +
            'font-size:15px;font-weight:800">' + i.ic + '</span>' +
            '<div class="row-main"><b style="white-space:normal">' + i.title + '</b><small>' + i.sub + '</small></div>' +
            '</div></div>';
        }).join('')
      : '<div class="state">' + tr('trendFlat') + '</div>');
  }).catch(function(e){ logErr(e); });
}

  }

function pRangeForSales(){return rangeParams('sales');}
function loadPeriodPL(params,box){
  var slot=document.getElementById('plBox'),r=params;
  var bounds=r.from&&r.to?{from:r.from,to:r.to}:clientDateRange(r.range||'today');
  if(!slot || !bounds)return;
  var months=[],cursor=bounds.from.slice(0,7);
  while(cursor<=bounds.to.slice(0,7)&&months.length<13){months.push(cursor);var date=new Date(cursor+'-01T12:00:00Z');date.setUTCMonth(date.getUTCMonth()+1);cursor=date.toISOString().slice(0,7);}
  slot.innerHTML='<div class="state">جارٍ تحميل الربح والخسارة لنفس الفترة…</div>';
  Promise.all(months.map(function(month){return homeProfitLoss(month);})).then(function(parts){
    if(document.getElementById('plBox')!==slot)return;
    if(parts.some(function(x){return !x || !x.ok || !Array.isArray(x.days);}))throw Error('pl');
    var days=[].concat.apply([],parts.map(function(x){return x.days;})).filter(function(x){return x.date>=bounds.from&&x.date<=bounds.to;});
    var incomplete=parts.some(function(x){return x.financial_schema!=='finance-review-v1'||x.expense_source_error||x.exp_stale||x.salary_conflict;})||days.some(function(x){return x.pending_expenses>0||x.net==null;});
    var sum=function(key){return days.reduce(function(t,x){return t+(Number(x[key])||0);},0);};
    slot.innerHTML=card(tr('pl'),esc(bounds.from+' — '+bounds.to),
      (incomplete?'<div class="state err">النتيجة قيد المراجعة: توجد مصروفات غير مطابقة أو بيانات غير مكتملة.</div>':'')+
      row(tr('totalProfit'),'',ltr(num(sum('profit'))))+row('المصروفات المفصلة','تشغيل ورواتب دون شراء المخزون',ltr(num(sum('expenses')-sum('pending_expenses'))))+row('فرق غير مفصّل','يحتاج مطابقة؛ ليس مصروفًا إضافيًا مؤكدًا',ltr(num(sum('pending_expenses'))))+
      row('مخصص الرواتب','يُراجع مع الرواتب المدفوعة',ltr(num(sum('salary_share'))))+
      row(tr('netProfit'),'',incomplete?'قيد المراجعة':ltr(num(sum('net')))));
  }).catch(function(){if(document.getElementById('plBox')===slot)slot.innerHTML='<div class="state err">تعذر تحميل الربح والخسارة لنفس الفترة</div>';});
}
function clientDateRange(range){
  var today=cairoNow().date,y=isoAdd(today,-1),first=today.slice(0,8)+'01';
  if(range==='today')return {from:today,to:today};
  if(range==='yesterday')return {from:y,to:y};
  if(range==='week')return {from:isoAdd(today,-6),to:today};
  if(range==='month')return {from:first,to:today};
  if(range==='lastMonth'){var end=isoAdd(first,-1);return {from:end.slice(0,8)+'01',to:end};}
  return null;
}

function drawExpenses(d, box){
