<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>جرد المخزون</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   جرد المخزون — مصمّم للموظف واقف قدام الرف.

   القيود اللي التصميم اتبنى عليها:
   ١) إيد ماسكة الموبايل والتانية ماسكة العلبة → كل الأزرار في
      التلت السفلي (منطقة الإبهام). فوق للعرض بس.
   ٢) الجرد إيقاع مش شاشات → الكاميرا متقفلش أبدًا. أي إدخال
      بيحصل في ورقة بتطلع فوقها والكاميرا شغالة وراها.
   ٣) الموظف مش بيبص على الشاشة → الصوت هو التغذية الراجعة
      الأساسية. نغمة مختلفة لكل حالة.
   ٤) الغلط لازم يترجع فورًا → زرار تراجع ظاهر طول الوقت.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#000; --panel:#16181C; --panel-2:#1F2329; --line:#2A2F36;
  --ink:#FFF; --ink-2:#A8B0BA; --ink-3:#6B7280;
  --brand:#2B9BE0; --ok:#35C08A; --warn:#E9A63F; --bad:#E85D67;
  --r:18px; --r-lg:24px;
  --t-sm:15px; --t-md:18px; --t-lg:22px; --t-xl:30px; --t-huge:52px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  font-size:var(--t-md);line-height:1.45;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* ═══ الشاشة الرئيسية (قبل الجرد) ═══ */
#home{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#home.on{display:flex}
.hhead{padding:calc(24px + env(safe-area-inset-top)) 20px 16px;text-align:center}
.hhead img{width:64px;height:64px;border-radius:16px;margin-bottom:10px}
.hhead h1{font-size:var(--t-lg);font-weight:700}
.hhead p{font-size:var(--t-sm);color:var(--ink-3);margin-top:2px}
.hbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 24px}

/* ═══ شاشة الجرد — الكاميرا دايمًا ═══ */
#scan{position:fixed;inset:0;display:none;background:#000}
#scan.on{display:block}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}

/* الإطار + التعتيم عنصر واحد — عشان ميفترقوش على مقاسات مختلفة */
.frame{position:absolute;top:34%;left:7%;right:7%;height:26vh;max-height:190px;
  transform:translateY(-50%);border:3px solid rgba(255,255,255,.95);border-radius:var(--r);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none;z-index:1}
.frame::after{content:'';position:absolute;top:50%;left:12px;right:12px;height:2px;
  background:rgba(255,70,70,.9);transform:translateY(-50%);
  box-shadow:0 0 10px rgba(255,70,70,.7)}

/* شريط علوي رفيع — تقدّم بس */
.bar{position:absolute;top:0;left:0;right:0;z-index:3;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(rgba(0,0,0,.85),transparent)}
.bar .who{flex:1;min-width:0;font-size:var(--t-sm);color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .num{font-size:var(--t-md);font-weight:700;
  padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.1)}
.bar .num:active{background:rgba(255,255,255,.2)}
.bar .num small{color:var(--ink-3);font-weight:400;font-size:13px}

/* بطاقة آخر صنف — في النص، للتأكيد البصري بس، مش بتتلمس */
.echo{position:absolute;left:16px;right:16px;bottom:38vh;z-index:2;
  background:rgba(20,22,26,.94);border-radius:var(--r-lg);padding:18px 20px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .18s;opacity:0;pointer-events:none}
.echo.show{opacity:1}
.echo .nm{font-size:var(--t-lg);font-weight:700;line-height:1.25}
.echo .meta{font-size:var(--t-sm);color:var(--ink-2);margin-top:6px}
.echo .big{font-size:var(--t-huge);font-weight:800;line-height:1;margin-top:10px;
  font-variant-numeric:tabular-nums}
.echo.miss{background:rgba(232,93,103,.92)}
.echo.miss .meta{color:rgba(255,255,255,.85)}

/* ═══ منطقة الإبهام — التلت السفلي ═══ */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.92) 22%)}
.dock .grid{display:flex;gap:10px}
.dock .grid button{flex:1}

.k{border-radius:var(--r);padding:20px 12px;font-size:var(--t-md);font-weight:700;
  background:rgba(31,35,41,.95);color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.k:active{transform:scale(.96)}
.k.wide{width:100%;margin-bottom:10px}
.k.undo{background:rgba(232,93,103,.22);color:#FF9AA2}
.k.done{background:var(--ok);color:#fff}
.k[disabled]{opacity:.35}
.k small{display:block;font-size:12px;font-weight:400;opacity:.7;margin-top:2px}

/* ═══ ورقة تطلع من تحت (بديل الشاشات) ═══ */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(0,0,0,.55)}
/* 60% بس — الكاميرا لازم تفضل بانة فوق عشان الموظف يشوف
   إنه لسه في وضع المسح ومحتاجش يخرج ويرجع */
.sheet .pan{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 20px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  max-height:62%;overflow-y:auto;animation:up .22s ease}
.sheet h2{font-size:var(--t-md)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:var(--t-lg);font-weight:700;margin-bottom:6px}
.sheet .hint{font-size:var(--t-sm);color:var(--ink-3);margin-bottom:16px}

/* ═══ صف الصلاحية ═══
   دي أدوية — كل علبة تتمسح لوحدها. مفيش كتابة أرقام من الدماغ.
   الجسم الكبير = +١ (لمسة واحدة، سهلة وهو ماسك علبة).
   الأزرار الصغيرة على الشمال بعيدة عنه عشان ميدوسش غلط. */
.exp{display:flex;align-items:stretch;gap:0;width:100%;
  background:var(--panel-2);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exp .main{flex:1;display:flex;align-items:center;gap:14px;
  padding:18px;text-align:right;min-width:0;background:none}
.exp .main:active{background:rgba(255,255,255,.07)}
.exp .l{flex:1;min-width:0}
.exp .l b{display:block;font-size:var(--t-lg);font-weight:700}
.exp .l small{display:block;color:var(--ink-3);font-size:var(--t-sm)}
.exp .q{font-size:var(--t-xl);font-weight:800;min-width:54px;text-align:center;
  font-variant-numeric:tabular-nums}
.exp.hit{background:var(--brand)}
.exp.hit .l small{color:rgba(255,255,255,.82)}

/* عمود جانبي: ناقص + تجزئة */
.exp .side{display:flex;flex-direction:column;flex:0 0 auto;
  border-inline-start:1px solid rgba(255,255,255,.1)}
.exp .side button{width:74px;flex:1;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--ink-2);background:rgba(255,255,255,.05)}
.exp .side button:first-child{border-bottom:1px solid rgba(255,255,255,.1)}
.exp .side button:active{background:rgba(255,255,255,.16)}
.exp .side .minus{font-size:30px;font-weight:400;line-height:1}
.exp.hit .side button{color:#fff;background:rgba(0,0,0,.16)}
.exp .side .part.on{color:var(--warn);background:rgba(233,166,63,.16)}

.fld{width:100%;padding:18px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:var(--t-lg);margin-bottom:12px;
  text-align:center;font-weight:700}
.fld:focus{outline:0;border-color:var(--brand)}
.lbl{font-size:var(--t-sm);color:var(--ink-3);font-weight:700;margin:16px 0 8px}
.pair{display:flex;gap:10px}
.pair .fld{margin:0}

/* ═══ أزرار عامة ═══ */
.btn{display:block;width:100%;border-radius:var(--r);padding:19px;
  font-size:var(--t-md);font-weight:700;background:var(--panel-2);
  color:var(--ink);margin-bottom:11px;text-align:center;line-height:1.35}
.btn.primary{background:var(--brand);color:#fff}
.btn.go{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn small{display:block;font-size:13px;font-weight:400;opacity:.78;margin-top:3px}
.btn.side{text-align:right}
.btn:active{transform:scale(.985)}

/* قايمة الموظفين — سطر لكل واحد بعرض الشاشة.
   الشرايح كانت بتتصف عشوائي (٢ فوق، ٢ نص، ١ لوحده) لأن الأسماء
   أطوال مختلفة. السطور مصفوفة دايمًا مهما طال الاسم.
   ومسبناهاش دروب داون لأنها ٣ لمسات بدل واحدة والاختيار بيختفي. */
.who-list{border-radius:var(--r);overflow:hidden;background:var(--panel);margin-bottom:20px}
.who-item{display:flex;align-items:center;gap:12px;width:100%;
  padding:18px 20px;font-size:var(--t-md);font-weight:600;text-align:right;
  border-bottom:1px solid var(--line)}
.who-item:last-child{border-bottom:0}
.who-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-item .ck{width:24px;flex:0 0 auto;font-size:19px;color:var(--brand);opacity:0}
.who-item.on{background:var(--brand);color:#fff}
.who-item.on .ck{opacity:1;color:#fff}
.who-item:active{background:var(--panel-2)}
.who-item.on:active{background:var(--brand)}

.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:var(--t-md);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--ink-3);font-size:var(--t-sm);margin-top:2px}
.tag{padding:8px 15px;border-radius:99px;font-size:var(--t-sm);font-weight:700;flex:0 0 auto}
.tag.ok{background:rgba(53,192,138,.16);color:var(--ok)}
.tag.warn{background:rgba(233,166,63,.16);color:var(--warn)}
.tag.bad{background:rgba(232,93,103,.16);color:var(--bad)}

.state{text-align:center;color:var(--ink-3);padding:28px 16px;line-height:1.6}
.state.err{color:var(--bad)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:99px;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* توست فوق كل حاجة */
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:95;background:rgba(20,22,26,.96);
  padding:14px 22px;border-radius:99px;font-size:var(--t-sm);font-weight:600;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- ═══ الشاشة الرئيسية ═══ -->
<div id="home" class="on">
  <div class="hhead">
    <img id="logo" alt="" style="display:none">
    <h1>جرد المخزون</h1>
    <p>صيدلية السوسي</p>
  </div>
  <div class="hbody" id="homeBody"></div>
</div>

<!-- ═══ شاشة الجرد ═══ -->
<div id="scan">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>

  <div class="bar">
    <div class="who" id="bWho"></div>
    <button class="num" id="bNum" onclick="openSession()">0<small>/0</small></button>
  </div>

  <div class="echo" id="echo"></div>

  <div class="dock">
    <button class="k wide undo" id="kUndo" onclick="undo()" disabled>تراجع عن آخر مسحة</button>
    <div class="grid">
      <button class="k" onclick="openFind()">بحث<small>بالاسم</small></button>
      <button class="k" onclick="openSession()">الجرد<small>شوف الكل</small></button>
      <button class="k done" onclick="askEnd()">خلّصت</button>
    </div>
  </div>
</div>

<!-- ═══ ورقة ═══ -->
<div class="sheet" id="sheet">
  <div class="veil" onclick="closeSheet()"></div>
  <div class="pan"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyETI5UTPwpMFOu-aWoKKHqyppa7ctTVJjckmbTxegDq7E3R3p6aEBzqt275HNL8SBfWg/exec';

var S = { id:null, title:'', by:'', lines:{}, order:[] };
var STAFF = [], TOTAL = 0, OPEN = [];
var reader = null, busy = false, lastCode = '', lastAt = 0;
var scans = 0, syncing = false, hist = [], echoTimer = null, last = null;

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n(v){ return '<span class="n">' +
  (Math.round((+v||0)*100)/100).toLocaleString('en-US') + '</span>'; }

/* ═══ الصوت هو التغذية الراجعة الأساسية ═══
   الموظف مش بيبص على الشاشة وهو بيمسح، فنغمة مختلفة لكل حالة
   بتوفّر عليه إنه يتأكد بعينه كل مرة. */
var AC = null;
function tone(freqs, dur){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    freqs.forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.frequency.value = f;
      var t0 = AC.currentTime + i * (dur || .09);
      g.gain.setValueAtTime(.001, t0);
      g.gain.exponentialRampToValueAtTime(.3, t0 + .01);
      g.gain.exponentialRampToValueAtTime(.001, t0 + (dur || .09));
      o.start(t0); o.stop(t0 + (dur || .09));
    });
  }catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
var SND = {
  ok:    function(){ tone([1050]); buzz(30); },              /* اتعدّ */
  again: function(){ tone([760, 1050]); buzz(30); },          /* عدّه قبل كده */
  ask:   function(){ tone([680, 900, 1150], .07); buzz(50); },/* محتاج اختيار */
  miss:  function(){ tone([300, 220], .13); buzz([70,60,70]); },
  undo:  function(){ tone([900, 560], .09); buzz(40); }
};

function api(a,p){
  var u = API + '?action=' + a;
  for (var k in (p||{})) if (p[k]!=null) u += '&'+k+'='+encodeURIComponent(p[k]);
  return fetch(u + '&_ts=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); });
}
function post(b){
  return fetch(API, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(b) }).then(function(r){ return r.json(); });
}

var toastT = null;
function toast(m){
  var t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

function openSheet(h){ $('sheetBody').innerHTML = h; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }

function save(){ try{ localStorage.setItem('scan_s', JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ var r = localStorage.getItem('scan_s');
  if (r){ var o = JSON.parse(r); if (o && o.id){ S = o; S.order = S.order||[]; return true; } }
}catch(e){} return false; }
function wipe(){ try{ localStorage.removeItem('scan_s'); }catch(e){} }

/* رفع كل 10 مسحات — لو الموبايل وقع تخسر 10 بالكتير */
function sync(force){
  if (!S.id || syncing) return;
  if (!force && (++scans % 10) !== 0) return;
  syncing = true;
  post({ action:'saveOpen', sessionId:S.id, title:S.title, by:S.by,
    lines: Object.keys(S.lines).map(function(k){ var L = S.lines[k];
      return {code:L.code,name:L.name,expire:L.expire,qty:L.qty,
              sys:L.sys,isNew:L.isNew,who:L.who||'',at:L.at||0}; }) })
  .then(function(){ syncing = false; }).catch(function(){ syncing = false; });
}

function ago(t){
  var ms = 0;
  if (typeof t === 'number' && isFinite(t) && t > 0) ms = t;
  else if (t){ var s = String(t).trim();
    ms = new Date(s.replace(' ','T')).getTime();
    if (!isFinite(ms)) ms = new Date(s).getTime(); }
  if (!isFinite(ms) || ms <= 0) return '';
  var m = Math.round((Date.now() - ms)/60000);
  if (m < 1) return 'دلوقتي';
  if (m < 60) return 'من ' + m + ' دقيقة';
  var h = Math.round(m/60);
  return h < 24 ? ('من ' + h + ' ساعة') : ('من ' + Math.round(h/24) + ' يوم');
}
function agoTxt(x){ var a = ago(x.updatedMs || x.updated); return a ? (' · ' + a) : ''; }

function monthTitle(){
  var M = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
           'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var d = new Date();
  return 'جرد ' + M[d.getMonth()] + ' ' + d.getFullYear();
}
function monthId(){ var d = new Date();
  return 'M' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2); }

/* ═══════════ الشاشة الرئيسية ═══════════ */
function goHome(){
  stopCam();
  $('scan').classList.remove('on');
  $('home').classList.add('on');
  $('homeBody').innerHTML = '<div class="state"><div class="spin"></div>بيحمّل…</div>';

  Promise.all([
    api('openCounts', S.by ? {by:S.by} : {}).catch(function(){ return null; }),
    STAFF.length ? {ok:true,staff:STAFF} : api('scanStaff').catch(function(){ return null; })
  ]).then(function(r){
    if (r[1] && r[1].ok) STAFF = r[1].staff || [];
    if (r[0] && r[0].ok) TOTAL = r[0].total || TOTAL;
    drawHome(r[0] && r[0].ok ? (r[0].open || []) : null);
  });
}

function drawHome(open){
  OPEN = open || [];
  var h = '<div class="lbl" style="margin-top:0">مين بيجرد؟</div>' +
    '<div class="who-list" id="who">' +
      STAFF.map(function(s){
        return '<button class="who-item' + (S.by===s.name?' on':'') + '" data-nm="' +
          esc(s.name) + '" onclick="pickWho(this)">' +
          '<span class="nm">' + esc(s.name) + '</span><span class="ck">✓</span></button>';
      }).join('') +
    '</div>';

  var cur = OPEN.filter(function(x){ return x.id === monthId(); })[0];

  if (cur){
    var pct = TOTAL ? Math.round(cur.lines/TOTAL*100) : 0;
    h += '<button class="btn primary" onclick="resume(\'' + esc(cur.id) + '\')">' +
      esc(cur.title) + '<small>' + cur.lines + ' من ' + n(TOTAL) + ' صنف · ' +
      pct + '٪' + agoTxt(cur) + '</small></button>' + recent(cur);
  } else if (open === null && S.id && Object.keys(S.lines).length){
    h += '<button class="btn primary" onclick="enterScan()">' + esc(S.title) +
      '<small>' + Object.keys(S.lines).length + ' صنف · النت مش راضي</small></button>';
  } else {
    h += '<button class="btn primary" onclick="startNew()">ابدأ ' + monthTitle() + '</button>';
  }

  var old_ = OPEN.filter(function(x){ return x.id !== monthId(); });
  if (old_.length){
    h += '<div class="lbl">شهور فاتت لسه مفتوحة</div>';
    h += old_.map(function(x){
      return '<div style="display:flex;gap:9px;margin-bottom:11px">' +
        '<button class="btn side" style="margin:0;flex:1" onclick="resume(\'' + esc(x.id) +
        '\')">' + esc(x.title) + '<small>' + x.lines + ' صنف' + agoTxt(x) + '</small></button>' +
        '<button class="btn" style="margin:0;width:62px;padding:0;font-size:21px" onclick="askDrop(\'' +
        esc(x.id) + '\',\'' + esc(String(x.title||'').replace(/'/g,'')) + '\')">🗑</button></div>';
    }).join('');
  }
  $('homeBody').innerHTML = h;
}

function recent(x){
  var list = (S.by && x.mine && x.mine.length) ? x.mine : (x.recent||[]);
  if (!list.length) return '';
  return '<div class="lbl">' +
    ((S.by && x.mine && x.mine.length) ? 'آخر اللي عدّيته' : 'آخر اللي اتعدّ') + '</div>' +
    list.map(function(L){
      return '<div class="row"><div class="m"><b>' + esc(L.name) + '</b><small>' +
        (L.expire?esc(L.expire)+' · ':'') + 'عدّ ' + n(L.qty) +
        (ago(L.at) ? ' · ' + ago(L.at) : '') + '</small></div></div>';
    }).join('');
}

function pickWho(el){
  var a = document.querySelectorAll('#who .who-item');
  for (var i=0;i<a.length;i++) a[i].classList.remove('on');
  el.classList.add('on');
  S.by = el.dataset.nm; save();
  api('openCounts',{by:S.by}).then(function(d){
    if (d && d.ok){ TOTAL = d.total||TOTAL; drawHome(d.open||[]); }
  }).catch(function(){});
}

function startNew(){
  if (!S.by){ toast('اختار اسمك الأول'); return; }
  S = { id:monthId(), title:monthTitle(), by:S.by, lines:{}, order:[] };
  hist = []; save(); enterScan();
}

function resume(id){
  if (!S.by){ toast('اختار اسمك الأول'); return; }
  var me = S.by;
  $('homeBody').innerHTML = '<div class="state"><div class="spin"></div>بيفتح…</div>';
  api('loadCount',{session:id}).then(function(d){
    if (!d || !d.ok){ toast('مقدرتش أفتحه'); goHome(); return; }
    S = { id:d.sessionId, title:d.title, by:me, lines:{}, order:[] };
    (d.lines||[]).forEach(function(L){
      var k = L.code+'|'+(L.expire||'');
      S.lines[k] = { code:L.code, name:L.name||'', expire:L.expire||'',
        qty:+L.qty||0, sys:+L.sys||0, isNew:!!L.isNew, who:L.who||'', at:L.at||0 };
      S.order.push(k);
    });
    hist = []; save(); enterScan();
  }).catch(function(){ toast('النت مش راضي'); goHome(); });
}

/* ═══════════ شاشة الجرد ═══════════ */
function enterScan(){
  $('home').classList.remove('on');
  $('scan').classList.add('on');
  $('bWho').textContent = S.by || '';
  refreshBar();
  startCam();
}

function refreshBar(){
  var u = {};
  Object.keys(S.lines).forEach(function(k){ u[S.lines[k].code] = 1; });
  $('bNum').innerHTML = Object.keys(u).length +
    (TOTAL ? '<small>/' + TOTAL + '</small>' : '');
  $('kUndo').disabled = !hist.length;
}

/* البطاقة دي للتأكيد البصري بس — بتختفي لوحدها عشان متغطيش الكاميرا */
function showEcho(html, miss){
  var e = $('echo');
  e.className = 'echo show' + (miss ? ' miss' : '');
  e.innerHTML = html;
  clearTimeout(echoTimer);
  echoTimer = setTimeout(function(){ e.classList.remove('show'); }, 2600);
}

/* ═══ العدّ ═══ */
function put(code, name, expire, qty, sys, isNew, track){
  var k = code + '|' + (expire||'');
  if (track !== false){
    var before = S.lines[k] ? JSON.parse(JSON.stringify(S.lines[k])) : null;
    hist.push({ k:k, before:before });
    if (hist.length > 40) hist.shift();
  }
  if (qty <= 0){ delete S.lines[k]; S.order = S.order.filter(function(x){ return x!==k; }); }
  else {
    S.lines[k] = { code:code, name:name, expire:expire||'', qty:qty, sys:sys||0,
                   isNew:!!isNew, who:S.by||'', at:Date.now() };
    S.order = S.order.filter(function(x){ return x!==k; });
    S.order.push(k);
  }
  save(); sync(); refreshBar();
}

/* التراجع — أهم زرار في الشاشة. الغلط بيحصل كتير والرجوع لازم يبقى فوري */
function undo(){
  var h = hist.pop();
  if (!h){ return; }
  if (h.before) S.lines[h.k] = h.before;
  else { delete S.lines[h.k]; S.order = S.order.filter(function(x){ return x!==h.k; }); }
  save(); sync(); refreshBar();
  SND.undo();
  var nm = h.before ? h.before.name : '';
  showEcho('<div class="nm">اترجع</div><div class="meta">' +
    (nm ? esc(nm) : 'آخر مسحة اتلغت') + '</div>');
}

/* ═══ الكاميرا — متقفلش أبدًا أثناء الجرد ═══ */
function startCam(){
  if (reader) return;
  if (!window.ZXing){ toast('مكتبة القراءة متحمّلتش'); return; }
  try{
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
       ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
       ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.UPC_A]);
    reader = new ZXing.BrowserMultiFormatReader(hints, 180);
    reader.decodeFromConstraints({ video:{ facingMode:{ideal:'environment'} } },
      'video', function(res){ if (res) onScan(res.getText()); })
    .catch(function(e){ toast('الكاميرا مش راضية تفتح'); reader = null; });
  }catch(e){ toast(e.message); reader = null; }
}
function stopCam(){
  try{ reader && reader.reset(); }catch(e){}
  reader = null;
}

function onScan(text){
  var code = String(text||'').replace(/\D/g,'');
  if (!code) return;
  var now = Date.now();
  /* نفس الباركود خلال ثانية = ارتجاجة مش مسحة جديدة */
  if (code === lastCode && now - lastAt < 1000) return;
  lastCode = code; lastAt = now;
  if (busy) return;
  busy = true;

  api('scanLookup',{code:code}).then(function(d){
    busy = false;
    if (!d || !d.ok || !d.found){
      SND.miss();
      showEcho('<div class="nm">مش موجود</div><div class="meta">كود ' + esc(code) + '</div>', true);
      return;
    }
    var it = d.item; last = it;

    /* ⚠️ كل مسحة توقف — حتى لو السيستم شايف صلاحية واحدة.
       "صلاحية واحدة في السيستم" مش معناها إن الرف فيه واحدة. لو
       عدّينا بسرعة، الدفعة المش مسجلة مش هتتكتشف أبدًا — وهي أهم
       حاجة الجرد المفروض يلاقيها. الورقة بتطلع فوق الكاميرا وهي شغالة. */
    SND.ask();
    openBatches(it);
  }).catch(function(){
    busy = false; SND.miss();
    showEcho('<div class="nm">النت</div><div class="meta">مش راضي — جرب تاني</div>', true);
  });
}

/* ═══ ورقة الصلاحيات — لمسة واحدة لكل دفعة ═══ */
function allBatches(it){
  var all = it.batches.slice();
  Object.keys(S.lines).forEach(function(k){ var L = S.lines[k];
    if (L.code !== it.code) return;
    if (!all.some(function(b){ return (b.expire||'') === (L.expire||''); }))
      all.push({ expire:L.expire, stock:0, added:true }); });
  return all;
}

function openBatches(it){
  var all = allBatches(it);
  var u = it.units || 1;
  openSheet('<h2>' + esc(it.name) + '</h2>' +
    '<div class="hint">دوس على صلاحية العلبة اللي في إيدك' +
      (u > 1 ? (' · العلبة ' + n(u) + ' ' + partWord(it)) : '') + '</div>' +
    all.map(function(b){
      var ex = b.expire || '';
      var k = it.code + '|' + ex;
      var L = S.lines[k];
      var q = L ? L.qty : 0;
      var partial = (q % 1) !== 0;   /* فيه كسر = علبة مفتوحة متسجلة */
      return '<div class="exp' + (q?' hit':'') + '">' +
        '<button class="main" onclick="tapBatch(\'' + esc(ex) + '\',' + (b.stock||0) + ')">' +
          '<span class="q">' + n(q) + '</span>' +
          '<span class="l"><b>' + esc(b.expire || 'من غير صلاحية') + '</b>' +
          '<small>' + (b.added ? 'مش في السيستم' : 'السيستم ' + human(b.stock, it)) +
          (partial ? ' · عدّيت ' + human(q, it) : '') +
          '</small></span></button>' +
        '<span class="side">' +
          '<button class="minus" onclick="tapMinus(\'' + esc(ex) + '\',' + (b.stock||0) +
            ')" aria-label="ناقص">−</button>' +
          (u > 1 ? '<button class="part' + (partial?' on':'') + '" onclick="openPartial(\'' +
            esc(ex) + '\',' + (b.stock||0) + ')">جزئي</button>' : '') +
        '</span></div>';
    }).join('') +
    '<button class="btn" onclick="openAddExp()">+ صلاحية تانية على الرف</button>' +
    '<button class="btn primary" onclick="closeSheet()">تمام</button>');
}

function tapBatch(expire, sys){
  if (!last) return;
  var k = last.code + '|' + expire;
  var q = (S.lines[k] ? S.lines[k].qty : 0) + 1;
  var known = last.batches.some(function(b){ return (b.expire||'') === expire; });
  put(last.code, last.name, expire, q, sys, !known);
  SND.ok();
  openBatches(last);
}

function tapMinus(expire, sys){
  if (!last) return;
  var k = last.code + '|' + expire;
  var cur = S.lines[k] ? S.lines[k].qty : 0;
  if (cur <= 0) return;
  /* لو فيه كسر (علبة مفتوحة)، بنشيل الكسر الأول مش علبة كاملة */
  var next = (cur % 1) !== 0 ? Math.floor(cur) : cur - 1;
  var known = last.batches.some(function(b){ return (b.expire||'') === expire; });
  put(last.code, last.name, expire, next, sys, !known);
  SND.undo();
  openBatches(last);
}

/* ═══ العلبة المفتوحة ═══
   مش هينفع تتمسح، فبتتكتب بالجزء (شرايط/أكياس) والنظام بيحوّل لعلبة.
   العلب الكاملة بتفضل زي ما هي — دي بتضيف الكسر بس. */
function openPartial(expire, sys){
  if (!last) return;
  var it = last, u = it.units || 1, w = partWord(it);
  var k = it.code + '|' + expire;
  var cur = S.lines[k] ? S.lines[k].qty : 0;
  var full = Math.floor(cur);
  var parts = Math.round((cur - full) * u);

  openSheet('<h2>علبة مفتوحة</h2>' +
    '<div class="hint">' + esc(it.name) + ' · ' +
      (expire ? esc(expire) : 'من غير صلاحية') +
      '<br>العلبة الكاملة ' + n(u) + ' ' + w +
      ' · السيستم ' + human(sys, it) + '</div>' +
    '<div class="lbl" style="margin-top:0">العلب الكاملة اللي مسحتها</div>' +
    '<input class="fld" id="pB" type="number" inputmode="numeric" min="0" value="' +
      full + '" oninput="prevPartial()">' +
    '<div class="lbl">' + w + ' من العلبة المفتوحة</div>' +
    '<input class="fld" id="pU" type="number" inputmode="numeric" min="0" max="' + (u-1) +
      '" value="' + parts + '" oninput="prevPartial()">' +
    '<div class="hint" id="pOut" style="text-align:center"></div>' +
    '<button class="btn primary" onclick="applyPartial(\'' + esc(expire) + '\',' + sys +
      ')">سجّل</button>' +
    '<button class="btn" onclick="openBatches(last)">رجوع</button>');
  prevPartial();
}
function prevPartial(){
  if (!last) return;
  var u = last.units || 1;
  var b = parseFloat(($('pB')||{}).value) || 0;
  var p = parseFloat(($('pU')||{}).value) || 0;
  var el = $('pOut'); if (!el) return;
  el.innerHTML = 'الإجمالي: <b style="color:var(--ink)">' +
    human(b + p/u, last) + '</b>';
}
function applyPartial(expire, sys){
  if (!last) return;
  var u = last.units || 1;
  var b = parseFloat($('pB').value) || 0;
  var p = parseFloat($('pU').value) || 0;
  var qty = Math.round((b + p/u) * 10000) / 10000;
  var known = last.batches.some(function(x){ return (x.expire||'') === expire; });
  put(last.code, last.name, expire, qty, sys, !known);
  SND.ok();
  openBatches(last);
}

/* ═══ قايمة اللي اتعدّ في الجلسة دي ═══
   الموظف كان بيمسح والعداد بيزيد بس — مش شايف اللي عدّه.
   فلو شك إنه عدّ صنف قبل كده، أو عايز يعدّل حاجة من ١٠ دقايق،
   مكانش فيه طريقة. القايمة دي بترتيب عكسي (الأحدث فوق) وكل
   سطر بيفتح ورقة الصنف للتعديل. */
function openSession(){
  var keys = (S.order||[]).slice().reverse();
  if (!keys.length){
    openSheet('<h2>الجرد</h2><div class="state">لسه مفيش حاجة اتعدّت</div>' +
      '<button class="btn primary" onclick="closeSheet()">تمام</button>');
    return;
  }
  var u = {}, units = 0, diffs = 0;
  keys.forEach(function(k){ var L = S.lines[k];
    if (!L) return;
    u[L.code] = 1; units += L.qty;
    if (Math.abs(L.qty - L.sys) > .001) diffs++; });

  openSheet('<h2>' + esc(S.title) + '</h2>' +
    '<div class="hint">' + Object.keys(u).length + ' صنف · ' +
      n(Math.round(units*100)/100) + ' علبة · ' + diffs + ' فيهم فرق</div>' +
    '<input class="fld" id="sQ" placeholder="دوّر في اللي اتعدّ" oninput="filterSession()" ' +
      'style="text-align:right;font-weight:400;font-size:var(--t-md)">' +
    '<div id="sList">' + sessionRows(keys) + '</div>' +
    '<button class="btn primary" onclick="closeSheet()">تمام</button>');
}

function sessionRows(keys){
  return keys.map(function(k){
    var L = S.lines[k]; if (!L) return '';
    var d = L.qty - L.sys;
    var cls = Math.abs(d) < .001 ? 'ok' : (d > 0 ? 'warn' : 'bad');
    var it = { units: (last && last.code === L.code) ? last.units : 1, name: L.name };
    return '<div class="row" onclick="editFromSession(\'' + esc(L.code) + '\')">' +
      '<div class="m"><b>' + esc(L.name) + '</b><small>' +
      (L.expire ? esc(L.expire) + ' · ' : '') +
      'السيستم ' + n(L.sys) + (L.isNew ? ' · صلاحية زيادة' : '') +
      '</small></div><span class="tag ' + cls + '">' + n(L.qty) + '</span></div>';
  }).join('');
}

function filterSession(){
  var q = (($('sQ')||{}).value || '').trim();
  var keys = (S.order||[]).slice().reverse();
  if (q) keys = keys.filter(function(k){
    var L = S.lines[k];
    return L && (L.name.indexOf(q) !== -1 || L.code.indexOf(q) !== -1);
  });
  var el = $('sList'); if (!el) return;
  el.innerHTML = keys.length ? sessionRows(keys) :
    '<div class="state">مفيش نتايج</div>';
}

/* تعديل صنف من القايمة — بنجيب بياناته من السيرفر عشان الدفعات
   تبقى كاملة، مش اللي اتعدّ بس */
function editFromSession(code){
  closeSheet();
  api('scanLookup', { code: code }).then(function(d){
    if (d && d.ok && d.found){ last = d.item; openBatches(d.item); }
    else toast('مقدرتش أفتحه');
  }).catch(function(){ toast('النت مش راضي'); });
}

/* رجوع لآخر صنف اتمسح — لو قفل الورقة وعايز يعدّل */
function reopenLast(){
  if (!last){ toast('امسح صنف الأول'); return; }
  openBatches(last);
}

/* ═══ (متسابة للتوافق) ═══ */
function openManual(){
  if (!last){ toast('امسح صنف الأول'); return; }
  var it = last, u = it.units || 1;
  var all = allBatches(it);
  var opts = all.map(function(b){
    return '<option value="' + esc(b.expire||'') + '">' +
      (b.expire ? esc(b.expire) : 'من غير صلاحية') + '</option>'; }).join('');

  openSheet('<h2>' + esc(it.name) + '</h2>' +
    '<div class="hint">' + (u > 1 ? ('العلبة الكاملة ' + n(u) + ' ' + partWord(it)) :
      'اكتب العدد اللي عدّيته') + '</div>' +
    (all.length > 1 ? '<div class="lbl" style="margin-top:0">الصلاحية</div>' +
      '<select class="fld" id="mE">' + opts + '</select>' :
      '<input type="hidden" id="mE" value="' + esc((all[0]||{}).expire||'') + '">') +
    '<div class="lbl">علب كاملة</div>' +
    '<input class="fld" id="mB" type="number" inputmode="numeric" min="0" value="0">' +
    (u > 1 ? '<div class="lbl">' + partWord(it) + ' زيادة (من علبة مفتوحة)</div>' +
      '<input class="fld" id="mU" type="number" inputmode="numeric" min="0" max="' + (u-1) +
      '" value="0" oninput="prevManual()">' : '<input type="hidden" id="mU" value="0">') +
    '<div class="hint" id="mOut" style="text-align:center"></div>' +
    '<button class="btn primary" onclick="applyManual()">سجّل</button>' +
    '<button class="btn" onclick="closeSheet()">إلغاء</button>');
  prevManual();
}
function partWord(it){
  var nm = it.name || '';
  if (/كيس|اكياس|أكياس/.test(nm)) return 'كيس';
  if (/امبول|أمبول/.test(nm))     return 'أمبول';
  if (/لبوس|اقماع/.test(nm))      return 'لبوسة';
  return 'شريط';
}

/* "0.5" مش لغة الموظف وهو واقف قدام الرف.
   بنترجمها لـ"شريط واحد" أو "علبة و٣ شرايط". */
function human(q, it){
  var u = (it && it.units) || 1;
  q = Math.round((+q||0) * 10000) / 10000;
  if (q === 0) return 'صفر';
  if (u <= 1) return n(q) + ' علبة';
  var full = Math.floor(q);
  var part = Math.round((q - full) * u);
  var w = partWord(it);
  if (!part) return n(full) + ' علبة';
  if (!full) return n(part) + ' ' + w;
  return n(full) + ' علبة و' + n(part) + ' ' + w;
}
function prevManual(){
  if (!last) return;
  var u = last.units || 1;
  var b = parseFloat(($('mB')||{}).value) || 0;
  var p = parseFloat(($('mU')||{}).value) || 0;
  var el = $('mOut'); if (!el) return;
  el.innerHTML = u > 1 ? ('الإجمالي: <b style="color:var(--ink)">' +
    n(Math.round((b + p/u)*100)/100) + '</b> علبة') : '';
}
function applyManual(){
  if (!last){ closeSheet(); return; }
  var u = last.units || 1;
  var b = parseFloat($('mB').value) || 0;
  var p = parseFloat($('mU').value) || 0;
  var qty = Math.round((b + p/u) * 10000) / 10000;
  var ex = $('mE').value || '';
  var known = last.batches.filter(function(x){ return (x.expire||'') === ex; })[0];
  put(last.code, last.name, ex, qty, known ? known.stock : 0, !known);
  SND.ok(); closeSheet();
  showEcho('<div class="nm">' + esc(last.name) + '</div>' +
    '<div class="meta">' + (ex?esc(ex):'من غير صلاحية') + '</div>' +
    '<div class="big">' + n(qty) + '</div>');
}

function openAddExp(){
  if (!last) return;
  var y = new Date().getFullYear(), ys = '';
  for (var i=0;i<7;i++) ys += '<option value="'+(y+i)+'">'+(y+i)+'</option>';
  var ms = '';
  for (var m=1;m<=12;m++){ var v = ('0'+m).slice(-2); ms += '<option value="'+v+'">'+v+'</option>'; }
  openSheet('<h2>صلاحية تانية</h2>' +
    '<div class="hint">' + esc(last.name) + '</div>' +
    '<div class="lbl" style="margin-top:0">المكتوب على العلبة</div>' +
    '<div class="pair"><select class="fld" id="aM">' + ms + '</select>' +
      '<select class="fld" id="aY">' + ys + '</select></div>' +
    '<div class="lbl">عدّيت كام؟</div>' +
    '<input class="fld" id="aQ" type="number" inputmode="decimal" min="0" value="1">' +
    '<button class="btn primary" onclick="applyAddExp()">ضيف</button>' +
    '<button class="btn" onclick="openBatches(last)">رجوع</button>');
}
function applyAddExp(){
  if (!last){ closeSheet(); return; }
  var q = parseFloat($('aQ').value) || 0;
  if (q <= 0){ closeSheet(); return; }
  var full = $('aY').value + '-' + $('aM').value + '-01';
  var known = last.batches.filter(function(b){ return b.expire === full; })[0];
  put(last.code, last.name, full, q, known ? known.stock : 0, !known);
  SND.ok(); closeSheet();
  showEcho('<div class="nm">' + esc(last.name) + '</div>' +
    '<div class="meta">' + esc(full) + ' · صلاحية جديدة</div>' +
    '<div class="big">' + n(q) + '</div>');
}

/* ═══ بحث ═══ */
function openFind(){
  openSheet('<h2>بحث</h2>' +
    '<input class="fld" id="fQ" placeholder="اسم الصنف أو الكود" ' +
      'style="text-align:right;font-weight:400" autocomplete="off">' +
    '<button class="btn primary" onclick="doFind()">دوّر</button>' +
    '<div id="fRes"></div>');
  setTimeout(function(){ var e = $('fQ'); e && e.focus(); }, 260);
}
function doFind(){
  var q = ($('fQ').value||'').trim(); if (!q) return;
  $('fRes').innerHTML = '<div class="state"><div class="spin"></div></div>';
  if (/^\d{6,14}$/.test(q)){
    api('scanLookup',{code:q}).then(function(d){
      if (d && d.ok && d.found){ last = d.item; closeSheet(); pickAfterFind(d.item); }
      else $('fRes').innerHTML = '<div class="state err">الكود مش موجود</div>';
    });
    return;
  }
  api('scanSearch',{q:q}).then(function(d){
    var r = (d && d.results) || [];
    if (!r.length){ $('fRes').innerHTML = '<div class="state">مفيش نتايج</div>'; return; }
    window.__f = r;
    $('fRes').innerHTML = r.slice(0,12).map(function(x,i){
      return '<div class="row" onclick="chooseFind(' + i + ')"><div class="m"><b>' +
        esc(x.name) + '</b><small>رصيد ' + n(x.stock) + '</small></div></div>'; }).join('');
  });
}
function chooseFind(i){
  var r = window.__f || []; if (!r[i]) return;
  last = r[i]; closeSheet(); pickAfterFind(r[i]);
}
function pickAfterFind(it){ openBatches(it); }

/* ═══ الإنهاء والمسح ═══ */
function askEnd(){
  var k = Object.keys(S.lines).length;
  if (!k){ toast('الجرد فاضي'); return; }
  sync(true);
  openSheet('<h2>خلّصت؟</h2>' +
    '<div class="hint">' + k + ' سطر. الجرد بيطلع تقرير بس ومش بيغيّر المخزون.</div>' +
    '<button class="btn go" onclick="doEnd()">اقفل واحفظ</button>' +
    '<button class="btn" onclick="closeSheet();goHome()">سيبه مفتوح</button>' +
    '<button class="btn" onclick="closeSheet()">كمّل الجرد</button>');
}

function doEnd(){
  closeSheet(); stopCam();
  var keys = Object.keys(S.lines);
  $('scan').classList.remove('on');
  $('home').classList.add('on');
  $('homeBody').innerHTML = '<div class="state"><div class="spin"></div>بيحفظ…</div>';
  post({ action:'saveCount', sessionId:S.id, title:S.title, by:S.by,
    lines: keys.map(function(k){ var L = S.lines[k];
      return {code:L.code, expire:L.expire, qty:L.qty, isNewBatch:L.isNew}; }) })
  .then(function(d){
    if (!d || !d.ok) throw new Error((d && d.error) || 'فشل');
    wipe(); var me = S.by;
    S = { id:null, title:'', by:me, lines:{}, order:[] }; hist = [];
    $('homeBody').innerHTML =
      '<div class="state" style="color:var(--ok);font-size:22px;font-weight:700">الجرد اتحفظ</div>' +
      '<div class="row"><div class="m"><b>الأصناف</b></div><span class="tag ok">' +
        n(d.lines) + '</span></div>' +
      '<div class="row"><div class="m"><b>فيها فرق</b></div><span class="tag ' +
        (d.diffCount?'warn':'ok') + '">' + n(d.diffCount) + '</span></div>' +
      '<button class="btn primary" style="margin-top:20px" onclick="goHome()">تمام</button>';
  }).catch(function(e){
    $('homeBody').innerHTML = '<div class="state err">الحفظ فشل<br>' + esc(e.message) +
      '<br><br>الشغل لسه محفوظ. جرب تاني.</div>' +
      '<button class="btn primary" onclick="doEnd()">حاول تاني</button>' +
      '<button class="btn" onclick="enterScan()">ارجع للجرد</button>';
  });
}

function askDrop(id, title){
  openSheet('<h2>تمسح الجرد؟</h2>' +
    '<div class="hint">' + esc(title) + ' — مفيش رجوع.</div>' +
    '<button class="btn danger" onclick="doDrop(\'' + esc(id) + '\')">امسح</button>' +
    '<button class="btn" onclick="closeSheet()">إلغاء</button>');
}
function doDrop(id){
  closeSheet();
  $('homeBody').innerHTML = '<div class="state"><div class="spin"></div>بيمسح…</div>';
  post({ action:'deleteCount', sessionId:id, confirm:'DELETE' }).then(function(){
    if (S.id === id){ wipe(); S = {id:null,title:'',by:S.by,lines:{},order:[]}; }
    goHome();
  }).catch(function(){ toast('النت مش راضي'); goHome(); });
}

/* ═══ التشغيل ═══ */
(function(){
  /* اللوجو من الداشبورد لو موجود — ملف منفصل عشان ميكبّرش الصفحة */
  var img = $('logo');
  img.onload = function(){ img.style.display = 'inline-block'; };
  img.onerror = function(){};
  img.src = 'logo.png';
})();

loadLocal();
goHome();
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', function(){
  if (document.hidden){
    if (S.id && Object.keys(S.lines).length) sync(true);
    stopCam();
  } else if ($('scan').classList.contains('on')) {
    startCam();
  }
});
</script>
</body>
</html>
