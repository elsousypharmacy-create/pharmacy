<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صيدلية السوسي — طلب النواقص</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#12302b;--mut:#6b7f7a;--line:#e1e9e7;--soft:#f4f7f6;--brand:#0f7a6b;--bad:#c0392b;--badbg:#fbe9e6;--low:#b7791f;--lowbg:#fdf3df;--ok:#13894f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
header img{width:44px;height:44px;border-radius:10px;background:#fff}
header h1{font-size:18px;margin:0}header small{display:block;color:var(--mut);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
input,select{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);outline:none}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
button.q{background:var(--soft);color:var(--brand);border:1px solid var(--line)}
.gate{margin-top:30px;text-align:center}.gate p{color:var(--mut);margin:0 0 12px}.gate input{text-align:center;letter-spacing:2px;margin-bottom:10px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.tabs{display:flex;gap:8px;margin:0 0 10px}.tabs button{flex:1;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabs button.on.z{background:var(--bad);border-color:var(--bad)}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools select{font-size:14px;padding:9px 10px;width:auto}.tools button{flex:1;font-size:14px;padding:9px}
.co{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer}
.ch b{font-size:16px}.ch small{color:var(--mut);display:block;font-size:12px}.arw{opacity:.4;transition:.2s}.co.open .arw{transform:rotate(-90deg)}
.cb{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}.co.open .cb{display:block}
.acts{display:flex;gap:8px;margin:8px 0}.acts button{flex:1;font-size:14px;padding:9px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.it .n{flex:1;font-size:14px;font-weight:600}.it.done .n{text-decoration:line-through;color:var(--mut)}
.it .c{font-size:12px;color:var(--mut)}
.it .n{cursor:pointer}.it .nm{display:block}.it .n .c{display:block}.it .n:active{opacity:.55}
.st{color:var(--ink);font-weight:700}.st.z{color:var(--bad)}
.qty{font-weight:700;background:var(--soft);border-radius:8px;padding:3px 10px;min-width:42px;text-align:center}
.vals{display:flex;gap:8px;margin:0 0 12px}.vals div{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.vals small{display:block;color:var(--mut);font-size:12px}.vals b{font-size:17px;color:var(--brand)}
.lost{background:var(--badbg);border:1px solid #f0c9c3;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.lost b{color:var(--bad)}.lost small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.score{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.score .pct{font-size:26px;font-weight:700;min-width:84px;text-align:center}
.score small{display:block;color:var(--mut);font-size:12px}
.rk{font-size:12px;color:var(--bad);font-weight:600;white-space:nowrap}
.vn{color:var(--mut);font-size:12px;margin:-6px 4px 10px}
.state{text-align:center;color:var(--mut);padding:28px 10px}.meta{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#12302b;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:9}
.lnk{background:none;color:var(--mut);font-size:12px;font-weight:400;padding:6px;margin-top:14px}
</style>
</head>

  <div id="app">
    <div class="tabs">
      <button id="t-zero" class="z on" onclick="setSec('zero')"></button>
      <button id="t-low" onclick="setSec('low')"></button>

        <option value="3">آخر 3 أيام</option><option value="7" selected>آخر 7 أيام</option>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyETI5UTPwpMFOu-aWoKKHqyppa7ctTVJjckmbTxegDq7E3R3p6aEBzqt275HNL8SBfWg/exec';
var DATA = null, SEC = 'zero', OPEN = {}, DONE = {};
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function today(){ return new Date().toLocaleDateString('en-CA'); }
function toast(m){ var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.style.display = 'none'; }, 1800); }

function loadDone(){ try { var o = JSON.parse(lsGet('ordDone') || '{}'); DONE = (o.d === today()) ? (o.m || {}) : {}; } catch(e){ DONE = {}; } }
function saveDone(){ lsSet('ordDone', JSON.stringify({ d: today(), m: DONE })); }

function call(k, days){
  return fetch(API + '?action=ordersPage&days=' + days + '&_=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); });
}
function load(force){
  $('list').innerHTML = '<div class="state">بجيب النواقص…</div>';
  call('', $('days').value).then(function(d){
    if (d && d.ok) accept(d);
    else $('list').innerHTML = '<div class="state">' + esc((d && d.msg) || 'حصلت مشكلة، حاول تاني') + '</div>';
  }).catch(function(){ $('list').innerHTML = '<div class="state">النت مش راضي</div>'; });
}
/* بنعيد التجميع بالقسم (أدوية/تجميل/مستلزمات…) بدل الشركة — واسم الشركة بيفضل تحت كل صنف */
function regroup(d){
  ['zero', 'low'].forEach(function(sec){
    var by = {};
    (d[sec] || []).forEach(function(c){
      c.items.forEach(function(it){
        var cat = it.c || 'أخرى';
        (by[cat] = by[cat] || []).push({ n: it.n, q: it.q, c: c.co, p: it.p, k: it.k, e: it.e, u: it.u, v: it.v, h: it.h, s: it.s });
      });
    });
    d[sec] = Object.keys(by).map(function(cat){
      by[cat].sort(function(a, b){ return (b.v || 0) - (a.v || 0) || (a.c < b.c ? -1 : a.c > b.c ? 1 : (a.n < b.n ? -1 : 1)); });
      return { co: cat, items: by[cat] };
    }).sort(function(a, b){
      var va = a.items.reduce(function(s, x){ return s + (x.v || 0); }, 0), vb = b.items.reduce(function(s, x){ return s + (x.v || 0); }, 0);
      return vb - va || b.items.length - a.items.length;
    });
  });
  return d;
}
function accept(d){ DATA = regroup(d); $('days').value = d.days; draw(); }

function money(n){ return Math.round(n).toLocaleString('en-US'); }
function val(items){
  var r = { k: 0, p: 0, est: 0, miss: 0 };
  items.forEach(function(it){
    if (it.p == null && it.k == null){ r.miss++; return; }
    r.p += (it.p || 0) * it.q; r.k += (it.k || 0) * it.q; if (it.e) r.est++;
  });
  return r;
}
function allItems(){ var a = []; (DATA[SEC] || []).forEach(function(c){ a = a.concat(c.items); }); return a; }
function cnt(sec){ return (DATA[sec] || []).reduce(function(a, c){ return a + c.items.length; }, 0); }
function setSec(s){ SEC = s; draw(); }
function key(co, n){ return SEC + '|' + co + '|' + n; }

function draw(){
  if (!DATA) return;
  $('t-zero').textContent = '🔴 خلص خالص (' + cnt('zero') + ')';
  $('t-low').textContent = '🟡 قرب يخلص (' + cnt('low') + ')';
  $('t-zero').className = 'z' + (SEC === 'zero' ? ' on' : '');
  $('t-low').className = SEC === 'low' ? 'on' : '';
  var cos = DATA[SEC] || [];
  var ai = allItems(), perDay = 0, gone = 0, known = 0, unk = 0;
  ai.forEach(function(it){ if (it.v == null){ unk++; return; } known++; perDay += it.v; if (it.h != null) gone += it.v * it.h / 24; });
  var sd = DATA.salesDays || 0;
  $('lost').innerHTML = (known && SEC === 'zero')
    ? '<div class="lost">💸 كل يوم نقص بيضيّع حوالي <b>' + money(perDay) + ' ج</b> من المبيعات' +
      (gone >= 1 ? '<br>ضاع من أول ما اتسجّل: <b>≈ ' + money(gone) + ' ج</b>' : '') +
      '<small>متوسط بيع كل صنف في آخر ' + sd + ' يوم × سعر الجمهور' + (sd < 7 ? ' · البيانات قليلة، التقدير تقريبي' : '') +
      (unk ? ' · ' + unk + ' صنف مفيش له مبيعات' : '') + '</small></div>'
    : (known ? '<div class="lost" style="background:var(--lowbg);border-color:#ecd9a8">🟡 لو خلصوا كلهم، الخسارة المتوقعة <b style="color:var(--low)">' + money(perDay) + ' ج / يوم</b><small>أصناف قربت تخلص · متوسط آخر ' + sd + ' يوم</small></div>' : '');
  /* نسبة التوافر: من مبيعاتنا اليومية، كام % أصنافها متوفرة (الناقص خالص بيتخصم) */
  var sc = '';
  if (SEC === 'zero' && DATA.revPerDay > 0 && sd >= 3){
    var zr = 0, nh = 0, sh = 0;
    (DATA.zero || []).forEach(function(c){ c.items.forEach(function(it){ if (it.v != null) zr += it.v; if (it.h != null){ nh++; sh += it.h; } }); });
    var pct = Math.max(0, Math.min(100, 100 * (1 - zr / DATA.revPerDay)));
    var tone = pct >= 97 ? ['ممتاز', 'var(--ok)'] : pct >= 93 ? ['جيد', 'var(--low)'] : ['محتاج تحسين', 'var(--bad)'];
    var avgD = nh ? sh / nh / 24 : null;
    sc = '<div class="score"><div class="pct" style="color:' + tone[1] + '">' + pct.toFixed(1) + '%</div><div>' +
      '<b style="color:' + tone[1] + '">' + tone[0] + '</b><small>نسبة التوافر: الجزء من مبيعاتنا اليومية (≈ ' + money(DATA.revPerDay) + ' ج) اللي أصنافه متوفرة دلوقتي</small>' +
      (avgD !== null ? '<small>متوسط بقاء الصنف ناقص: ' + (avgD < 1 ? Math.round(avgD * 24) + ' ساعة' : avgD.toFixed(1) + ' يوم') + ' (' + nh + ' صنف متسجّل)</small>' : '<small>مدة النقص بتظهر بعد ما سجل النواقص يشتغل يوم</small>') +
      '</div></div>';
  }
  $('score').innerHTML = sc;
  var tv = val(ai);
  $('vals').innerHTML = '<div class="vals"><div><small>سعر الصيدلي</small><b>' + money(tv.k) + ' ج</b></div>' +
    '<div><small>سعر الجمهور</small><b>' + money(tv.p) + ' ج</b></div></div>' +
    '<div class="vn">قيمة الطلب لآخر ' + DATA.days + ' يوم' + (tv.est ? ' · سعر الصيدلي تقديري لـ ' + tv.est + ' صنف' : '') +
    (tv.miss ? ' · ' + tv.miss + ' صنف بدون سعر' : '') + '</div>';
  if (!cos.length){ $('list').innerHTML = '<div class="state">🎉 مفيش نواقص في القسم ده</div>'; }
  else $('list').innerHTML = cos.map(function(c, i){
    var left = c.items.filter(function(it){ return !DONE[key(c.co, it.n)]; }).length;
    return '<div class="co' + (OPEN[SEC + c.co] ? ' open' : '') + '"><div class="ch" onclick="tog(' + i + ')">' +
      '<div><b>' + esc(c.co) + '</b><small>' + left + ' من ' + c.items.length + ' لسه مطلبش · صيدلي ' + money(val(c.items).k) + ' · جمهور ' + money(val(c.items).p) + '</small></div><span class="arw">‹</span></div>' +
      '<div class="cb"><div class="acts"><button onclick="copyCo(' + i + ')">نسخ الطلب</button>' +
      '<button class="q" onclick="waCo(' + i + ')">واتساب</button></div>' +
      c.items.map(function(it, j){
        var k = key(c.co, it.n);
        var stk = (it.s == null) ? '' : '<span class="st' + (it.s <= 0 ? ' z' : '') + '">الرصيد: ' + (Math.round(it.s * 10) / 10) + '</span>';
        return '<div class="it' + (DONE[k] ? ' done' : '') + '"><input type="checkbox"' + (DONE[k] ? ' checked' : '') +
          ' onchange="mark(' + i + ',' + j + ',this.checked)" aria-label="اتطلب">' +
          '<div class="n" onclick="copyName(' + i + ',' + j + ')"><span class="nm">' + esc(it.n) + '</span>' +
          '<span class="c">' + esc(it.c) + (stk ? ' · ' : '') + stk + '</span></div>' +
          (it.h != null && SEC === 'zero' ? '<span class="c" style="flex:none">' + (it.h < 24 ? Math.round(it.h) + ' س' : (it.h / 24).toFixed(1) + ' يوم') + '</span>' : '') +
          (it.v ? '<span class="rk">' + money(it.v) + ' ج/يوم</span>' : '') +
          '<span class="qty">' + it.q + '</span></div>';
      }).join('') + '</div></div>';
  }).join('');
  $('meta').textContent = 'اتحدّثت ' + (DATA.at || '') + ' · علامة "اتطلب" بتتحفظ على جهازك لحد آخر اليوم';
}
function tog(i){ var c = DATA[SEC][i]; OPEN[SEC + c.co] = !OPEN[SEC + c.co]; draw(); }
function mark(i, j, v){
  var c = DATA[SEC][i], it = c.items[j], k = key(c.co, it.n);
  if (v) DONE[k] = 1; else delete DONE[k];
  saveDone(); draw();
}
function coText(c, onlyLeft){
  var items = c.items.filter(function(it){ return !onlyLeft || !DONE[key(c.co, it.n)]; });
  return { n: items.length, t: '🛒 طلب — قسم ' + c.co + '\n' + today() + '\n\n' + items.map(function(it){ return '• ' + it.n + ' × ' + it.q + ' (' + it.c + ')'; }).join('\n') + '\n\nسعر الصيدلي: ' + money(val(items).k) + ' ج | سعر الجمهور: ' + money(val(items).p) + ' ج' };
}
function copyTxt(text){
  function fb(){ var ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('اتنسخ ✓'); } catch(e){ toast('معرفتش أنسخ'); } document.body.removeChild(ta); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('اتنسخ ✓'); }, fb); else fb();
}
function copyName(i, j){
  var it = DATA[SEC][i].items[j];
  copyTxt(it.n);
  toast('اتنسخ: ' + it.n);
}
function copyCo(i){ var r = coText(DATA[SEC][i], true); if (!r.n) return toast('كله اتطلب ✓'); copyTxt(r.t); }
function waCo(i){ var r = coText(DATA[SEC][i], true); if (!r.n) return toast('كله اتطلب ✓'); window.open('https://wa.me/?text=' + encodeURIComponent(r.t), '_blank'); }
function copyAll(){
  var parts = (DATA[SEC] || []).map(function(c){ return coText(c, true); }).filter(function(r){ return r.n; });
  if (!parts.length) return toast('مفيش حاجة تتنسخ');
  copyTxt(parts.map(function(r){ return r.t; }).join('\n\n──────────\n\n'));
}
(function(){
  loadDone();
  load();
})();
</script>
